# scripts/security/rules/kb-python-secrets.yaml
# ORIGINAL WORK. Not derived from any registry ruleset — see LICENCES.md.
# Scope: services/ai-service/.
#
# The provider credential crosses the internal wire deliberately, as a top-level
# `provider_credential` SecretStr field. Four constraints make that acceptable and all four are
# load-bearing; these rules enforce the two that code can violate silently.

rules:
  - id: kb-py-secret-value-into-telemetry
    languages: [python]
    severity: ERROR
    message: >-
      `.get_secret_value()` is intentionally greppable — SecretStr's repr(), str() and model_dump()
      all yield '**********' precisely so that reading the real value takes a deliberate call. This
      one hands it to a logger, a span attribute or an exception message. The credential is on the
      NEVER-FORWARD list: no SSE frame, no error envelope, no span attribute, no log field, no
      audit detail, no persisted snapshot. Decrypt inside the adapter, use it for one call, and let
      it die with the request.
    metadata:
      kb-invariant: "kb-security-baseline §18.2 — no credential reaches a log, a response or an audit row"
    pattern-either:
      - pattern: $LOG.$LEVEL(..., $X.get_secret_value(), ...)
      - pattern: $LOG.$LEVEL(f"...{$X.get_secret_value()}...")
      - pattern: $SPAN.set_attribute(..., $X.get_secret_value())
      - pattern: "$SPAN.set_attributes({..., $K: $X.get_secret_value(), ...})"
      - pattern: raise $E(..., $X.get_secret_value(), ...)
      - pattern: print(..., $X.get_secret_value(), ...)

  - id: kb-py-credential-inside-config-snapshot
    languages: [python]
    severity: ERROR
    message: >-
      The provider credential is a TOP-LEVEL field on the internal request body, never a member of
      the configuration snapshot. The snapshot exists to be PERSISTED AND REPLAYED — that is its
      entire purpose — so every path that stores one for the playground, for retrieval_traces, or
      for a queued job would store the plaintext key with it, into columns no redaction fixture
      covers. It is also hashed into configuration_version, so a key rotation would silently change
      cache keys and replay identity. Nothing alerts, because nothing here is an error.
    metadata:
      kb-invariant: "ADR-011 — excluded from the configuration-snapshot hash"
    pattern-either:
      - pattern: |
          $SNAP.provider_credential = $V
      - pattern: |
          ConfigSnapshot(..., provider_credential=$V, ...)
      - pattern: |
          {..., "provider_credential": $V, ...}

  - id: kb-py-genai-content-capture-enabled
    languages: [python]
    severity: ERROR
    message: >-
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT gates gen_ai.input.messages,
      gen_ai.output.messages, gen_ai.system_instructions and — aimed straight at a RAG system —
      gen_ai.retrieval.query.text and gen_ai.retrieval.documents. Those are the user's question and
      the retrieved tenant chunks. Setting it ships every conversation into Tempo, which has no
      per-tenant access control and a fixed retention. The bootstrap FAILS CLOSED on it; setting it
      anywhere, including local, defeats that.
    metadata:
      kb-invariant: "opentelemetry-instrumentation NN1 — unset in every environment"
    pattern-either:
      - pattern: os.environ["OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT"] = $V
      - pattern: os.environ.setdefault("OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT", $V)
      - pattern-regex: 'OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT\s*[=:]\s*["\x27]?(1|true|True)'

  - id: kb-py-genai-content-attributes-emitted
    languages: [python]
    severity: ERROR
    message: >-
      Setting a GenAI content attribute by hand bypasses the env-var gate entirely. So does
      inventing a `kb.query.text`. The ALLOW-LIST is the defence; the Collector's `transform`
      processor is only a backstop, and a backstop will miss the case you did not imagine.
    metadata:
      kb-invariant: "kb-observability-conventions — the label/attribute allow-list"
    pattern-regex: 'set_attributes?\(\s*["\x27](gen_ai\.(input\.messages|output\.messages|system_instructions|retrieval\.query\.text|retrieval\.documents)|kb\.query\.text|kb\.prompt)["\x27]'

  - id: kb-py-presigned-url
    languages: [python]
    severity: ERROR
    message: >-
      No presigned URL is generated anywhere in this codebase, for upload or download. It is an
      unrevokable bearer credential in a URL — it lands in access logs, in Referer on the next
      navigation, and in browser history, and it survives a role change, an org removal and a
      source deletion for its whole lifetime, so it cannot participate in the six checks every
      protected action performs. It would also require publishing the S3 gateway as a fifth public
      hostname in front of a service whose auth FAILS OPEN. Uploads are multipart/form-data to
      Laravel; downloads are a Laravel route that streams.
    metadata:
      kb-invariant: "seaweedfs-s3 — the proxy route, always"
    pattern-either:
      - pattern: $CLIENT.generate_presigned_url(...)
      - pattern: $CLIENT.generate_presigned_post(...)
