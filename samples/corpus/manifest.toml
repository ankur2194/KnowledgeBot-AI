[[fixture]]
id = "scanned-po-88214"
path = "corpus/documents/scanned/scanned-po-88214.pdf"
sha256 = "92508c21ac9b127fa66f64cf1d0d372d67a3f22496fbcbbe87b10a264f91fe59" # generated 2026-08-07
format = "application/pdf"                         # image-only, no text layer
page_count = 4                                     # pages, asserted by the generator
licence = "CC0-1.0"
synthetic = true
notes = """
Image-only scanned purchase order -- NO TEXT LAYER on any page, asserted by the
generator, because a stray text layer routes the file around OCR and silently turns this
into an ordinary PDF fixture that passes. Page 3 is DELIBERATELY DEGRADED.

MEASURED against rapidocr 3.9.2 / PP-OCRv6, not assumed. BOTH OCR warnings fire on page 3
and neither fires on a clean page: low-confidence character mass 0.6161 and ink-in-box
coverage 0.2070, against 0.1019/1.0000, 0.0000/0.9933 and 0.0000/0.9113 on pages 1, 2 and
4. Every e-004 fact stays recoverable.

CORRECTED 2026-08-07, and the superseded text is described rather than silently dropped
because it was acted on. This block previously reported that the CONFIDENCE warning "does
not -- and cannot, on this engine, at any degradation level" fire. The observation
reproduced; the explanation was wrong, twice. Degradation on this engine is expressed as
ABSENCE, not as low confidence, and the absence happens AT DETECTION: the detector
proposes fewer regions as the page degrades and nothing downstream removes them, so the
selection is made before recognition runs and therefore before any confidence statistic
exists. Neither of the two earlier explanations survived measurement through the real
entry point -- not the recogniser scoring only proposed boxes, and not the empty-box drop,
which fires on 1 of 14 measured pages and on none of this fixture's. The signals
accordingly read character mass below a per-cell trust floor and ink-in-box, never a mean
over boxes.

THE PAGE DID NOT CHANGE AND MUST NOT: ink = 0.150 ships exactly as authored, and the
digest above is unmoved by this correction. The sweep behind the mechanism, and the trap
that a fixture generator can measure things production never can, are in the directory
README, which is where OCR numbers are recorded in full.

No golden case depends on text unique to page 3 -- see the directory README for why.
"""

