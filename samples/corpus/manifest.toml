# Fixture manifest for the KnowledgeBot AI platform golden corpus.
#
# One entry per fixture document. This file defines the ID SPACE that golden cases
# reference. A case's `expected_sources` lists MANIFEST IDS, never filesystem paths,
# so renaming or reorganising a file is a manifest edit and not a silent break in
# forty-five YAML files.
#
# Rules:
#   * `id` is stable forever. Reusing an id for different content is the one edit
#     that makes historical runs lie. Retire an id, never recycle it.
#   * `sha256` is verified by the seeding step before any run. A mismatch aborts the
#     run; it never warns and continues.
#   * `synthetic` is true for every entry, and must stay true. See ../README.md.
#   * Changing any `sha256` requires bumping ../VERSION.
#
# ---------------------------------------------------------------------------
# ALL TEN FIXTURES ARE AUTHORED AND EVERY DIGEST BELOW IS REAL. No placeholders
# remain. The placeholder literal is deliberately not repeated anywhere in this
# comment block: it used to be, and the effect was that a line-counting grep for it
# returned ELEVEN for ten fixtures and could never reach zero however many fixtures
# were authored — a completion check structurally unable to report completion. Count
# rows, not lines: `app/evaluation/corpus.py` parses the TOML and reports per fixture.
#
# THE FIXTURES ARE GENERATED, NOT HAND-BUILT, AND THAT IS WHAT MAKES THE DIGESTS MEAN
# ANYTHING. `../tools/generate_corpus.py` writes all ten from the specifications in
# `documents/*/README.md`. Every generator clock is pinned — reportlab's invariant
# mode, OOXML zip entry timestamps, and `docProps/core.xml`, which openpyxl rewrites
# with the current time inside `save()` no matter what the workbook properties say.
# Regenerating on another machine, in another timezone, at another moment reproduces
# these exact bytes; `--verify` proves it before anyone trusts it.
#
# `page_count` is reconciled against the artefact and asserted by the generator, not
# copied from a README. Its unit differs per format and each entry says which.
#
# WHAT ENFORCES THIS: `services/ai-service/app/evaluation/corpus.py`.
# `verify_corpus()` recomputes every digest here and refuses the run on any mismatch,
# missing fixture, placeholder, or path escaping this directory. It is called first
# thing by `kb.evaluate.start_run`, and `EvaluationRunRecord` cannot be constructed
# without the `CorpusVerification` it returns — so an eval run that skipped the check
# cannot produce a comparable result. It carries two non-vacuity floors (at least ten
# fixtures declared, at least ten files actually read) because a hash check over an
# empty corpus exits 0 and logs exactly like one that verified everything.
#
# A directory fixture's digest is a TREE digest, defined byte-for-byte in that module
# under `TREE_DIGEST_SCHEME`. Do not invent a second definition of it.
#
# EDITING A FIXTURE IS EDITING A TEST. Almost every string in these documents is
# load-bearing for a named golden case, and several are load-bearing by being ABSENT —
# the handbook says nothing about parental leave (u-001), the price list has no
# KW-2200-C (u-004), the warranty pair is silent on consumables (fu-004), and the
# quarterly deck states no revenue total (u-007). Read the directory README's "must
# NOT contain" section before changing anything, then regenerate, then bump ../VERSION.
# ---------------------------------------------------------------------------

manifest_version = 1
corpus_version = "corpus-2026.08.1"

