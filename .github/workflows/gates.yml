# Enforcement gates — the checks CI owns rather than review.
#
# SCOPE, deliberately narrow: every job in this file is a pure text/file pass. No lockfile, no
# `composer install` / `uv sync` / `pnpm install`, no service containers, no secrets.
#
# That scope was ORIGINALLY chosen because no lockfile existed anywhere. THAT REASON IS GONE — all
# eight lockfiles are now committed (`services/core-api/composer.lock`,
# `services/ai-service/uv.lock`, its generated `requirements.lock`, and the per-importer
# `pnpm-lock.yaml` files under apps/{web,widget,mobile} and packages/{contracts,design-tokens},
# plus the root importer's). The scope SURVIVES for a different and better reason: these gates are
# sub-second text passes with no network, no cache and no credential, so they report in under a
# minute on a fork PR while the install-bearing jobs are still resolving. Keeping them separate is
# what makes them cheap enough to run unfiltered on every event.
#
# The dependency-installing jobs (Pest, pytest, Vitest, ESLint, `next build`, `size-limit`, the
# image builds and the scanners) now live in `.github/workflows/ci.yml`. Do not migrate a gate from
# here into there to "save a checkout": a gate that runs after `pnpm install` inherits that
# install's failure modes and stops being able to report on a PR that breaks the lockfile.
#
# Every gate below guards a violation that is SILENT: green tests, HTTP 200, no error, no log line.
# See `.claude/skills/github-actions-pipeline/SKILL.md` for why each one was moved out of review,
# and `references/workflow-jobs.md` for the reasoning attached to each grep.
#
# NO `continue-on-error`, NO `|| true` on a gate's own exit path, and no job here that is not on
# the required-check list. A gate that reports instead of failing is the same as deleting it.
#
# ------------------------------------------------------------------------------------------------
# A GATE COUNT IS NOT A COVERAGE NUMBER
# ------------------------------------------------------------------------------------------------
# Roughly a third of the checks below cannot fail on today's tree: the corpus they scan is a
# skeleton, so the banned token has nowhere to appear yet. They are worth landing as regression
# protection, and they are worth NOT mistaking for enforcement. Every job therefore ends with a
# `vacuous-today:` ledger step naming its own zero-candidate checks, so the job output states the
# gap instead of implying coverage. Delete a ledger line when the corpus it names grows a real
# call site — never delete the ledger.
#
# ------------------------------------------------------------------------------------------------
# DELIBERATELY NOT HERE — four audited claims that are RED today
# ------------------------------------------------------------------------------------------------
# A required check that cannot pass blocks every PR and is disabled within a week, so each of these
# stays out until the underlying artifact is fixed. Do not "add the missing gate" without first
# reading the reason:
#
#   * error-taxonomy -> alert-name diff — eight error classes are uncovered BY DESIGN and the
#     `TODO(ADR)` block at the top of `rules/kb-alerts.yml` (lines 20-31) enumerates them. Red until
#     each uncovered class has a rule or a recorded decision.
#   * `vuln-ignores.toml` `test_id` existence — its only entry names
#     `test_docling_no_remote_render.py`, which does not exist yet.
#   * `license_gate.py` model arm — two independent blockers, NEITHER of which is a count of
#     unresolved shas. This bullet used to quote one ("four `TODO-RESOLVE-SHA` revisions") and the
#     number was both wrong and perishable: four was the pre-ADR-030 model set, and the entries are
#     being resolved as this is written. A justification that has to be re-counted rots by design,
#     so it does not quote one. The two real blockers:
#       - the script exits 2 without SBOM inputs, regardless of the manifest's state;
#       - `models.manifest.toml`'s `docling-tableformer` row records `CDLA-Permissive-2.0`, read
#         from the model card at the pinned revision. That identifier is NOT in
#         `scripts/security/policy/licences.toml`'s `allow` list, and that list fails closed. So
#         even a fully resolved manifest fails this arm until adding CDLA-Permissive-2.0 is
#         reviewed as a licensing decision — which is exactly the "code and weights carry
#         different terms" case the model arm exists to catch, so it is red for the right reason.
#     Whether every revision is resolved is checkable in one command and belongs in the run output,
#     not in a comment:  grep -c TODO-RESOLVE-SHA services/ai-service/models.manifest.toml
#   * anything needing `composer install`, `uv sync`, `pnpm install`, a built image or a running
#     stack. THE OLD REASON HERE — "no lockfile exists in any ecosystem yet" — IS OBSOLETE: every
#     lockfile is now committed. Those jobs live in `.github/workflows/ci.yml`, which owns the
#     PHP + Python + Node job graph, the four image builds and the scanners. What is still owed
#     there (and deliberately absent, for the same "a required check that cannot pass" reason) is
#     listed in ci.yml's own header: the ADR-010 rebuild proof, the metric-catalog diff, the RLS
#     tripwire's isolation assertions, the licence gate and the image CVE scan.
name: gates

on:
  pull_request:
  merge_group: { types: [checks_requested] }
  push: { branches: [main] }

# NOT path-filtered, on purpose. A gate a PR can dodge by touching a different directory is not a
# gate, and a `paths:`-filtered required check never reports at all on a PR that misses the filter,
# which blocks the merge queue instead of passing it. Every job here is a sub-second text pass, so
# the cost of always running them is smaller than either failure mode.
concurrency:
  # cancel-in-progress must NOT apply to merge_group: a cancelled merge-queue check evicts the PR
  # from the queue and the author has to re-add it by hand.
  group: gates-${{ github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read # jobs needing more raise it locally, never here

# No `secrets.` reference appears anywhere in this file. GitHub hands a fork PR no repository
# secret and a read-only GITHUB_TOKEN; a self-hostable product gets fork PRs, so every required
# check has to be green without credentials rather than fail with a malformed-credential error.

jobs:
  # ------------------------------------------------------------------------------------------
  # enforcement-greps — the four source-invariant gates.
  # ------------------------------------------------------------------------------------------
  # THE `! grep` TRAP governs the shape of every step below. GitHub runs each `run:` with
  # `bash -e {0}`, and `set -e` is *specified* to ignore the failure of a command whose exit
  # status is inverted with `!`. So in a step with more than one check, only the LAST `! grep`
  # can fail the job; every earlier one prints its findings and exits 0, reading in the log
  # exactly like a working gate. Multi-check steps therefore accumulate (`fail=1` per violation,
  # `exit $fail`); only a single-check step may use `! grep`.
  enforcement-greps:
    # `runs-on` is pinned: `ubuntu-latest` rolls over a 1-2 month window and swaps the default
    # toolchain out from under a job that passed yesterday.
    runs-on: ubuntu-24.04
    # ----------------------------------------------------------------------------------------
    # The Qdrant detectors are defined ONCE, here, and consumed by THREE steps: the gate itself,
    # the self-test that proves the gate can fail, and the vacuity ledger that counts its corpus.
    # ----------------------------------------------------------------------------------------
    # They used to be spelled three times. That is the same defect the ALLOWED_TABLES import step
    # above exists to remove: three copies drift, and the copy that drifts is the one in the gate,
    # so the self-test keeps proving a pattern nothing enforces.
    env:
      # THE VERB LIST IS kb-tenancy-isolation's DEFINITION OF DONE, NOT A SAMPLE OF IT.
      # It was `query_points|search|scroll|count` — four verbs — and six tenant-facing ones scored
      # ZERO matches and merged green. Two of those six are not "less complete coverage", they are
      # different classes of bug:
      #   * `client.retrieve(ids=[...])` resolves points BY ID and ignores every payload filter, so
      #     an unfiltered one is a cross-tenant EXISTENCE ORACLE — 200, fast, no log line.
      #   * `client.delete(points_selector=...)` unfiltered DESTROYS another tenant's index, and
      #     non-negotiable 6 says deletion targets stable identifiers and is verified afterwards.
      # `set_payload` / `overwrite_payload` / `delete_payload` / `clear_payload` are the write-side
      # equivalents: they mutate the payload the filters themselves are built on.
      KB_QDRANT_CALLS: 'query_points\(|query_batch_points\(|query_groups\(|\.search\(|scroll\(|count\(|\.retrieve\(|\.delete\(|\.set_payload\(|\.overwrite_payload\(|\.delete_payload\(|\.clear_payload\(|\.recommend\(|\.discover\(|\.facet\('
      # WHOLE-LINE COMMENTS ARE DROPPED, and that is what makes the wider verb list shippable.
      # `.retrieve(` appears today in app/providers/anthropic.py:180 inside a `#:` comment about the
      # ANTHROPIC SDK's `models.retrieve(...)` — nothing to do with Qdrant. Excluding the providers
      # directory by path would have been the wrong fix (it would then hide a real Qdrant call
      # there); excluding a line that starts with `#` is exact, because a call inside a comment is
      # not a call. Docstring PROSE is not covered by this and does not need to be: the one file
      # that carries such prose (app/retrieval/search.py) is the named file exemption already.
      KB_COMMENT_LINE: "^[^:]*:[0-9]+:[[:space:]]*#"
      # THE SAME ARGUMENT, IN PHP, AND IT IS NOT HYPOTHETICAL EITHER. The tenancy escape-hatch gate
      # below was RED on a correct tree, self-tripped by the one file whose job is to explain it:
      #   services/core-api/app/Models/Scopes/OrganizationScope.php:16-17
      #     " * catches the query somebody forgot to route through one. It fails silently for
      #       `DB::table()`, `DB::select()`, raw SQL and `withoutGlobalScopes()` … which is why CI
      #       greps for all three as well."
      # A PHPDoc block naming the three banned constructs, ending with a sentence about this very
      # gate. The `tenancy-exempt:` escape is the wrong instrument for it — that marker means "a
      # reviewed raw query lives here", and spending it on prose devalues every real use. Path
      # exclusion is wrong for the same reason it was wrong for app/providers: it would then hide a
      # genuine `DB::table(` in the scope class. Dropping COMMENT LINES is exact, because a call
      # inside a comment is not a call. Covers `//`, `#`, and both halves of a `/* … */` block.
      KB_PHP_COMMENT_LINE: '^[^:]*:[0-9]+:[[:space:]]*(//|#|\*|/\*)'
      # PREFETCH TAKES `filter=`, NOT `query_filter=`. This was inverted and the gate was backwards:
      #   models.Prefetch(query=v, using="dense", limit=20, filter=f)   <- CORRECT, was FLAGGED
      #   models.Prefetch(query=v, using="dense", limit=20)             <- UNFILTERED, PASSED if the
      #                                                                    line mentioned query_filter
      # `query_filter=` is the TOP-LEVEL query_points parameter; a prefetch leaf's own filter is
      # `filter=` (kb-tenancy-isolation: "note the name: top level is query_filter, Prefetch is
      # filter"). Vacuous so far only because no Prefetch( exists yet — it would have gone red on
      # the first correct hybrid query anyone wrote, and the only way past it would have been to
      # add the words "query_filter" to a comment, i.e. to green the gate by lying to it.
      #
      # The pattern therefore matches `filter=` NOT preceded by `_` or a letter, so `query_filter=`
      # in a comment does NOT satisfy it. `grep -v 'filter='` (the obvious fix) would have been
      # satisfied by the substring inside `query_filter=` and re-created the same hole.
      KB_PREFETCH_FILTERED: "[^_a-zA-Z]filter[[:space:]]*="
      # ------------------------------------------------------------------------------------
      # THE SQL-WRITE DETECTOR, IN TWO ARMS, AND THE SPLIT IS A BUG FIX.
      # ------------------------------------------------------------------------------------
      # It used to be one case-insensitive pattern with no anchor:
      #     (insert into|update|delete from|copy)[[:space:]]+"?[a-z_][a-z0-9_]*"?
      # and it MATCHED ORDINARY ENGLISH PROSE, failing the job on correct code in two separate
      # files the moment services/ai-service grew docstrings:
      #     app/providers/contract.py:669  "…this name. The consumer's copy is"
      #     app/providers/capabilities.py:99  "copy and imported this one."
      # `copy is` and `copy and` both satisfy `copy[[:space:]]+<word>` under `grep -i`. That is
      # the required-check-that-cannot-pass failure mode, and the next person greens the build by
      # deleting the sentence.
      #
      # Every real write in this service is psycopg TEXT, so the keyword either begins a line
      # (inside a triple-quoted string, possibly indented) or follows a string literal's opening
      # quote. Two arms, and each drops a different kind of prose:
      #
      #   ANCHORED — line start, matched CASE-SENSITIVELY. `INSERT INTO` / `DELETE FROM` /
      #     `UPDATE` / `COPY` uppercase, plus lowercase `insert into` / `delete from` because
      #     those two-word forms are unambiguous. Bare lowercase `update`/`copy` at line start is
      #     deliberately NOT here: that is exactly the prose above. The residual gap — lowercase
      #     `update x` at the start of a line in a triple-quoted string — is covered in practice
      #     by check (b), which fails on a keyword ending a line, and by the allow-list exclusion
      #     being case-insensitive.
      #   QUOTED — after a `"`, `'` or backtick, matched case-INSENSITIVELY. Prose never puts a
      #     quote immediately before "copy is".
      #
      # NOTE THE `''` IN THE VALUES BELOW: these are YAML single-quoted scalars, where a literal
      # apostrophe is written by DOUBLING it. Shell-style `'"'"'` splicing is not YAML and makes
      # the whole file unparseable — which fails every job in it, not just this one.
      KB_SQL_WRITE_ANCHORED: '^[[:space:]]*(INSERT[[:space:]]+INTO|DELETE[[:space:]]+FROM|UPDATE|COPY|insert[[:space:]]+into|delete[[:space:]]+from)[[:space:]]+"?[a-z_][a-z0-9_]*"?'
      KB_SQL_WRITE_QUOTED: '["''`][[:space:]]*(insert[[:space:]]+into|update|delete[[:space:]]+from|copy)[[:space:]]+"?[a-z_][a-z0-9_]*"?'
    steps:
      - uses: actions/checkout@v7

      - name: Data-plane allow-lists come from the modules, not from this file
        run: |
          # `services/ai-service/app/db/writes.py` says, on the line above the tuple: "CI reads this
          # module to enforce it, so the tuple is the single place the list exists — do not restate
          # it in a docstring elsewhere." This step is what makes that true. Until it existed, the
          # table gate below hardcoded the four names and never opened the module — a second copy of
          # exactly the list the module forbids duplicating, and one that drifts SILENTLY: renaming
          # a table in `ALLOWED_TABLES` would leave the gate enforcing the old spelling, so the new
          # name reads as a violation and the old one keeps passing.
          #
          # THE MODULES ARE READ TWO WAYS, AND THE SPLIT IS FORCED RATHER THAN CHOSEN.
          # `python:3.13-slim`, no `pip install`, the repo mounted read-only — so a constant is
          # reachable by IMPORT only while its module needs no wheel. `app/db/writes.py` and
          # `app/core/errors.py` are stdlib-only and are imported, which matters for errors.py in
          # particular because its value IS its four import-time assertions.
          #
          # `app/retrieval/collection.py` is NOT importable here any more: it now does
          # `from qdrant_client import models` at line 81, and `app/retrieval/tenancy.py` does the
          # same. So PAYLOAD_INDEXES is read with `ast` instead — stdlib, no execution of data-plane
          # code at all, and it cannot be defeated by an import that lands next week. That is not a
          # workaround, it is the stronger reading for a literal tuple: `pyast` refuses anything
          # that is not a module-level literal sequence rather than evaluating it.
          #
          # WHAT THE AST READER CANNOT DO is why `MANDATORY_FILTER_KEYS` is absent from (a). The
          # Python test `tests/unit/test_delete_keys.py` additionally asserts
          # `chunk_id not in MANDATORY_FILTER_KEYS` and `MANDATORY_FILTER_KEYS < set(DELETE_KEYS)`;
          # both are relations between three modules and both are that test's job, in ci.yml,
          # behind `uv sync`. Reproducing them here by parsing a fourth file would be a second
          # implementation of a test that already exists. (a) asserts the one relation that makes
          # `$KB_DELETE_KEYS` — exported below and leaned on by a gate — worth leaning on.
          #
          # The lists are exported to $GITHUB_ENV and consumed by the two steps below, which
          # SUBTRACT them from what they find in the source. Those consumers must keep importing:
          # a private copy there drifts silently.
          #
          # What this step does is different in kind. It CONSTRAINS the lists rather than
          # consuming them, and a constraint expressed in terms of the thing it constrains is not
          # a constraint. See (b) for the full argument and for why one assertion below is
          # deliberately a pinned list of names.
          #
          # ACCUMULATE, never `! grep`: every assertion below adds to `fail` rather than exiting,
          # so a failure in (a) cannot hide one in (c). The number of assertions is deliberately
          # not stated — it is the kind of count that rots, which is the subject of (b).
          set -u; fail=0
          flag() { echo "::error::$1"; fail=1; }
          py() { docker run --rm -v "$PWD/services/ai-service:/w:ro" -w /w python:3.13-slim python -c "$1"; }

          # The AST reader. Takes a file and a module-level name; prints the names in it, in
          # order, `|`-joined. Accepts a tuple/list of string literals (DELETE_KEYS) or of calls
          # whose first positional argument is a string literal (PAYLOAD_INDEXES' PayloadIndex
          # rows). REFUSES everything else — a comprehension, a `+` of two tuples, a name built at
          # import — because a reader that silently returned fewer names would turn (a)'s two set
          # differences into statements about one operand, which is the defect (a) exists to
          # remove. It never imports and never evaluates the data plane.
          AST_PROG=$(cat <<'PYEOF'
          import ast, sys
          src, want = sys.argv[1], sys.argv[2]
          out = []
          for node in ast.parse(open(src, encoding="utf-8").read(), src).body:
              if isinstance(node, ast.Assign):
                  targets = node.targets
              elif isinstance(node, ast.AnnAssign):
                  targets = [node.target]
              else:
                  continue
              if not any(isinstance(t, ast.Name) and t.id == want for t in targets):
                  continue
              value = node.value
              if not isinstance(value, (ast.Tuple, ast.List)):
                  sys.exit(f"{want} in {src} is {type(value).__name__}, not a literal tuple or list")
              for element in value.elts:
                  if isinstance(element, ast.Constant) and isinstance(element.value, str):
                      out.append(element.value)
                  elif (isinstance(element, ast.Call) and element.args
                        and isinstance(element.args[0], ast.Constant)
                        and isinstance(element.args[0].value, str)):
                      out.append(element.args[0].value)
                  else:
                      sys.exit(f"{want}[{len(out)}] in {src} is neither a string literal nor a "
                               f"call whose first argument is one; this reader will not guess")
          if not out:
              sys.exit(f"{want} is not a module-level literal sequence in {src}")
          print("|".join(out))
          PYEOF
          )
          pyast() { docker run --rm -v "$PWD/services/ai-service:/w:ro" -w /w python:3.13-slim python -c "$AST_PROG" "$1" "$2"; }

          # DELETE_KEYS is read the same way, and deliberately so even though `filters.py` still
          # imports cleanly today: its `qdrant_client` import is behind `if TYPE_CHECKING`, and
          # the module's own docstring says the runtime import "lands in the same change as the
          # first real body". When that change lands, an import-based read of this constant breaks
          # the whole step — including the ALLOWED_TABLES and taxonomy checks that have nothing to
          # do with deletion. Reading it as text keeps (a) alive across that change.
          delete_keys=$(pyast app/deletion/filters.py DELETE_KEYS)
          allowed=$(py 'from app.db.writes import ALLOWED_TABLES; print("|".join(ALLOWED_TABLES))')
          # kb-tenancy-isolation's payload contract, READ OUT OF THE MODULE THAT OWNS IT rather
          # than restated. `app/retrieval/collection.py` creates these indexes before the first
          # point is written; they are the payload floor that makes a tenant filter expressible.
          payload=$(pyast app/retrieval/collection.py PAYLOAD_INDEXES)
          echo "DELETE_KEYS      = $delete_keys"
          echo "PAYLOAD_CONTRACT = $payload"
          echo "ALLOWED_TABLES   = $allowed"

          # ────────────────────────────────────────────────────────────────────────────────────
          # (a) THE DELETE-KEY ALLOW-LIST. MEMBERSHIP AGAINST A REAL CONTRACT, NEVER A COUNT.
          # ────────────────────────────────────────────────────────────────────────────────────
          # THIS BLOCK USED TO BE THREE ASSERTIONS AND TWO OF THEM WERE A TAUTOLOGY:
          #     n=$(… | grep -c .);                        [ "$n" = "7" ]
          #     … | grep -qx 'chunk_id'
          #     m=$(… | grep -vx 'chunk_id' | grep -c .);  [ "$m" = "6" ]
          # Given the first two, THE THIRD IS ARITHMETIC — seven keys, one of which is chunk_id,
          # leaves six. It could not fail. Worse, its message claimed to be checking that
          # "kb-tenancy-isolation's payload contract is SIX fields" while no six-field contract
          # was opened anywhere in this job: the number 6 was read off DELETE_KEYS itself.
          #
          # AND THE THREE TOGETHER PASSED ON A BREACH. Swap `content_hash` in for `source_status`:
          #     ("org_id", "bot_ids", "source_id", "source_item_id", "source_version_id",
          #      "content_hash", "chunk_id")
          # is still seven keys, still contains chunk_id, and is still six without it. Green —
          # while one of the four mandatory tenant filters has silently left the delete path and a
          # CONTENT-ADDRESSED key has entered it. That is both halves of non-negotiable 6 at once,
          # and a cardinality cannot see either, because a swap does not change one.
          #
          # The relation that actually holds is between TWO INDEPENDENTLY MAINTAINED MODULES in
          # two packages — `app/deletion/filters.py` and `app/retrieval/collection.py` — and it is
          # the pair `services/ai-service/tests/unit/test_delete_keys.py` asserts in Python
          # (`test_delete_keys_is_the_payload_contract_plus_chunk_id`):
          #     set(DELETE_KEYS) - PAYLOAD_CONTRACT == {"chunk_id"}
          #     PAYLOAD_CONTRACT - set(DELETE_KEYS) == frozenset()
          # NOT A DUPLICATE OF THAT TEST. It runs in ci.yml behind `uv sync`; this runs in the
          # no-lockfile tier that reports on a fork PR in under a minute, and it is what makes the
          # allow-list `$KB_DELETE_KEYS` — exported below and consumed by the deletion-key grep —
          # something a gate may lean on at all.
          #
          # Both directions are asserted, because they fail differently. A payload field ADDED in
          # collection.py with no matching delete key is a term deletion can never address; a
          # payload field REMOVED leaves a delete key indexed nowhere, which is a filter that
          # matches nothing and looks exactly like an empty corpus — HTTP 200, no exception.
          tmpd=$(mktemp -d)
          setof() { printf '%s' "$1" | tr '|' '\n' | sed '/^$/d' | sort -u; }
          setof "$delete_keys" > "$tmpd/dk"
          setof "$payload"     > "$tmpd/pc"
          # NON-VACUITY FIRST. Both assertions below are set DIFFERENCES, and a difference against
          # an empty set is a statement about one operand only — the same defect the Python test
          # carries `test_the_two_contracts_this_file_compares_against_are_populated` for.
          [ -s "$tmpd/dk" ] || flag "DELETE_KEYS read as empty; both set differences in (a) are then statements about one operand and cannot fail"
          [ -s "$tmpd/pc" ] || flag "PAYLOAD_INDEXES read as empty; both set differences in (a) are then statements about one operand and cannot fail"
          # DUPLICATES, which `sort -u` above has already discarded. Both differences would still
          # pass with `("org_id", "org_id", …)`; the delete-key gate's allow-list alternation would
          # still work; and `app/deletion/filters.py`'s own import-time no-duplicate assert is no
          # longer executed by this step, so nothing else here would notice.
          raw=$(printf '%s' "$delete_keys" | tr '|' '\n' | sed '/^$/d' | grep -c .)
          uniq=$(wc -l < "$tmpd/dk")
          [ "$raw" = "$uniq" ] \
            || flag "DELETE_KEYS names $raw key(s) but only $uniq distinct one(s); a duplicated key passes every set comparison in (a) and hides whichever key it replaced"
          only_delete=$(comm -23 "$tmpd/dk" "$tmpd/pc" | paste -sd' ' -)
          only_payload=$(comm -13 "$tmpd/dk" "$tmpd/pc" | paste -sd' ' -)
          echo "DELETE_KEYS - PAYLOAD_CONTRACT = [$only_delete]  (must be exactly [chunk_id])"
          echo "PAYLOAD_CONTRACT - DELETE_KEYS = [$only_payload]  (must be empty)"
          [ "$only_delete" = "chunk_id" ] \
            || flag "DELETE_KEYS minus the payload contract is [$only_delete]; it must be exactly [chunk_id]. Anything else there is a key deletion may name that no point is indexed on — a filter that matches nothing and reads as an empty corpus — or, if it is content-addressed (text, content_hash, title, url), a delete that cuts a hole in a different tenant's source. app/deletion/filters.py and app/retrieval/collection.py disagree; fix the one that moved."
          [ -z "$only_payload" ] \
            || flag "the payload contract carries [$only_payload], which DELETE_KEYS does not; deletion cannot address a field every point is indexed on. Add it to DELETE_KEYS in app/deletion/filters.py, to CI_ALLOW_LIST in tests/unit/test_delete_keys.py, and say in the description why deletion needs to reach it."
          # chunk_id, asserted by name. STRICTLY IMPLIED by the difference above — kept anyway,
          # and the implication is written down so nobody reads it as independent coverage. It
          # earns its two lines on the message alone: "DELETE_KEYS minus the payload contract is
          # []" is a true report of a set operation, while this one names the runtime symptom, and
          # the person who hits it is inside a worker traceback, not inside a set-theory diff.
          printf '%s\n' "$(cat "$tmpd/dk")" | grep -qx 'chunk_id' \
            || flag "chunk_id is missing from DELETE_KEYS; single-chunk deletion would raise inside a worker on the one path nobody exercises by hand"

          # ────────────────────────────────────────────────────────────────────────────────────
          # (b) THE WRITE ALLOW-LIST. MEMBERSHIP AND PROPERTIES, NEVER A CARDINALITY.
          # ────────────────────────────────────────────────────────────────────────────────────
          # THIS BLOCK USED TO BE ONE LINE:  [ "$t" = "4" ] || flag "…the data plane writes four"
          # and that line was a TAUTOLOGY WITH A DELAY. It did not constrain ALLOWED_TABLES, it
          # TRACKED it — one number restating another, in a file the same PR edits. Both halves
          # of the failure are real and both happened or would have:
          #   * IT FAILED ON CORRECT CODE. Finding C2 restored the sparse arm with locally
          #     computed BM25 and legitimately took the list from four names to six
          #     (`sparse_version_statistics`, `sparse_term_frequencies`). Every property below
          #     holds for both; the gate went red anyway, because 6 != 4.
          #   * IT WOULD HAVE PASSED ON A BREACH. `ALLOWED_TABLES = ("conversations", "users",
          #     "organizations", "audit_logs")` is four names and satisfies it exactly. The only
          #     person a count can stop is one who adds a table and forgets to bump it — and the
          #     person who remembers to bump it is precisely the person this gate exists to stop.
          # A count is bumped in the same commit that breaks the rule, by the same hand, and the
          # diff line reads `4` -> `5`, which carries no information a reviewer can act on.
          #
          # `app/db/writes.py` says so itself: "The invariant is not the number — it is the three
          # properties every name on the list has." Those properties are:
          #   1. THE ROW IS DERIVED AND REBUILDABLE in the ADR-010 sense.
          #   2. THE PUBLIC API NEITHER READS NOR WRITES IT.
          #   3. LARAVEL OWNS THE MIGRATION.
          # (b1)-(b4) below take each in turn: what a text pass in this tier can genuinely
          # decide, and — printed in the output rather than papered over with a proxy — what it
          # cannot.

          tables=$(printf '%s' "$allowed" | tr '|' '\n' | sed '/^$/d')
          [ -n "$tables" ] || flag "ALLOWED_TABLES imported as empty; every assertion in (b) is then vacuous"
          # $KB_PHP_COMMENT_LINE is the job-level definition, shared with the tenancy escape-hatch
          # gate and used by both (b2) and (b3) below. Not a private copy: the copy that drifts is
          # always the one doing the enforcing.
          : "${KB_PHP_COMMENT_LINE:?job env did not define the PHP comment-line filter}"

          # ── (b1) MEMBERSHIP IS PINNED HERE, BY NAME. ────────────────────────────────────────
          # Property 1 is not decidable by any grep (see b4), so the review stop has to have an
          # anchor OUTSIDE the module — otherwise the only thing standing between the allow-list
          # and `conversations` is a reviewer noticing a line in a tuple. A pinned list of NAMES
          # is the weakest anchor that still makes every membership change a diff someone has to
          # approve, including the two a count cannot see at all: a SWAP (one name out, one in,
          # cardinality unchanged) and a RENAME.
          #
          # IT IS NOT THE DUPLICATE THE REST OF THIS STEP EXISTS TO REMOVE, and the difference is
          # which way divergence fails. The write gate CONSUMES the list to subtract legitimate
          # writes; a private copy there drifts SILENTLY — rename a table and the gate keeps
          # subtracting the old spelling, so the new name reads as a violation and the old one
          # keeps passing. That is why that gate still imports $KB_ALLOWED_TABLES and must keep
          # doing so. This assertion CONSTRAINS the list, so any divergence is a loud failure on
          # the very next run. A checkpoint cannot fall out of sync unnoticed; that is what makes
          # it a checkpoint rather than a copy.
          #
          # HONEST LIMIT: this stops a table arriving unreviewed. It cannot stop a reviewer who
          # approves the pin without checking the three properties. It buys a name in a diff and
          # a place to write down what that name has to prove — which is strictly more than `4`
          # bought, and strictly less than enforcement.
          KB_TABLE_REVIEW_PIN='chunks document_elements retrieval_traces evaluation_results sparse_version_statistics sparse_term_frequencies'
          got=$(printf '%s\n' "$tables" | sort -u | paste -sd' ' -)
          exp=$(printf '%s' "$KB_TABLE_REVIEW_PIN" | tr ' ' '\n' | sed '/^$/d' | sort -u | paste -sd' ' -)
          echo "ALLOWED_TABLES  = [$got]"
          echo "reviewed pin    = [$exp]"
          [ "$got" = "$exp" ] \
            || flag "ALLOWED_TABLES is [$got]; the reviewed set is [$exp]. A name may only join this list by demonstrating the three properties in app/db/writes.py's docstring — derived and rebuildable, untouched by the public API, migrated by Laravel. Add it to KB_TABLE_REVIEW_PIN in the SAME pull request and say in the description which property justifies it."

          # ── (b5) THE VENDORED SAST RULE'S ALLOW-LIST IS THE SAME LIST. ─────────────────────
          # #106a. `scripts/security/rules/kb-python-tenancy.yaml` carries the write allow-list
          # inside a REGEX NEGATIVE LOOKAHEAD, because a regex cannot import a Python tuple. That
          # copy is different in kind from every other restatement this job polices, in the one way
          # that matters: it is EXECUTABLE. Prose copies are found by a prose sweep; a number
          # encoded in a lookahead is found by nothing.
          #
          # It had already drifted, and the drift was invisible for exactly that reason. Until
          # 2026-08-11 the lookahead allow-listed four names while ALLOWED_TABLES held six, so the
          # rule reported four LEGITIMATE ADR-033 writes — app/deletion/relational.py:226,233,241,
          # 248 — as ERRORs. `docs/22` recorded the "exactly four" claim as closed; that closure was
          # scoped to `.claude/`, which is genuinely clean, and this file was never in its haystack.
          # (Reported upward: docs/22's check should widen from `.claude/` to the whole tree.)
          #
          # The rule cannot be RUN here — ghcr.io/opengrep/opengrep answers `denied` to an anonymous
          # pull, which is why ci.yml's Opengrep job was written and then removed. So this assertion
          # is what keeps the ruleset honest in the meantime, and it is the half that would have
          # caught the drift even if the scanner HAD been running: a scanner reports findings, and
          # four false findings on correct code read as four defects, not as a stale rule.
          #
          # DIRECTION OF FAILURE: loud, on the next run, in both directions — a name added to
          # ALLOWED_TABLES without touching the rule, or a lookahead edited without the module.
          RULE_FILE=scripts/security/rules/kb-python-tenancy.yaml
          [ -f "$RULE_FILE" ] || flag "$RULE_FILE is missing; the executable copy of the write allow-list cannot be checked"
          # Only the lookaheads that mention a table are the allow-list; the cache-key rule in the
          # same file carries an unrelated `(?!\{org_id\}|…)`. Scoping on `chunks` rather than on
          # rule id keeps this working if the rule is renamed again.
          lookaheads=$(grep -oE '\(\?\![^)]*\)' "$RULE_FILE" | grep -F 'chunks' || true)
          nlook=$(printf '%s\n' "$lookaheads" | sed '/^$/d' | grep -c . || true)
          echo "table-allow-list lookaheads in $RULE_FILE: $nlook"
          # Non-vacuity. Zero lookaheads means the extraction broke (a rewritten rule, a different
          # regex flavour) and every comparison below would be a set difference against nothing.
          [ "${nlook:-0}" -ge 1 ] \
            || flag "no table allow-list lookahead found in $RULE_FILE; the extraction is returning nothing and (b5) is vacuous. If the rule was rewritten to express the allow-list another way, teach this step to read the new form IN THE SAME CHANGE."
          rule_bad=0
          for la in $lookaheads; do
            got=$(printf '%s' "$la" | sed 's/^(?!//; s/)$//' | tr '|' '\n' | sed 's/\\b$//' | sed '/^$/d' | sort -u | paste -sd' ' -)
            [ "$got" = "$(printf '%s\n' "$tables" | sort -u | paste -sd' ' -)" ] || rule_bad=1
          done
          [ "$rule_bad" = "0" ] \
            || flag "$RULE_FILE's write allow-list lookahead(s) do not match ALLOWED_TABLES [$(printf '%s\n' "$tables" | sort -u | paste -sd' ' -)]. This is the ONLY executable copy of that list — a stale lookahead makes the SAST rule report correct code as a violation, and no prose sweep can see a name encoded inside a regex. Update every lookahead in the rule in the SAME pull request as app/db/writes.py."

          # ── (b2) PROPERTY 3 — LARAVEL OWNS THE MIGRATION. Decidable, with a trigger. ────────
          # The control-plane migrations issue raw DDL through `Schema::getConnection()->
          # statement(...)` rather than `Schema::create('x', …)`, so the table names are greppable
          # text in the SQL, not PHP call arguments. Read them off that.
          #
          # ENFORCED FOR THE NAMES THE DATA PLANE ACTUALLY WRITES, not for every listed name, and
          # that is the difference between a gate and a blocked repository. Four of the six names
          # have no migration in the tree yet and `services/ai-service` issues no SQL at all, so
          # demanding a migration per listed name would be a required check that cannot pass —
          # the failure mode this file's header forbids. Allow-listing a table ahead of its
          # schema is fine; WRITING to a table Laravel does not define is not, and the first
          # write is the trigger. Today that corpus is empty and the ledger at the end of this
          # job says so.
          #
          # COMMENT LINES ARE DROPPED HERE TOO, and here the direction of the error is the
          # dangerous one: these migrations carry long PHPDoc blocks, and a sentence containing
          # "create table chunks" would add `chunks` to $migrated and SILENTLY SATISFY the check
          # for a table nothing actually creates. A false name in this set weakens the gate; a
          # missing one only makes it noisier. Hence `-n` plus the filter, not `-ho`.
          migrated=$(grep -rniE 'create[[:space:]]+table([[:space:]]+if[[:space:]]+not[[:space:]]+exists)?[[:space:]]+"?[a-z0-9_]+"?' \
                       services/core-api/database/migrations 2>/dev/null \
                     | grep -vE "$KB_PHP_COMMENT_LINE" \
                     | grep -oiE 'create[[:space:]]+table([[:space:]]+if[[:space:]]+not[[:space:]]+exists)?[[:space:]]+"?[a-z0-9_]+"?' \
                     | sed -E 's/.*[[:space:]]//; s/"//g' | sort -u || true)
          echo "tables created by a Laravel migration: [$(printf '%s' "$migrated" | paste -sd' ' -)]"
          # Non-vacuity: an extraction that returns nothing makes every "has no migration" answer
          # below a false negative dressed as a pass. `organizations` is the control plane's
          # oldest table and its migration is not going anywhere.
          printf '%s\n' "$migrated" | grep -qx 'organizations' \
            || flag "the migration-DDL extraction did not find 'organizations'; it is returning nothing useful and (b2) cannot distinguish a migrated table from an unmigrated one"
          # ── (b2·#79) THE KNOWN-RED PIN, AND WHY IT CANNOT OUTLIVE ITS CAUSE. ───────────────
          # #79. `app/deletion/relational.py:200,204,210,217` issues four DELETEs against
          # `chunks` and `document_elements` while no Laravel migration creates either. That is a
          # REAL property-3 violation and the loop below is right to see it. Ankur ruled on
          # 2026-08-12 that it is PINNED KNOWN-RED rather than fixed, because both repairs are
          # worse than the finding: writing the two migrations drags in the
          # source_versions -> source_items -> knowledge_sources cascade that is explicitly out of
          # scope, and narrowing the purge plan would shrink deletion coverage before the tables
          # it purges exist. The pin comes out when the source lifecycle lands.
          #
          # A PIN THAT KEEPS QUIETLY PASSING AFTER ITS CAUSE IS GONE IS THE VACUITY DEFECT THIS
          # WHOLE JOB EXISTS TO REMOVE, REPRODUCED INSIDE THE FIX FOR IT. This file has caught
          # that exact shape three times already: `[ "$t" = "4" ]`, which went false the moment a
          # legitimate table was added; the `! yq` inversion that turned a missing tool into a
          # green PASS; and #134's positive control that validated its own private copy of the
          # flags, so deleting the real flag left the control reporting 2/2 and the step green.
          #
          # So this is NOT A SKIP. Each pinned name must STILL be both (i) written by the data
          # plane and (ii) not created by any Laravel migration, and the moment either stops being
          # true this step EXITS 1 DEMANDING THE PIN'S REMOVAL. A pinned name gaining a migration
          # is a SUCCESS that fails the build until the pin is deleted — which is the only
          # arrangement under which "we will take it out later" is not a lie.
          #
          # THREE WAYS THE PIN CAN OUTLIVE ITS CAUSE; ALL THREE ARE FATAL:
          #   * the name gains a migration      -> caught on the `migrated` branch below
          #   * the name stops being written    -> caught on the empty-$w branch below
          #   * the name leaves ALLOWED_TABLES  -> the loop never visits it at all, so the CLOSING
          #     SET COMPARISON after the loop catches it. (b1) would fail too, but a pin whose
          #     liveness depends on a DIFFERENT check staying alive is not pinned, it is hoped for.
          #
          # AND IT IS NEVER SILENT. Every pinned name prints a ::warning:: naming #79 and the date
          # it was pinned, and the ledger line after the loop prints on every run — including when
          # the pin is empty. Silence is how a pin becomes permanent.
          KB_MIGRATION_PIN_79='chunks document_elements'
          KB_MIGRATION_PIN_79_DATE='2026-08-12'
          # Membership by WHOLE LINE, never substring: `chunks` must not pin `chunks_archive`.
          # Same `tr`/`sed`/`grep -qx` transform (b1) uses on its pin, deliberately — one idiom in
          # this step, one failure mode to understand.
          pinned79() { printf '%s' "$KB_MIGRATION_PIN_79" | tr ' ' '\n' | sed '/^$/d' | grep -qx "$1"; }
          # NEGATIVE CONTROL ON THE MATCHER ITSELF, and it is the load-bearing one. A `pinned79`
          # that answered true for everything would convert every genuine property-3 violation
          # below into a warning and this gate would read green forever. It calls THE GATE'S OWN
          # function — not a private re-implementation, which is precisely how #134's control
          # managed to pass while the thing it claimed to check was deleted. The POSITIVE half is
          # not a separate control: the closing set comparison IS it, because that comparison
          # cannot pass unless this same function matched every pinned name on the real corpus.
          # `users` is Laravel's — migrated, served, and never a candidate for this pin.
          if pinned79 users; then
            flag "the #79 pin matcher answers true for 'users', which is not on the pin — it is matching everything, so every property-3 violation below is being downgraded to a warning and (b2) is enforcing nothing"
          fi
          pin_seen=''
          pending=''
          for tbl in $tables; do
            if printf '%s\n' "$migrated" | grep -qx "$tbl"; then
              # MIGRATED — property 3 holds, nothing further to check. But for a PINNED name this
              # is the outcome the pin was waiting for, so the build fails until the pin is gone.
              if pinned79 "$tbl"; then
                flag "'$tbl' now HAS a Laravel migration, so the #79 pin on it is obsolete — the condition it was pinned for is FIXED. Remove '$tbl' from KB_MIGRATION_PIN_79 in this workflow in the SAME pull request as the migration, and delete the whole (b2·#79) block once the pin is empty. This failure is a success: it is deliberate that the fix cannot merge while the suppression for it is still in the tree."
              fi
              continue
            fi
            pending="$pending $tbl"
            # No migration. Only a problem once something writes it.
            # `--include` here filters a RECURSED tree — the only path argument is a directory. If
            # a file is ever named explicitly on this argv it must match one of these filters or
            # grep drops it SILENTLY; see (c2) of the write-allow-list step for the measurement.
            w=$(grep -rniE "(insert[[:space:]]+into|update|delete[[:space:]]+from|copy)[[:space:]]+\"?$tbl\"?[^a-z0-9_]" \
                  services/ai-service/app --include=*.py --include=*.sql 2>/dev/null || true)
            if [ -z "$w" ]; then
              # NOT WRITTEN. A pinned name nothing writes is a pin with no cause: this loop would
              # pass on it unaided, so the pin has become pure suppression — and it would swallow
              # the NEXT write into an unmigrated table of that name without a word.
              if pinned79 "$tbl"; then
                flag "'$tbl' is on the #79 pin but the data plane NO LONGER WRITES it, so the pin suppresses nothing today and would hide the next write into an unmigrated '$tbl'. Remove it from KB_MIGRATION_PIN_79 in this workflow."
              fi
              continue
            fi
            # WRITTEN AND UNMIGRATED — a real property-3 violation. Reported either way; the pin
            # changes the SEVERITY, never the visibility.
            if pinned79 "$tbl"; then
              pin_seen="$pin_seen $tbl"
              echo "::warning::#79 (pinned $KB_MIGRATION_PIN_79_DATE): the data plane writes '$tbl' and no Laravel migration creates it — ADR-033 property 3 is VIOLATED here, not satisfied. Known-red by ruling; the migration lands with the source lifecycle. Write site(s): $(printf '%s' "$w" | head -3 | paste -sd'; ' -)"
              continue
            fi
            flag "the data plane writes '$tbl' but no Laravel migration creates it — property 3. Schema is never defined in services/ai-service, in any form; add the migration under services/core-api/database/migrations in the same change. Write site(s): $(printf '%s' "$w" | head -3 | paste -sd'; ' -)"
          done
          echo "allow-listed tables with no migration yet:${pending:- <none>}"
          # ── THE #79 LEDGER LINE, AND THE CLOSING SET COMPARISON. ──────────────────────────
          # The line prints on EVERY run, including when the pin is empty — same argument as the
          # vacuity ledger at the end of this job: a suppression nobody can see is
          # indistinguishable from a gate that decided nothing.
          #
          # The comparison is (b1)'s shape applied to the pin: the reviewed set versus what the
          # real corpus produced. It is what makes the third failure mode — a pinned name quietly
          # leaving ALLOWED_TABLES, so the loop never visits it and neither branch above can fire
          # — impossible to sit on, and it doubles as the positive control for `pinned79`.
          seen79=$(printf '%s' "$pin_seen" | tr ' ' '\n' | sed '/^$/d' | sort -u | paste -sd' ' -)
          want79=$(printf '%s' "$KB_MIGRATION_PIN_79" | tr ' ' '\n' | sed '/^$/d' | sort -u | paste -sd' ' -)
          echo "#79 known-red pin (pinned $KB_MIGRATION_PIN_79_DATE, ADR-033 property 3): [${want79:-<empty — delete the (b2·#79) block>}]; still written AND still unmigrated: [${seen79:-<none>}]"
          [ "$seen79" = "$want79" ] \
            || flag "the #79 pin is [$want79] but only [$seen79] is still both written by the data plane and unmigrated. Every other pinned name has stopped violating property 3 — by gaining a migration, by no longer being written, or by leaving ALLOWED_TABLES entirely — and a pin that outlives its cause suppresses the NEXT violation under the same name. Remove the stale name(s) from KB_MIGRATION_PIN_79 in this workflow, and delete the whole (b2·#79) block if that empties it."

          # ── (b3) PROPERTY 2 — THE PUBLIC API NEITHER READS NOR WRITES IT. ──────────────────
          # This is the property writes.py calls "the one that actually bites", and it is the one
          # with a real corpus today: services/core-api has six route files, three controllers,
          # two middleware, two resources and seven Eloquent models.
          #
          # A table reaches the public API through one of two visible bindings — an Eloquent
          # model declaring `protected $table = 'x'`, or the quoted literal 'x' used directly —
          # and the public HTTP surface is `routes/` plus `app/Http/`. Both are checked. Comment
          # lines are dropped, because `routes/api_admin.php` names "organizations, users and
          # invitations" in an ordinary sentence and prose is not a call site; the literal arm
          # additionally requires the QUOTES, which that sentence does not have.
          #
          # DELIBERATELY NOT app/Models, app/Repositories OR database/. Laravel legitimately
          # carries `SparseTermFrequency` and `SparseVersionStatistic` models plus an Eloquent
          # repository for the two C2 tables — reading a derived table from a background job is
          # not serving it from the API, and a check that conflated the two would fail on correct
          # code. The line is the HTTP surface.
          API_SURFACE='services/core-api/routes services/core-api/app/Http'
          # The four shellcheck findings this function used to raise were the only ones in either
          # workflow, and all four are wrong here. SC1087 fires twice on `[\$]table` and `\\b$c\\b`
          # inside a GREP PATTERN — there is no array, it is a bracket expression and a word
          # boundary. SC2086 fires on `$API_SURFACE` and `$classes`, where the word splitting is the
          # point: both are space-separated lists fed to grep as separate path/name arguments, and
          # quoting either would pass one argument containing a space and match nothing — a gate
          # that silently stops finding anything. Suppressed rather than "fixed", so
          # `actionlint` (which bundles shellcheck) is clean and the next real finding is visible.
          # shellcheck disable=SC1087,SC2086
          api_reach() {
            local t="$1" c classes
            classes=$(grep -rlE "[\$]table[[:space:]]*=[[:space:]]*['\"]$t['\"]" \
                        services/core-api/app/Models 2>/dev/null || true)
            classes=$(printf '%s\n' "$classes" | sed '/^$/d' | sed 's#.*/##; s#\.php$##')
            { grep -rnE "['\"]$t['\"]" $API_SURFACE 2>/dev/null || true
              for c in $classes; do grep -rnE "\\b$c\\b" $API_SURFACE 2>/dev/null || true; done
            } | grep -vE "$KB_PHP_COMMENT_LINE" | sort -u || true
          }
          # Non-vacuity of the model arm: if `protected $table =` stops matching (a Laravel
          # convention change, a move to inferred table names), api_reach silently degrades to
          # the literal arm alone and every answer below becomes "clean".
          binds=$(grep -rcE "[\$]table[[:space:]]*=" services/core-api/app/Models 2>/dev/null | grep -vc ':0$' || true)
          echo "Eloquent models declaring an explicit \$table: $binds"
          [ "${binds:-0}" -ge 1 ] \
            || flag "no model in services/core-api/app/Models declares 'protected \$table ='; the (b3) model->table mapping matches nothing and its clean results below prove nothing"
          # POSITIVE CONTROL. A detector that finds nothing looks identical to a detector that IS
          # nothing — the exact defect the Prefetch check carried for its whole life. `users` is
          # a table Laravel both migrates and serves (App\Models\User is imported by
          # app/Http/Middleware/TenantContext.php and by two controllers), so it MUST come back
          # reachable. It is taken from the repository, not from ALLOWED_TABLES, and if it ever
          # legitimately stops being referenced from the HTTP surface, replace it with another
          # served table rather than deleting the control.
          ctl=$(api_reach users)
          echo "positive control — 'users' reached from the HTTP surface on $(printf '%s\n' "$ctl" | grep -c . || true) line(s)"
          [ -n "$ctl" ] \
            || flag "positive control failed: the control-plane table 'users' was NOT detected as public-API-reachable, so (b3) is broken and the clean results below mean nothing"
          for tbl in $tables; do
            hits=$(api_reach "$tbl")
            [ -z "$hits" ] \
              || flag "ALLOWED_TABLES entry '$tbl' is reachable from the control plane's public HTTP surface — property 2. A data-plane write into a table Laravel serves lands beside Laravel's own writer with no policy check, no audit row and no framework-applied tenant scope, and nothing errors. Reference(s): $(printf '%s' "$hits" | head -3 | paste -sd'; ' -)"
          done

          # ── (b4) PROPERTY 1 IS NOT DECIDABLE HERE, AND NO PROXY IS SUBSTITUTED. ────────────
          # "Derived and rebuildable in the ADR-010 sense" is a claim about what WRITES the row —
          # that it is a pure function of content already in PostgreSQL and object storage, with
          # nothing on it that is a source of truth. No text pass can decide that, and the writes
          # do not exist yet in any case. The proof is the ADR-010 rebuild job, which ci.yml's
          # header lists as still owed. Nothing stands in for it here on purpose: a substitute
          # check reads in the log exactly like the check it replaced.
          echo "not checked: property 1 (derived and rebuildable) — undecidable by grep; owed to ci.yml's ADR-010 rebuild proof. The (b1) pin is the only review stop covering it."

          # ── (c) THE ERROR TAXONOMY. THE SAME CONVERSION AS (a) AND (b1), FOR THE SAME REASON. ─
          # `app.core.errors` asserts `len(ErrorClass) == 18` at IMPORT time (errors.py:251), plus
          # set-equality of the status, retryable and fallback tables against the enum
          # (errors.py:248-250). Importing the module is therefore the whole taxonomy check — a
          # 19th class, or a class missing from any of the three tables, is an AssertionError
          # inside `py`, which fails this step with a traceback.
          #
          # THIS USED TO BE `[ "$classes" = "18" ]`, AND IT WAS THE SAME DEFECT AS (a) AND (b).
          # Two things were wrong with it and they compound:
          #   * IT WAS IMPLIED. The module asserts the count itself, at import, one line before
          #     the value is printed. A CI assertion that 18 == 18 after the module has already
          #     refused to load unless it is 18 restates the module's own invariant in a third
          #     place, and the third place is the one that goes stale.
          #   * IT COULD NOT SEE A SWAP OR A RENAME. `PROVIDER_BILLING` renamed to `BILLING`, or
          #     `USER_CANCELLATION` dropped and `TIMEOUT` added, is eighteen classes and passes —
          #     while `kb-error-taxonomy`'s per-class status/retry/fallback table, every `except`
          #     block that names the old member, and the alert rules keyed on `error_class` have
          #     all silently changed meaning. A cardinality is exactly the wrong instrument here:
          #     the taxonomy's content is the eighteen NAMES, not the number eighteen.
          # So: pin the names, the same weakest-anchor-outside-the-module argument as (b1). The
          # module keeps the count; CI holds the membership, so any change to either is a diff
          # with a name in it that someone has to approve.
          #
          # ASSERT LIVENESS FIRST. Everything above rests on `assert` running, and `python -O`
          # strips assert statements outright — under `-O` the module imports cleanly on a broken
          # taxonomy and every line below still passes. `py` does not pass `-O`, but PYTHONOPTIMIZE
          # in the environment does the same thing invisibly, so it is PROVED rather than assumed:
          # a deliberately false assert must fail.
          if py 'assert False, "assert-liveness control"' 2>/dev/null; then
            flag "the assert-liveness control PASSED: assertions are stripped in this interpreter (python -O or PYTHONOPTIMIZE), so app/core/errors.py's four import-time invariants are not running and (c) proves nothing"
          else
            echo "assert-liveness control: assertions are live in the gate interpreter"
          fi
          KB_ERROR_CLASS_PIN='AUTHENTICATION AUTHORIZATION CRAWL INTERNAL_DEPENDENCY OCR PARSING PROVIDER_AUTH PROVIDER_BILLING PROVIDER_PERMANENT_REQUEST PROVIDER_RATE_LIMIT PROVIDER_TEMPORARY RATE_LIMIT RETRIEVAL STORAGE TENANT_QUOTA USER_CANCELLATION VALIDATION VECTOR_INDEXING'
          classes=$(py 'import app.core.errors as e; print(" ".join(sorted(m.name for m in e.ErrorClass)))')
          got=$(printf '%s' "$classes" | tr ' ' '\n' | sed '/^$/d' | sort -u | paste -sd' ' -)
          exp=$(printf '%s' "$KB_ERROR_CLASS_PIN" | tr ' ' '\n' | sed '/^$/d' | sort -u | paste -sd' ' -)
          echo "ErrorClass members ($(printf '%s' "$got" | wc -w)) = [$got]"
          [ -n "$got" ] || flag "app.core.errors imported no ErrorClass members; the pin below compares against nothing"
          [ "$got" = "$exp" ] \
            || flag "ErrorClass is [$got]; the reviewed taxonomy is [$exp]. kb-error-taxonomy fixes the class set and every consumer is keyed on these names — the per-class status/retryable/fallback tables, every except block, the error_class label on metrics and logs, and the alert rules. Add or rename a class in the SAME pull request as KB_ERROR_CLASS_PIN and say which of those consumers you updated."

          [ "$fail" = "0" ] || exit 1
          printf 'KB_DELETE_KEYS=%s\n' "$delete_keys" >> "$GITHUB_ENV"
          printf 'KB_ALLOWED_TABLES=%s\n' "$allowed" >> "$GITHUB_ENV"

      - name: Tenancy escape hatches must be annotated
        run: |
          # Each legitimate raw query carries `// tenancy-exempt: <reason>` on the same line;
          # grep -v drops those, so anything left is unreviewed. This is why the allow-list is
          # inline and not a paths file — it moves with the code and dies with it. Constructs and
          # rationale: kb-tenancy-isolation. Failure mode: a raw query that escapes the org scope.
          #
          # SINGLE check, so `! grep` is safe here — `!` negates the whole pipeline, and adding a
          # stage to that pipeline does not change that. Adding a second, SEPARATE check to this
          # step without converting it to the accumulator form below silently demotes this one to
          # advisory.
          #
          # $KB_PHP_COMMENT_LINE drops comment lines, and it is load-bearing rather than tidy: read
          # the block beside its definition for the two PHPDoc lines in OrganizationScope.php that
          # made this gate red on a completely correct tree. `--exclude-dir=vendor` for the reason
          # spelled out in the ADR-017 step: laravel/framework declares plenty of `DB::` surface of
          # its own, and the directory is gitignored, so the failure is invisible in CI and
          # reproducible for every developer — which is the worst possible split.
          : "${KB_PHP_COMMENT_LINE:?job env did not define the PHP comment-line filter}"
          ! grep -rnE --exclude-dir=vendor --exclude-dir=node_modules \
              'withoutGlobalScopes\(|DB::table\(|DB::select\(' \
              services/core-api/app services/core-api/database \
            | grep -vE "$KB_PHP_COMMENT_LINE" \
            | grep -v 'tenancy-exempt:'

      - name: Every Qdrant call is filtered
        run: |
          # The Laravel grep above covers only half the system. Non-negotiable 2 is a DATA-PLANE
          # rule, and without this the flagship invariant has no gate on the side that actually
          # queries Qdrant. Failure mode (kb-tenancy-isolation): HTTP 200, normal latency, no log
          # line, another tenant's chunks.
          #
          # ACCUMULATE, never `! grep` — two checks.
          set -u; fail=0
          flag() { [ -n "${1//[[:space:]]/}" ] || return 0; printf '%s\n' "$1"; echo "::error::$2"; fail=1; }

          # (a) Every retrieval entry point must take a filter positionally — no default, and no
          # `filter or models.Filter()`, because Filter(must=[]) is a MATCH-ALL.
          # $KB_QDRANT_CALLS and $KB_COMMENT_LINE are the job-level definitions; read the comments
          # beside them for why the verb list grew from four to fifteen and why comment lines drop.
          set -u
          : "${KB_QDRANT_CALLS:?job env did not define the Qdrant verb list}"
          flag "$( grep -rnE "$KB_QDRANT_CALLS" \
                     services/ai-service/app --include=*.py \
                   | grep -vE "$KB_COMMENT_LINE" \
                   | grep -v 'tenancy-exempt:' \
                   | grep -vF 'app/retrieval/search.py' || true )" \
               "retrieval, retrieve-by-id, delete or payload-write call outside the one filter-building wrapper"

          # (b) And no prefetch leaf may go out unfiltered. NOTE THE PARAMETER NAME: a Prefetch leaf
          # carries `filter=`; `query_filter=` belongs to the top-level query_points call and says
          # nothing about the leaf. $KB_PREFETCH_FILTERED encodes that distinction.
          #
          # The `tenancy-exempt:` escape is present here for the same reason it is on (a): without
          # one, the only way past a false positive is to edit the gate, and the person hitting it
          # at 6pm edits the gate.
          flag "$( grep -rn 'Prefetch(' services/ai-service/app --include=*.py \
                   | grep -vE "$KB_COMMENT_LINE" \
                   | grep -vE "$KB_PREFETCH_FILTERED" \
                   | grep -v 'tenancy-exempt:' || true )" "unfiltered Prefetch leaf (a leaf takes filter=, not query_filter=)"

          exit $fail

      - name: Gate self-test — the two tenancy detectors are proven to fire
        run: |
          # NON-VACUITY, PROVED RATHER THAN ASSERTED. Both checks above match ZERO lines on today's
          # tree, so "green" is indistinguishable from "the pattern stopped matching anything".
          # That is not hypothetical here: the Prefetch check was inverted for its whole life and
          # nobody noticed, precisely because it had no candidate to be wrong about. The same shape
          # as the `find -maxdepth 2 -name 'nvidia*'` containment that matched nothing and therefore
          # passed on every image, CPU and CUDA alike.
          #
          # So: run the SAME env-var patterns against a fixture of known-bad and known-good lines
          # and assert the counts. The fixture is inline, not a file, so it cannot be deleted by a
          # cleanup that leaves the gate looking intact — and it lives under .github/, which no gate
          # in this file scans, so it cannot trip the real check.
          #
          # ACCUMULATE, never a bare `[` — four assertions.
          set -u; fail=0
          flag() { echo "::error::$1"; fail=1; }
          tmp=$(mktemp -d)

          # 12 known-bad Qdrant calls: the four original verbs plus the eight that scored zero.
          cat > "$tmp/bad_calls.py" <<'PYEOF'
          client.query_points(collection_name="c", query=v)
          client.search(collection_name="c", query_vector=v)
          client.scroll(collection_name="c")
          client.count(collection_name="c")
          client.retrieve(collection_name="c", ids=[1, 2, 3])
          client.delete(collection_name="c", points_selector=sel)
          client.set_payload(collection_name="c", payload=p, points=ids)
          client.overwrite_payload(collection_name="c", payload=p, points=ids)
          client.delete_payload(collection_name="c", keys=["org_id"], points=ids)
          client.clear_payload(collection_name="c", points_selector=sel)
          client.recommend(collection_name="c", positive=[1])
          client.discover(collection_name="c", target=t)
          PYEOF
          bad=$(grep -cE "$KB_QDRANT_CALLS" "$tmp/bad_calls.py" || true)
          echo "Qdrant detector matched $bad/12 known-bad call forms"
          [ "$bad" = "12" ] || flag "the Qdrant verb list matched only $bad of 12 known-bad calls; a tenant-facing verb has fallen out of \$KB_QDRANT_CALLS"

          # And the comment filter must NOT swallow a real call that merely sits on an indented line.
          printf '    client.retrieve(collection_name="c", ids=[1])\n' > "$tmp/indented.py"
          grep -nE "$KB_QDRANT_CALLS" "$tmp/indented.py" | grep -qvE "$KB_COMMENT_LINE" \
            || flag "the comment filter is dropping indented CODE, not just comments"

          # Prefetch: the correct form must pass, the unfiltered form must fail — and the unfiltered
          # form deliberately MENTIONS query_filter, which is the exact line `grep -v 'filter='`
          # would have waved through.
          cat > "$tmp/prefetch.py" <<'PYEOF'
          models.Prefetch(query=v, using="dense", limit=20, filter=f)
          models.Prefetch(query=v, using="sparse", limit=20),  # query_filter= is set at top level
          PYEOF
          left=$(grep -n 'Prefetch(' "$tmp/prefetch.py" | grep -vE "$KB_COMMENT_LINE" | grep -vE "$KB_PREFETCH_FILTERED" || true)
          printf 'Prefetch lines surviving the filter test:\n%s\n' "${left:-<none>}"
          printf '%s\n' "$left" | grep -q 'query_filter=' \
            || flag "the unfiltered Prefetch leaf was NOT flagged; \$KB_PREFETCH_FILTERED is matching query_filter= again"
          printf '%s\n' "$left" | grep -q 'using="dense"' \
            && flag "a CORRECTLY filtered Prefetch(filter=f) was flagged; the gate fails on correct code"

          # The SQL-write detector, both directions. It matched zero lines for the whole life of the
          # gate too, right up until it matched a SENTENCE — so the anchored replacement gets the
          # same treatment: prove it still sees every real write shape, and prove it no longer sees
          # the prose that broke it.
          cat > "$tmp/writes.py" <<'PYEOF'
          SQL = """
              INSERT INTO usage_events (org_id, tokens) VALUES (%s, %s)
          """
          await cur.execute("UPDATE source_items SET status = %s", (s,))
          await cur.execute('DELETE FROM organizations WHERE id = %s', (i,))
              COPY audit_logs FROM STDIN
              insert into provider_calls (id) values (%s)
              INSERT INTO chunks (id) VALUES (%s)
          PYEOF
          sqlhits() {
            { grep -nE  "$KB_SQL_WRITE_ANCHORED" "$1" || true
              grep -niE "$KB_SQL_WRITE_QUOTED"   "$1" || true ; } | sort -u
          }
          for want in usage_events source_items organizations audit_logs provider_calls chunks; do
            sqlhits "$tmp/writes.py" | grep -q "$want" \
              || flag "the SQL write detector no longer sees a write to $want; the two \$KB_SQL_WRITE_* patterns have been over-tightened"
          done

          # THE EXACT PROSE THAT USED TO FAIL THIS JOB, both sentences, verbatim from
          # app/providers/. If either matches again, someone has added `-i` to the anchored arm or
          # dropped the anchor, and the gate is about to go red on somebody's docstring.
          cat > "$tmp/prose.py" <<'PYEOF'
              There are currently two types with this name. The consumer's copy is
              copy and imported this one.
          PYEOF
          hits=$(sqlhits "$tmp/prose.py")
          [ -z "$hits" ] \
            || flag "the SQL write detector matches ordinary prose again ($hits); the anchor or the case-sensitivity of \$KB_SQL_WRITE_ANCHORED is gone"

          exit $fail

      - name: Deletion targets identifiers, never text
        run: |
          # Project non-negotiable 6 / kb-deletion-and-verification §8.17: "Deletion targets stable
          # identifiers, never text matching." Without this the only enforcement is a reviewer
          # noticing. Failure mode: headers, disclaimers, licence blocks and pricing tables repeat
          # VERBATIM across documents and across tenants, so a payload-text or content-hash match
          # issued for source A cuts a hole in source B. Nothing errors, every count stays
          # plausible, and it surfaces weeks later as a bot that stopped citing a clause nobody
          # edited.
          #
          # ACCUMULATE, never `! grep` — more than one check, which is the only thing that matters
          # here: under `bash -e` only the LAST `! grep` in a step can fail the job. (The number is
          # not written down for the reason (b) of the constants step gives at length.)
          set -u; fail=0
          flag() { [ -n "${1//[[:space:]]/}" ] || return 0; printf '%s\n' "$1"; echo "::error::$2"; fail=1; }

          # (a) An ALLOW-LIST of filter keys, not a deny-list of bad ones — a deny-list cannot
          # anticipate the next payload field somebody adds. The list is kb-tenancy-isolation's
          # payload contract PLUS chunk_id: the payload fields are the terms a tenant *filter*
          # must express on every query, while deletion additionally addresses one chunk by its
          # own identity, and chunk_id is never a query-filter term. Every other key (text,
          # content, content_hash, title, heading_path, excerpt, url) is a content match wearing a
          # filter's clothes. Escape hatch on the same line: `deletion-key-exempt: <reason>`.
          #
          # NO CARDINALITY IS WRITTEN HERE. This step used to say "the seven-key delete allow-list"
          # in its own error message, which is the same rot as the `[ "$n" = "7" ]` the constants
          # step above no longer carries: the list changes with the payload contract, the sentence
          # does not, and the sentence is what a reader believes. $KB_DELETE_KEYS is DELETE_KEYS
          # itself, imported by the first step of this job and — since that step's rewrite —
          # constrained there against `app/retrieval/collection.py`'s PAYLOAD_INDEXES rather than
          # against its own length. So this gate now leans on a list that has been checked for
          # membership, which is what makes leaning on it worth anything.
          #
          # `app/deletion/filters.py` is the ONLY file exemption: it is the single module allowed
          # to build keys dynamically (`FieldCondition(key=field, …)` in a loop never shows the
          # allow-list a literal), and it earns that by unit-testing its DELETE_KEYS tuple against
          # the contract. A second file in this exemption list is a review stop, not a merge.
          : "${KB_DELETE_KEYS:?constants step did not export DELETE_KEYS}"
          : "${KB_COMMENT_LINE:?job env did not define the comment-line filter}"

          sites() {
            grep -rnE 'FieldCondition\([[:space:]]*key=' "$@" \
              | grep -vE "$KB_COMMENT_LINE" \
              | grep -v 'deletion-key-exempt:' \
              | grep -vF 'app/deletion/filters.py' || true
          }
          # ── PER OCCURRENCE, NOT PER LINE, AND THAT IS THE BUG FIX. ─────────────────────────
          # The subtraction used to be `grep -vE "key=['\"]($KB_DELETE_KEYS)['\"]"`, which drops a
          # WHOLE LINE because SOMETHING on it is allow-listed. One allow-listed key therefore
          # launders every other key sharing its line:
          #     must=[FieldCondition(key="org_id", match=o), FieldCondition(key="text", match=t)]
          # is one line, it matches `key="org_id"`, and the old grep removed it — a content match
          # on chunk text, inside a delete filter, invisible. Black keeps a `must=[…]` list on one
          # line whenever it fits, so this is the ordinary formatting, not a contrived one.
          # Extract every key NAMED on the line and test each against the allow-list separately.
          #
          # A line with NO literal key is reported too. `FieldCondition(key=field, …)` is exactly
          # the dynamic form the filters.py path exemption exists for; outside that one module it
          # is the hole, not the exemption, and a check over string literals is structurally blind
          # to it — it subtracts nothing and finds nothing, which reads as clean.
          offenders() {
            local line k keys
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              keys=$(printf '%s\n' "$line" \
                     | grep -oE "key=[\"'][A-Za-z_][A-Za-z0-9_]*[\"']" \
                     | sed 's/^key=//' | tr -d "\"'")
              if [ -z "$keys" ]; then
                printf '%s\n    ^ payload key built from a variable, outside app/deletion/filters.py\n' "$line"
                continue
              fi
              for k in $keys; do
                printf '%s\n' "$k" | grep -qxE "($KB_DELETE_KEYS)" \
                  || printf '%s\n    ^ key=%s is not in the delete allow-list [%s]\n' "$line" "$k" "$KB_DELETE_KEYS"
              done
            done
          }
          flag "$( sites services/ai-service/app --include=*.py | offenders )" \
               "payload filter key outside the delete allow-list (app/deletion/filters.py DELETE_KEYS)"

          # (a2) …AND THE FORM grep CANNOT SEE AT ALL. `FieldCondition\([[:space:]]*key=` needs the
          # key on the SAME LINE as the call, and grep is line-based, so black's ordinary wrapping
          #     models.FieldCondition(
          #         key="content_hash", match=models.MatchValue(value=h)
          #     )
          # matches NOTHING — the gate reports zero offenders and the allow-list stops existing.
          # `app/retrieval/tenancy.py:157-160` already carries a comment telling the next person to
          # keep `key=` on one line "or the gate goes vacuous", which is a source file compensating
          # for a hole in a gate; this is the gate closing it. Same shape as check (b) of the write
          # allow-list gate ("SQL write with no table name on its line"), and it is why that one
          # exists there. A wrapped call is not a violation of the deletion rule, so the message
          # asks for a reformat rather than accusing the author of a content match.
          flag "$( grep -rnE 'FieldCondition\([[:space:]]*$' services/ai-service/app --include=*.py \
                   | grep -vE "$KB_COMMENT_LINE" \
                   | grep -v 'deletion-key-exempt:' \
                   | grep -vF 'app/deletion/filters.py' || true )" \
               "FieldCondition( wrapped with no key= on its line — the allow-list in (a) is line-based and cannot see this key; put key= on the same line as the call"

          # (a3) POSITIVE CONTROL, IN THIS STEP, ON THIS CODE PATH. The corpus in (a) is small and
          # entirely allow-listed, so a green (a) is indistinguishable from an (a) that stopped
          # matching — the defect this whole rewrite is about. The fixture is inline and lives in
          # a mktemp dir, so it cannot be deleted by a cleanup that leaves the gate looking intact
          # and it cannot trip the real check above.
          tmp=$(mktemp -d)
          cat > "$tmp/good.py" <<'PYEOF'
          models.FieldCondition(key="org_id", match=models.MatchValue(value=org)),
          models.FieldCondition(key="source_version_id", match=models.MatchAny(any=vids)),
          PYEOF
          cat > "$tmp/bad.py" <<'PYEOF'
          models.FieldCondition(key="content_hash", match=models.MatchValue(value=h)),
          models.FieldCondition(key="org_id", match=o), models.FieldCondition(key="text", match=t),
          models.FieldCondition(key=field, match=models.MatchAny(any=list(values))),
          PYEOF
          cat > "$tmp/wrapped.py" <<'PYEOF'
          models.FieldCondition(
              key="content_hash", match=models.MatchValue(value=h)
          )
          PYEOF
          # `flag` above takes TWO arguments (findings, then the annotation) and `set -u` makes a
          # one-argument call an unbound-variable crash, so the controls use their own one-argument
          # helper rather than borrowing it.
          ctl() { echo "::error::$1"; fail=1; }

          clean=$(sites "$tmp/good.py" | offenders)
          if [ -z "$clean" ]; then
            echo "positive control 1/4: two allow-listed keys pass clean"
          else
            ctl "positive control failed: allow-listed keys were flagged, so this gate fails on correct code — $clean"
          fi
          dirty=$(sites "$tmp/bad.py" | offenders)
          n=$(printf '%s\n' "$dirty" | grep -c '\^ ' || true)
          echo "positive control 2/4: detector reported $n/3 known-bad delete-filter keys"
          [ "$n" = "3" ] \
            || ctl "positive control failed: the delete-key detector saw $n of 3 known-bad forms, so its clean result on services/ai-service/app proves nothing"
          printf '%s\n' "$dirty" | grep -q 'key=text is not in the delete allow-list' \
            || ctl "positive control failed: a content key sharing a line with key=\"org_id\" was NOT flagged — the per-occurrence subtraction has reverted to the line-based grep -v that launders it"
          printf '%s\n' "$dirty" | grep -q 'built from a variable' \
            || ctl "positive control failed: FieldCondition(key=field, …) outside app/deletion/filters.py was not reported"
          if grep -qE 'FieldCondition\([[:space:]]*$' "$tmp/wrapped.py"; then
            echo "positive control 3/4: the wrapped-call arm sees a black-formatted FieldCondition("
          else
            ctl "positive control failed: (a2) did not see a wrapped FieldCondition( — a key on the next line is invisible to (a) and now to (a2) as well"
          fi
          if [ -z "$(sites "$tmp/wrapped.py" | offenders)" ]; then
            echo "positive control 4/4: (a) is confirmed BLIND to the wrapped form, which is what (a2) exists for"
          else
            ctl "positive control failed: (a) now matches the wrapped form, so (a2) is redundant — collapse them rather than running both"
          fi

          # (b) No full-text matcher reaches Qdrant at all, and no delete or count takes a
          # text/content/hash kwarg. Lexical matching in this platform is BGE-M3 sparse vectors
          # (bge-m3-embeddings), never MatchText — so a MatchText in the data plane is either a
          # delete filter or a retrieval path that bypasses fusion. Both are bugs.
          flag "$( grep -rnE 'MatchText\(|(delete|count)[a-z_]*\([^)]*(text|content|content_hash)=' \
                     services/ai-service/app --include=*.py \
                   | grep -v 'deletion-key-exempt:' || true )" \
               "full-text matcher or text/hash kwarg on a delete or count"

          exit $fail

      - name: The data plane writes only its allow-listed tables
        run: |
          # ADR / kb-architecture-map, fastapi-service: services/ai-service writes only the
          # derived, rebuildable tables named by `app.db.writes.ALLOWED_TABLES` — and NOTHING
          # else. Every other table is Laravel's, read and write, and Laravel owns all migrations.
          # Failure mode: a data-plane INSERT/UPDATE into a control-plane table lands beside
          # Laravel's own writer with no policy check, no audit row, and no framework-applied
          # tenant scope. Nothing errors; the row is just there, and it is found by a customer,
          # not by a test.
          #
          # ALLOW-LIST, not a deny-list of bad table names — same reasoning as the deletion-key
          # gate: a deny-list cannot see the table somebody invents tomorrow. So detect every write
          # statement, then subtract the allowed names; whatever is left fails. Escape hatch on the
          # same line: `table-write-exempt: <reason>`. A second exempted line is a review stop, not
          # a merge.
          #
          # ACCUMULATE, never `! grep` — four checks, and each one has been proven to fail this
          # job independently.
          #
          # NO NAME AND NO COUNT IS WRITTEN HERE. `ALLOWED` is `app.db.writes.ALLOWED_TABLES`,
          # imported by the first step of this job — that module's own comment forbids restating
          # the list, and a hardcoded copy in a CONSUMER drifts silently: rename a table and this
          # gate keeps subtracting the old spelling, so the new name reads as a violation and the
          # old one keeps passing. Whether the imported list is itself legitimate is a separate
          # question with a separate answer, in check (b) of the constants step above; do not
          # answer it here by pattern-matching on the names.
          set -u
          : "${KB_ALLOWED_TABLES:?constants step did not export ALLOWED_TABLES}"
          ALLOWED="$KB_ALLOWED_TABLES"
          # $KB_SQL_WRITE_ANCHORED and $KB_SQL_WRITE_QUOTED are the job-level definitions — read the
          # long block beside them for why there are TWO of them and why one is case-sensitive.
          # Short version: a single unanchored case-insensitive pattern matched the ordinary
          # English sentences "The consumer's copy is" and "copy and imported this one." in
          # app/providers/, and failed this job on correct code.
          : "${KB_SQL_WRITE_ANCHORED:?job env did not define the anchored SQL write detector}"
          : "${KB_SQL_WRITE_QUOTED:?job env did not define the quoted SQL write detector}"
          # The allow-list subtraction stays case-INSENSITIVE: it only ever removes lines, so a
          # loose spelling here can hide nothing that the detectors did not already surface.
          # `([^a-z0-9_]|$)`, NOT `[^a-z0-9_]`. The trailing guard is what stops `chunks` from
          # subtracting a write to `chunks_archive`, so it has to be there — but requiring a
          # CHARACTER after the name meant the name could never sit at END OF LINE, and that is
          # the ordinary way a multi-line SQL string is formatted:
          #     INSERT INTO chunks
          #         (id, org_id, text)
          #     VALUES (%s, %s, %s)
          # The anchored detector sees line 1, the subtraction does not remove it, and check (a)
          # reports a legitimate write to an allow-listed table as "write outside the allow-listed
          # tables". Check (b) does not catch it either — that one requires the KEYWORD to end the
          # line, and here the table name does. Vacuous today only because the data plane issues
          # no SQL; it would have gone red on the first correctly-formatted INSERT anyone wrote,
          # and the way past it would have been to reformat correct SQL to please a grep.
          # Alternation, not `?`, because `[^a-z0-9_]?` would match the empty string ANYWHERE and
          # re-open the `chunks_archive` hole it exists to close.
          SUBTRACT="(insert[[:space:]]+into|update|delete[[:space:]]+from|copy)[[:space:]]+\"?($ALLOWED)\"?([^a-z0-9_]|$)"
          fail=0
          flag() { [ -n "${1//[[:space:]]/}" ] || return 0; printf '%s\n' "$1"; echo "::error::$2"; fail=1; }

          # (a) Every SQL write names a table; subtract the allow-list. Both detectors require whitespace
          # after the keyword, so Python's `d.update(...)` / `cfg.update(other)` never match.
          # NOTE the case flags: `grep -E` for the anchored arm (deliberately case-SENSITIVE) and
          # `grep -iE` for the quoted one. Adding `-i` to the first re-opens the prose bug.
          flag "$( { grep -rnE  "$KB_SQL_WRITE_ANCHORED" services/ai-service/app --include=*.py --include=*.sql || true
                     grep -rniE "$KB_SQL_WRITE_QUOTED"   services/ai-service/app --include=*.py --include=*.sql || true ; } \
                   | sort -u \
                   | grep -vE "$KB_COMMENT_LINE" \
                   | grep -v 'table-write-exempt:' \
                   | grep -viE "$SUBTRACT" \
                   || true )" "write outside the allow-listed tables"

          # (b) grep is line-based, so a write whose table sits on the NEXT line of a triple-quoted
          # SQL string would be seen by (a) and subtracted by nothing. Uppercase-only, so prose
          # like "# needs update" is safe.
          flag "$( grep -rnE '\b(INSERT INTO|UPDATE|DELETE FROM|COPY)[[:space:]]*$' \
                     services/ai-service/app --include=*.py --include=*.sql \
                   | grep -v 'table-write-exempt:' || true )" "SQL write with no table name on its line"

          # (c) The data plane defines no schema and has no ORM to hide table targets behind:
          # writes are psycopg text (opentelemetry-instrumentation pins PsycopgInstrumentor).
          # `session.add(SourceItem(...))` names no table anywhere, so (a) and (b) cannot see it.
          # If an ORM ever lands, this fails and (a)/(b) must grow a model-symbol allow-list in the
          # same commit — that is the point of failing here rather than degrading quietly.
          #
          # TWO ARMS, AND THE SPLIT IS A BUG FIX. It was ONE flag with one pattern, one path list
          # and one blame message, and that cost it three ways:
          #
          #   1. IT FAILED ON CORRECT CODE. `app/retrieval/sparse.py:445` reads
          #        beside each ``CREATE TABLE``), ``App\Repositories\Eloquent\
          #      — legitimate prose naming where the Laravel migration states its two placeholders,
          #      checked by tests/unit/test_sparse_store_read_shape.py against that migration. The
          #      gate demanded that a source file delete a true sentence to go green. It was only
          #      ever invisible because check (b2) of the constants step fails FIRST and Actions
          #      skips the rest of the job.
          #   2. RESTRICTING THE DDL HALF TO UPPERCASE DOES NOT FIX IT — measured: that prose is
          #      uppercase. The narrowing has to be STRUCTURAL, which is what the alternation below
          #      is: real DDL is followed by an identifier (optionally quoted) or by END OF LINE,
          #      and the end-of-line arm is not optional — `cur.execute("""CREATE TABLE` is the
          #      ordinary way a multi-line SQL string opens, the same formatting reality check (b)
          #      exists for. Prose is followed by a backtick, a comma, a paren.
          #   3. IT CARRIED NO `--include`, unlike (a), (b) and (d), so it reported
          #      `Binary file …/__pycache__/sparse.cpython-313.pyc matches`. No __pycache__ exists
          #      on a runner (actions/checkout writes none), so this was local-only — but it is the
          #      same "reports on something that is not source" shape, and local is how every gate
          #      body in this file gets verified by hand.
          #
          # …and the two halves cannot share a path list. `--include` FILTERS EXPLICITLY-NAMED
          # FILES, NOT ONLY RECURSED ONES. Measured with GNU grep 3.4:
          #     $ grep -rn --include=*.py 'sqlalchemy' inctest/sub inctest/p.toml
          #     inctest/sub/a.py:1:sqlalchemy        <- p.toml DROPPED despite being on the argv
          # So adding `--include=*.py --include=*.sql` to the combined arm would have SILENTLY
          # KILLED the ORM-dependency check on pyproject.toml — one defect traded for a worse one
          # of exactly the class this whole job exists to eliminate. (c2) therefore carries
          # `--include=*.toml`, and the positive control below asserts that reach specifically.
          #
          # PATTERNS **AND FILE FILTERS** ARE DEFINED ONCE AND CONSUMED BY BOTH THE GATE AND ITS
          # POSITIVE CONTROL. This was written the obvious way first — the control spelling its
          # own `--include=*.py --include=*.sql --include=*.toml` — and it was measured USELESS:
          # deleting `--include=*.toml` from the real (c2) call below left the control reporting
          # 2/2 and the step exiting 0, because the control was validating its private copy.
          # That is the same drift the job-level Qdrant detectors and the ALLOWED_TABLES import
          # exist to remove, reproduced inside the check meant to catch it. Arrays, not strings:
          # a `--include=*.py --include=*.sql` string is one argv word and grep rejects it.
          KB_DDL='(create|alter|drop)[[:space:]]+table([[:space:]]+["a-z_]|[[:space:]]*$)'
          KB_ORM='\balembic\b|sqlalchemy|sqlmodel|tortoise'
          KB_DDL_IN=('--include=*.py' '--include=*.sql')
          KB_ORM_IN=('--include=*.py' '--include=*.sql' '--include=*.toml')

          # (c1) NO SCHEMA. Laravel owns every migration (ADR-033 property 3).
          flag "$( grep -rniE "$KB_DDL" services/ai-service/app "${KB_DDL_IN[@]}" \
                   | grep -vE "$KB_COMMENT_LINE" \
                   | grep -v 'table-write-exempt:' || true )" \
               "the data plane defines no schema — Laravel owns every migration"

          # (c2) NO ORM. DELIBERATELY WITHOUT THE COMMENT FILTER, AND THE ASYMMETRY WITH (c1) IS
          # THE POINT. `app/db/pool.py:13-14` states the rule this arm enforces: "CI fails the
          # build on the name of an ORM appearing in this tree at all, including in prose." A `#`
          # line describing DDL defines no schema, so (c1) drops comments; a `#` line naming an
          # ORM is exactly what pool.py says must fail, so (c2) must not. Adding $KB_COMMENT_LINE
          # here would narrow a documented invariant and nothing would say so.
          flag "$( grep -rniE "$KB_ORM" \
                     services/ai-service/app services/ai-service/pyproject.toml \
                     "${KB_ORM_IN[@]}" \
                   || true )" \
               "the data plane has no ORM — writes are psycopg text (app/db/pool.py)"

          # (c3) POSITIVE CONTROL, IN THIS STEP, ON THESE EXACT PATTERNS AND THIS EXACT PATH SHAPE.
          # (c1) and (c2) are both clean on today's tree, so their green is indistinguishable from
          # a green produced by a narrowing that went too far — which is the defect being fixed
          # here, one turn of the same handle. Inline fixture under mktemp, never the real tree:
          # editing source to dodge a grep is the failure mode, not the fix.
          tmp=$(mktemp -d)
          mkdir -p "$tmp/app"
          cat > "$tmp/app/ddl.py" <<'DDLEOF'
          CREATE TABLE chunks (
              cur.execute("""CREATE TABLE
              beside each ``CREATE TABLE``), ``App\Repositories\Eloquent\
          # CREATE TABLE chunks (
          import sqlalchemy
          DDLEOF
          cat > "$tmp/pyproject.toml" <<'TOMLEOF'
          alembic = "^1"
          TOMLEOF
          # `flag` takes TWO arguments and `set -u` makes a one-argument call an unbound-variable
          # crash, so the controls use their own one-argument helper — same reason as (a3) above.
          ctl() { echo "::error::$1"; fail=1; }

          ddl=$( grep -rniE "$KB_DDL" "$tmp/app" "${KB_DDL_IN[@]}" \
                 | grep -vE "$KB_COMMENT_LINE" \
                 | grep -v 'table-write-exempt:' || true )
          n=$(printf '%s\n' "$ddl" | grep -c . || true)
          echo "positive control 1/3: (c1) flagged $n/2 known-bad DDL forms in the fixture"
          printf '%s\n' "$ddl" | grep -qE ':1:[[:space:]]*CREATE TABLE chunks \(' \
            || ctl "positive control failed: (c1) did not flag a bare CREATE TABLE — the structural narrowing disarmed the check it was supposed to keep"
          printf '%s\n' "$ddl" | grep -qF 'cur.execute' \
            || ctl "positive control failed: (c1) did not flag CREATE TABLE at END OF LINE — the [[:space:]]*\$ arm is dead and a multi-line SQL string now opens a table invisibly, the same hole check (b) exists for"
          ! printf '%s\n' "$ddl" | grep -qF 'beside each' \
            || ctl "positive control failed: (c1) still flags docstring prose that merely NAMES a CREATE TABLE (app/retrieval/sparse.py:445 is the real instance) — this gate is red on correct code again"
          ! printf '%s\n' "$ddl" | grep -qE ':[0-9]+:[[:space:]]*#' \
            || ctl "positive control failed: a commented-out CREATE TABLE was flagged — the \$KB_COMMENT_LINE filter on (c1) is not applied"
          [ "$n" = "2" ] \
            || ctl "positive control failed: (c1) reported $n of 2 known-bad DDL forms, so its clean result on services/ai-service/app proves nothing"

          # …AND (c2) OVER A DIRECTORY PLUS AN EXPLICITLY-NAMED .toml, WHICH IS THE REAL CALL'S
          # SHAPE. The pyproject row is the load-bearing one: it is the control that catches the
          # `--include` measurement above, i.e. someone "tidying" (c2) to share (c1)'s file filters
          # and silently ending the ORM-dependency check.
          orm=$( grep -rniE "$KB_ORM" "$tmp/app" "$tmp/pyproject.toml" \
                   "${KB_ORM_IN[@]}" || true )
          echo "positive control 2/3: (c2) over dir + named .toml reported $(printf '%s\n' "$orm" | grep -c . || true)/2"
          printf '%s\n' "$orm" | grep -qF 'import sqlalchemy' \
            || ctl "positive control failed: (c2) did not flag an ORM import in a .py — the ORM half is dead in source"
          printf '%s\n' "$orm" | grep -qF 'pyproject.toml' \
            || ctl "positive control failed: (c2) did not reach pyproject.toml — --include filters explicitly-named files too, so an ORM DEPENDENCY can now be added with nothing checking. Restore --include=*.toml"

          # And the negative half of the same measurement, so the reason for the .toml filter is
          # re-proved rather than remembered: drop it and the named file disappears. THIS ONE
          # SPELLS ITS FILTERS LITERALLY ON PURPOSE — unlike the two checks above it is asserting
          # a property of GREP, not of this gate's configuration, so pointing it at $KB_ORM_IN
          # would make it tautological the moment someone edits that array.
          if grep -rniE "$KB_ORM" "$tmp/app" "$tmp/pyproject.toml" --include=*.py --include=*.sql \
               | grep -qF 'pyproject.toml'; then
            ctl "positive control failed: --include=*.py no longer drops an explicitly-named .toml, so (c2)'s separate path list and its --include=*.toml are now redundant — collapse (c1)/(c2) rather than running both"
          else
            echo "positive control 3/3: confirmed --include=*.py DROPS an explicitly-named pyproject.toml, which is why (c2) carries --include=*.toml"
          fi
          rm -rf "$tmp"

          # (d) Atomic publication: FastAPI writes rows against the NEW, not-yet-active
          # source_version_id and reports readiness on the callback; LARAVEL flips
          # source_items.current_version_id. Two writers on that column meet the partial unique
          # index ("at most one active version per item", postgresql-patterns) as an IntegrityError
          # inside a Celery task that retries forever. Naming the column in a callback payload
          # model is fine — `IngestionStatus(current_version_id=…)` does not match; assigning it
          # (`item.current_version_id =`) or `SET current_version_id =` does.
          flag "$( grep -rniE 'set[[:space:]]+"?current_version_id"?[[:space:]]*=|\.current_version_id[[:space:]]*=[^=]' \
                     services/ai-service/app --include=*.py --include=*.sql \
                   | grep -v 'table-write-exempt:' || true )" "activation is Laravel's; report readiness instead"

          exit $fail

      - name: Vacuity ledger
        run: |
          # Counts, not opinions: each line reports how many lines the gate's DETECTOR matched
          # before any exemption was subtracted. Zero means the gate cannot currently fail, so its
          # green is regression protection and not evidence that the invariant holds anywhere.
          # Never `exit 1` here — this step reports, the gates enforce.
          set -u
          count() { grep -rnE "$1" "${@:2}" 2>/dev/null | grep -c . || true; }
          tenancy=$(count 'withoutGlobalScopes\(|DB::table\(|DB::select\(' services/core-api/app services/core-api/database)
          # …and how many of those are CODE. The raw count is 2 today and both are PHPDoc lines in
          # OrganizationScope.php explaining the ban, so reporting only the raw number would claim
          # a corpus this gate can never act on. Same honesty the Qdrant line below applies.
          tenancy_code=$(grep -rnE --exclude-dir=vendor --exclude-dir=node_modules \
                           'withoutGlobalScopes\(|DB::table\(|DB::select\(' \
                           services/core-api/app services/core-api/database 2>/dev/null \
                         | grep -vE "$KB_PHP_COMMENT_LINE" | grep -c . || true)
          # $KB_QDRANT_CALLS, not a fourth copy of the verb list. The ledger's whole job is to say
          # how big the GATE's corpus is; a private copy would report on a pattern the gate is not
          # using and would keep reporting "4" after the gate grew to fifteen verbs.
          qdrant_raw=$(grep -rnE "$KB_QDRANT_CALLS" services/ai-service/app --include=*.py 2>/dev/null || true)
          qdrant=$(printf '%s\n' "$qdrant_raw" | grep -c . || true)
          # ── AND THE NUMBER THE GATE ACTUALLY ACTS ON. ────────────────────────────────────────
          # The threshold on the Qdrant line below used to be `[ "$qdrant" -gt 5 ]` — a hand-typed
          # 5 against the RAW count, and it had already failed silently in both directions:
          #   * The raw count was 15 while every one of the 15 was a docstring or a comment, so
          #     `15 -gt 5` short-circuited and THE NOTE NEVER PRINTED ONCE in its whole life. The
          #     ledger showed a number that happened to equal the "15 verbs" in its own label and
          #     nothing else.
          #   * The count is now 5, sitting exactly ON the boundary. One new `#` comment anywhere
          #     under app/ that mentions `count(` or `.delete(` takes it to 6 and re-suppresses
          #     the note while ZERO live Qdrant call sites exist.
          # Same staleness mode CLAUDE.md flags for `[ "$t" = "4" ]` on ALLOWED_TABLES: a count
          # standing in for a rule, bumped by the same hand that broke the rule. So DERIVE it —
          # apply the gate's own three subtractions ($KB_COMMENT_LINE, `tenancy-exempt:`, and the
          # app/retrieval/search.py path exemption) and report what survives. That is the exact
          # set the gate would flag, it is 0 today, and it needs no maintenance ever.
          #
          # NOTE THE SEMANTICS, because they are the opposite of the allow-list gates'. This is an
          # ABSENCE gate: any surviving line IS the violation, so a green run necessarily has
          # zero survivors and this note necessarily prints. That is honest rather than degenerate
          # — the same shape as the `use server` and ADR-017 lines in boundary-greps' ledger — and
          # it is what a vacuity ledger is for: on a clean tree the gate has decided nothing.
          # The breakdown below is what makes the note informative: it says how many matches were
          # comments, how many were reviewed exemptions, and how many sat in the one exempted
          # path, so the day the gate starts acting on real code is visible in the numbers.
          qdrant_code=$(printf '%s\n' "$qdrant_raw" | grep -vE "$KB_COMMENT_LINE" | grep -c . || true)
          qdrant_exempt=$(printf '%s\n' "$qdrant_raw" | grep -vE "$KB_COMMENT_LINE" | grep -c 'tenancy-exempt:' || true)
          qdrant_wrapper=$(printf '%s\n' "$qdrant_raw" | grep -vE "$KB_COMMENT_LINE" | grep -v 'tenancy-exempt:' | grep -cF 'app/retrieval/search.py' || true)
          qdrant_live=$(printf '%s\n' "$qdrant_raw" | grep -vE "$KB_COMMENT_LINE" | grep -v 'tenancy-exempt:' | grep -vF 'app/retrieval/search.py' | grep -c . || true)
          # The verb count in the label is derived too. The comment above warns against a stale
          # "4" and the label underneath it then hardcoded "15 verbs", which is the same defect
          # one line lower down.
          verbs=$(printf '%s' "$KB_QDRANT_CALLS" | tr '|' '\n' | grep -c . || true)
          prefetch=$(count 'Prefetch\(' services/ai-service/app --include=*.py)
          # Both delete-key arms, since the gate now has two. `delkeys` is the same-line form the
          # allow-list can read; `delkeys_wrapped` is the black-wrapped form it cannot, which
          # check (a2) exists to reject rather than silently pass.
          delkeys=$(count 'FieldCondition\([[:space:]]*key=' services/ai-service/app --include=*.py)
          delkeys_wrapped=$(count 'FieldCondition\([[:space:]]*$' services/ai-service/app --include=*.py)
          writes=$(count '(INSERT INTO|UPDATE|DELETE FROM|COPY)[[:space:]]' services/ai-service/app --include=*.py --include=*.sql)
          echo "detector matches before exemptions:"
          echo "  tenancy escape hatches (services/core-api)      : $tenancy ($tenancy_code outside comments)"
          echo "  Qdrant call sites, $verbs verbs (ai-service)        : $qdrant raw / $qdrant_code outside comments / $qdrant_exempt tenancy-exempt / $qdrant_wrapper in the search.py wrapper / $qdrant_live live and unexempted"
          echo "  Prefetch( leaves (ai-service)                   : $prefetch"
          echo "  FieldCondition key= sites (ai-service)          : $delkeys same-line, $delkeys_wrapped wrapped"
          echo "  SQL write statements (ai-service)               : $writes"
          [ "$tenancy_code" -gt 0 ] || echo "vacuous-today: tenancy escape hatches — the detector matches $tenancy line(s) in services/core-api and ALL of them are comments (the PHPDoc in app/Models/Scopes/OrganizationScope.php that documents this very ban). No raw query-builder call site exists yet, so this gate cannot fail until control-plane data access lands."
          [ "$writes" -gt 0 ]  || echo "vacuous-today (partial): write allow-list — services/ai-service issues no SQL yet, so the subtraction subtracts nothing and (b2)'s migration requirement has no write to trigger on. NOT wholly vacuous: (b1) pins the membership of ALLOWED_TABLES against a reviewed list and (b3) resolves every listed name against a real HTTP surface with a proven-live positive control, both of which can fail today. What is missing is the corpus, not the enforcement."
          [ "$delkeys" -gt 0 ] || echo "vacuous-today: delete-key allow-list — no same-line FieldCondition(key=…) site exists, so the allow-list in check (a) subtracts nothing. Its ability to fail is still proved every run by the four positive controls inside that step, which run the same sites()/offenders() path over an inline fixture."
          [ "$qdrant_live" -gt 0 ] || echo "vacuous-today (partial): Qdrant filter gate — $qdrant detector match(es), of which $qdrant_code are outside comments, $qdrant_exempt carry a reviewed tenancy-exempt: marker and $qdrant_wrapper sit inside the app/retrieval/search.py wrapper the gate exempts by path. ZERO live, unexempted Qdrant call sites remain, so the gate has nothing to reject today. This number is derived from the gate's own three subtractions, not from a hand-typed threshold; it stops printing the day an unexempted call site appears — which is also the day the gate fails, because for an absence gate those are the same event. The gate's ability to FAIL is proved every run by the 'Gate self-test' step above, which runs these same patterns over 12 known-bad call forms."
          [ "$prefetch" -gt 0 ] || echo "vacuous-today: Prefetch leaf filter — no Prefetch( exists yet. This is the check that was INVERTED (query_filter= instead of filter=) undetected for its whole life, precisely because it had no candidate to be wrong about; the self-test step is what now keeps it honest."

  # ------------------------------------------------------------------------------------------
  # observability-rules — the three telemetry gates.
  # ------------------------------------------------------------------------------------------
  # File checks only: no secrets, no service containers, no build. `yq` is preinstalled on the
  # ubuntu-24.04 runner image (mikefarah v4); amtool and promtool come from the same pinned images
  # the compose `observability` profile runs, so the tool that checks the config is the tool that
  # will read it in production.
  observability-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Alert rules carry the required labels and annotations
        run: |
          # ⚠ THE PRESENCE ASSERTION IS THE LOAD-BEARING LINE OF THIS STEP, NOT DECORATION.
          # `! yq …` inverts EVERY non-zero exit, including 127 "command not found". On a host
          # with no yq this step printed one stderr line and exited 0 — a silent PASS from a gate
          # that ran nothing. Reproduced 2026-08-11 by executing this body on a machine with no
          # yq: exit 0. It is real on the runner (ubuntu-24.04 ships mikefarah v4), so the
          # vacuity was LOCAL — and local is how every gate body in this repository has been
          # verified by hand. `command -v` turns that silent local green into a loud local red
          # and changes runner behaviour not at all. Any future `! tool …`, `tool … || true` or
          # `if ! tool` in this file needs the same two lines above it.
          command -v yq >/dev/null || { echo "::error::yq is not installed"; exit 1; }

          # ⚠ AND SO IS THE CORPUS ASSERTION BELOW. `command -v` closed the 127 hole; it did NOT
          # close this one, and the two are separate holes with the same symptom. `! yq -e`
          # inverts yq's exit 1 for "no matches" and its exit 1 for "file not found"
          # IDENTICALLY. Measured 2026-08-11 with mikefarah yq v4.53.3:
          #     clean corpus  -> Error: no matches found                            -> EXIT 0  ✅
          #     missing path  -> Error: open …/does-not-exist/*.yml: no such file   -> EXIT 0  ❌
          # So moving, renaming or emptying infrastructure/observability/prometheus/rules/ turns
          # this gate permanently green having opened nothing. Arms 2 and 3 of this job were
          # already immune — `[ -n "$sevs" ]` and `[ "$files" -gt 0 ]` are the same guard in the
          # same shape — and arm 1 was the one with neither.
          #
          # COUNT ALERTS, NOT FILES. A present-but-empty rules file satisfies a file count and
          # still opens nothing to check. `grep -c .` rather than `wc -l`, because yq prints
          # nothing (not one blank line) when the selection is empty.
          #
          # DO NOT DELETE THIS AS REDUNDANT WITH THE `command -v` ABOVE. That line proves the
          # TOOL is present; this one proves the INPUT is. Nothing between them distinguishes an
          # empty match from an absent file, which is the whole reason both are here.
          alerts=$(yq -r '.groups[].rules[] | select(has("alert")) | .alert' \
                     infrastructure/observability/prometheus/rules/*.yml 2>/dev/null \
                   | grep -c . || true)
          [ "$alerts" -gt 0 ] || {
            echo "::error::no alert rules found under infrastructure/observability/prometheus/rules/ — the check below inverts yq with '!', and yq cannot distinguish an empty match from an absent or empty file, so without this guard a moved, renamed or emptied rules directory makes this gate pass having parsed nothing"
            exit 1
          }
          echo "alert rules to check: $alerts"

          # A line grep cannot tell which rule a stray `severity:` belongs to — it passes a file
          # where the label sits on the wrong rule — so drive it off the PARSED document. `yq -e`
          # exits 1 on empty output, so a clean run makes `!` succeed (and prints yq's own
          # "no matches found" to stderr, which is the green path, not an error); a violation
          # prints the offending alert name and fails the step.
          #
          # THE TWO REMAINING EXITS `!` HIDES HERE, now that 127 is asserted away above and the
          # corpus is asserted non-empty. This comment used to claim there was exactly ONE, and
          # naming the wrong count is what let the missing-path hole survive a review that was
          # explicitly looking for this class of bug:
          #   * A MALFORMED rules file — yq exits non-zero, `!` swallows it. Caught by
          #     `promtool check rules` in this same job.
          #   * An UNREADABLE or VANISHED file, between the guard above and this line. Not worth
          #     a lock; the guard closes the case that actually happens (a refactor moves the
          #     directory) and promtool closes the rest.
          #
          # SINGLE check, so `! yq` is safe. A second check here must convert this step to the
          # accumulator form used by enforcement-greps.
          ! yq -e '.groups[].rules[] | select(has("alert"))
                   | select(((.labels.severity // "") | test("^(page|ticket)$") | not)
                            or (.annotations.summary // "") == ""
                            or (.annotations.runbook // "") == "")
                   | .alert' infrastructure/observability/prometheus/rules/*.yml

      - name: Every severity a rule emits has a real Alertmanager route
        run: |
          # `amtool config routes test` exits 0 for an unrouted severity too — it just falls
          # through to the default receiver, and a fall-through IS a resolution. So compare the
          # RESOLVED RECEIVER against the deliberately-named black hole, never the exit code.
          # Symptom without this: Prometheus shows the alert firing and nobody is notified
          # (prometheus-grafana-loki-tempo Gotchas).
          #
          # `// empty` is jq, not mikefarah yq — the runner's yq errors on it and the `for` loop
          # would then iterate zero severities and pass. `select(. != null)` is the yq spelling.
          set -u
          # An absent yq is caught by the `-n "$sevs"` guard below, but it is reported as "no
          # alert severities found" — a finding about the RULES FILE, for a missing binary.
          # Measured: exit 1 with that message on a host with no yq. Assert the tool by name so
          # the log says which of the two it is.
          command -v yq >/dev/null || { echo "::error::yq is not installed"; exit 1; }
          sevs=$(yq -r '.groups[].rules[] | select(has("alert")) | .labels.severity | select(. != null)' \
                   infrastructure/observability/prometheus/rules/*.yml | sort -u)
          [ -n "$sevs" ] || { echo "::error::no alert severities found to route-test"; exit 1; }

          fail=0
          for sev in $sevs; do
            recv=$(docker run --rm -v "$PWD/infrastructure/observability:/o:ro" \
                     --entrypoint amtool prom/alertmanager:v0.33.1 \
                     config routes test --config.file=/o/alertmanager/alertmanager.yml \
                     severity="$sev")
            echo "severity=$sev -> $recv"
            if [ "$recv" = "kb-unrouted" ]; then
              echo "::error::severity=$sev routes nowhere"
              fail=1
            fi
          done
          exit $fail

      - name: promtool check rules + test rules
        run: |
          # `check rules` is syntax. `test rules` is the unit suite — the only one of the two that
          # can fail on a rule which parses fine and computes the wrong thing (e.g. a
          # kb:chat_error_ratio:5m that drops timeouts).
          #
          # -w is load-bearing: promtool has historically resolved each test file's `rule_files:`
          # relative to the CWD rather than to the test file, and the repo root has no ./rules/.
          #
          # AND A PASSING RUN OF ZERO TESTS IS BYTE-IDENTICAL TO A PASSING RUN, so the count is
          # asserted twice: the declared unit-test cases off the parsed documents, and one
          # promtool SUCCESS line per test file.
          set -u
          # Without this, an absent yq reports "promtool test files declare 0 test cases" — the
          # vacuity message, for a missing binary. Measured on a host with no yq. `promtool` and
          # `amtool` need no such line: they run through pinned images with `docker run`, so
          # their absence is a pull failure, not a 127 on a pass branch.
          command -v yq >/dev/null || { echo "::error::yq is not installed"; exit 1; }
          shopt -s nullglob
          testfiles=(infrastructure/observability/prometheus/tests/*.yml)
          files=${#testfiles[@]}
          [ "$files" -gt 0 ] || { echo "::error::no promtool test files found"; exit 1; }
          cases=$(yq -r '[.tests // [] | length] | .[]' "${testfiles[@]}" \
                  | awk '{ s += $1 } END { print s + 0 }')
          echo "declared unit-test cases: $cases across $files file(s)"
          [ "${cases:-0}" -gt 0 ] || { echo "::error::promtool test files declare 0 test cases"; exit 1; }

          docker run --rm -v "$PWD/infrastructure/observability:/o:ro" \
            -w /o/prometheus --entrypoint sh prom/prometheus:v3.13.2 -c \
            'promtool check rules rules/*.yml'

          out=$(docker run --rm -v "$PWD/infrastructure/observability:/o:ro" \
                  -w /o/prometheus --entrypoint sh prom/prometheus:v3.13.2 -c \
                  'promtool test rules tests/*.yml')
          printf '%s\n' "$out"
          passed=$(printf '%s\n' "$out" | grep -c 'SUCCESS')
          echo "promtool reported $passed successful test file(s)"
          [ "$passed" -eq "$files" ] || {
            echo "::error::promtool reported $passed successful test files, expected $files"
            exit 1
          }

  # ------------------------------------------------------------------------------------------
  # compose-ci-tag-drift — CI service images track docker-compose-stack, exactly.
  # ------------------------------------------------------------------------------------------
  # A CI service one minor behind production tests a different product. On valkey/valkey:8 there is
  # no DELIFEQ and no database-level ACL, so the test that proves a cache credential cannot reach
  # the queue DB passes because there is no mechanism to fail — and it goes red the day production
  # runs 9.1.1. Same shape on the vector side: a two-minor Qdrant gap validates the client's
  # request shapes against a server production never sees.
  #
  # Every tag is docker-compose-stack's to write; CI COPIES it. This job reads the real pins out of
  # compose.yaml rather than restating them, because a second hardcoded copy is the drift.
  compose-ci-tag-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: CI data-service images equal the compose `test` profile pins
        env:
          COMPOSE: infrastructure/docker/compose.yaml
        run: |
          set -u
          # `mapfile < <(yq …)` gives the SUBSHELL's exit status to nothing: an absent yq yields
          # an empty `pins` array, and the non-vacuity loop below then reports "compose test
          # profile pins 0 image(s) for postgres" — a finding about compose.yaml, for a missing
          # binary. Measured on a host with no yq: exit 1, four wrong-blame annotations.
          command -v yq >/dev/null || { echo "::error::yq is not installed"; exit 1; }
          fail=0
          flag() { echo "::error::$1"; fail=1; }

          # Parsed off the document, not line-grepped: a grep happily reads a tag out of a comment
          # or out of the wrong service block.
          mapfile -t pins < <(yq -r '
            .services | to_entries[]
            | select((.value.profiles // []) | contains(["test"]))
            | .value.image
            | select(. != null)
            | select(test("^(postgres|valkey/valkey|qdrant/qdrant):"))' "$COMPOSE" | sort -u)
          printf 'compose test-profile pin: %s\n' "${pins[@]}"

          # Non-vacuity: the extraction itself must find all three data services, each on an exact
          # tag. Without this, a renamed service or a floating tag turns the comparison below into
          # a comparison against nothing and the job stays green.
          for family in postgres valkey/valkey qdrant/qdrant; do
            n=$(printf '%s\n' "${pins[@]}" | grep -c "^${family}:" || true)
            [ "$n" = "1" ] || flag "compose test profile pins $n image(s) for $family; expected exactly 1"
          done
          for p in "${pins[@]}"; do
            case "$p" in
              *:latest|*:) flag "compose test profile pin '$p' is floating; pin an exact tag" ;;
            esac
          done

          # Every data-service image any workflow uses must be one of those pins. Matched on the
          # YAML `image:` key so the grep cannot read its own pattern back out of this file.
          mapfile -t used < <(grep -rhoE '^[[:space:]]*image:[[:space:]]*[^[:space:]#]+' .github/workflows \
                              | sed -E 's/^[[:space:]]*image:[[:space:]]*//' \
                              | grep -E '^(postgres|valkey/valkey|qdrant/qdrant):' | sort -u || true)
          if [ "${#used[@]}" -eq 0 ]; then
            echo "no data-service images used by any workflow yet (gate-only tier); pins verified above"
          fi
          for u in "${used[@]}"; do
            printf '%s\n' "${pins[@]}" | grep -qxF "$u" \
              || flag "CI image '$u' is not the compose test-profile pin"
          done

          exit $fail

  # ------------------------------------------------------------------------------------------
  # compose-invariants — the network topology is an authorization boundary, so CI reads it.
  # ------------------------------------------------------------------------------------------
  # Every assertion here guards a SILENT authorization bypass. Moving `ai-worker-crawl` onto `data`
  # is one word in a diff and it puts the SSRF pivot one hop from Qdrant's unauthenticated REST
  # API. Putting `ai-api` on `edge` makes the data plane routable and every client-facing check in
  # Laravel optional. Neither errors, neither fails a test, and both look like tidying.
  #
  # THE NORMALISATION TRAP, and why the positive controls below are not decoration: a service's
  # `networks:` is a LIST for most services and a MAP (keys with `aliases:`) for `seaweedfs` and
  # `corpus-www`. A naive `contains(["edge"])` returns false for every map-form service, so the
  # gate computes an EMPTY intersection and passes while checking nothing — the exact vacuity this
  # job exists to remove. The `NORM` expression below handles both shapes explicitly, and three
  # controls prove it is working rather than silently returning nothing:
  #   (i)   at least one map-form `networks:` block still exists in compose.yaml;
  #   (ii)  no service in compose.yaml resolves to zero networks;
  #   (iii) the POSITIVE membership lists are asserted, not just the absence of violations —
  #         `otel-collector` in particular is on `edge` and NOT on `application` (ADR-025), so a
  #         gate written on `edge` membership instead of the edge∩application INTERSECTION
  #         false-positives on it. Both facts are asserted so the gate is proven able to tell the
  #         two apart.
  compose-invariants:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Networks, ports, profiles and volumes match the architecture
        run: |
          # ACCUMULATE, never `! grep` — every assertion below was proven to fail this job
          # independently against an injected violation. NO COUNT IS STATED HERE ANY MORE: the line
          # read "eight invariants, twenty assertions" and went stale the moment check (5b) was
          # added, which is exactly the defect class this workflow exists to catch one layer up.
          # The rule is the claim, and the measuring command is `grep -c 'eqset \|flag "' ` over
          # this step.
          set -u
          # Both parsers are asserted by name. Without this, an absent yq is reported as
          # "compose.yaml does not parse" (measured) — a finding about the file, for a missing
          # binary, and the single most misleading annotation this workflow can emit given what
          # this job guards. An absent jq is worse in a different way: `$(… | jq … | sort -u)`
          # takes the PIPELINE's last exit status, so some checks below would compare against an
          # empty set and pass.
          for t in yq jq; do
            command -v "$t" >/dev/null || { echo "::error::$t is not installed"; exit 1; }
          done
          cd infrastructure/docker
          fail=0
          flag() { echo "::error::$1"; fail=1; }

          FILES=(compose.yaml compose.override.yaml compose.prod.yaml)
          tmp=$(mktemp -d)
          for f in "${FILES[@]}"; do
            yq -o=json '.' "$f" > "$tmp/$f.json" || { echo "::error::$f does not parse"; exit 1; }
          done

          # The normaliser. `networks:` is either a sequence of names or a mapping of name -> opts.
          # shellcheck disable=SC2016  # $s is jq's variable, not the shell's; it must not expand
          NORM='(.services // {}) | to_entries[] as $s
                | (($s.value.networks // []) | if type=="object" then keys elif type=="array" then . else [] end)[]?
                | "\($s.key) \(.)"'
          memb=$(for f in "${FILES[@]}"; do jq -r "$NORM" "$tmp/$f.json"; done | sed '/^$/d' | sort -u)

          # Membership is the UNION across all three files: an overlay that quietly adds `data` to a
          # worker is the failure mode, so per-file evaluation would be the wrong reading.
          on()     { printf '%s\n' "$memb" | awk -v n="$1" '$2 == n { print $1 }' | sort -u; }
          netsof() { printf '%s\n' "$memb" | awk -v s="$1" '$1 == s { print $2 }' | sort -u; }
          eqset() {
            got=$(printf '%s\n' "$2" | sed '/^$/d' | sort -u | paste -sd' ' -)
            exp=$(printf '%s' "$3" | tr ' ' '\n' | sed '/^$/d' | sort -u | paste -sd' ' -)
            echo "  $1 = [$got]"
            [ "$got" = "$exp" ] || flag "$1 is [$got]; expected [$exp]"
          }

          # (0) Normalisation controls (i) and (ii).
          mapform=$(jq -r '[(.services//{})|to_entries[]|select(.value.networks|type=="object")|.key]|length' "$tmp/compose.yaml.json")
          echo "  map-form \`networks:\` blocks in compose.yaml: $mapform"
          [ "$mapform" -ge 1 ] \
            || flag "no map-form networks: block remains in compose.yaml — the normalisation control is vacuous; assert a known map-form service by name instead"
          nonet=$(jq -r '(.services//{})|to_entries[]
                         |select(((.value.networks//[])|if type=="object" then keys elif type=="array" then . else [] end|length)==0)
                         |.key' "$tmp/compose.yaml.json")
          [ -z "$nonet" ] \
            || flag "compose.yaml service(s) resolve to zero networks (normaliser broken, or a service really has none): $(printf '%s' "$nonet" | paste -sd, -)"

          # (1) edge is the only routable network, and exactly two application-tier services touch
          # it: the two Traefik routes into Laravel. Positive control (iii) rides along here.
          eqset "edge members" "$(on edge)" "laravel-api laravel-api-stream otel-collector sdk traefik web"
          eqset "edge n application" "$(comm -12 <(on edge) <(on application))" "laravel-api laravel-api-stream"
          printf '%s\n' "$(on edge)" | grep -qx 'otel-collector' \
            || flag "otel-collector is not on edge; the edge-vs-intersection control cannot discriminate"
          if printf '%s\n' "$(on application)" | grep -qx 'otel-collector'; then
            flag "otel-collector must not be on the application network (ADR-025)"
          fi

          # (2) The crawl worker fetches tenant-supplied URLs. It is the SSRF pivot, and Qdrant's
          # REST API is unauthenticated, so `data` must never appear here — kb-security-baseline.
          eqset "ai-worker-crawl networks" "$(netsof ai-worker-crawl)" "application observability"

          # (3) valkey-cache is the ONLY Valkey instance holding tenant text, and it runs without
          # persistence deliberately (valkey-keyspaces): a restart is the erasure. A named volume
          # would make that text survive, silently, for the volume's lifetime. Its `volumes:` list
          # is NOT empty — it carries two read-only config binds — so the assertion is "no named
          # volume", i.e. every mount source is a path (`.`, `/` or an interpolation), plus no
          # top-level `valkey-cache` volume key in any of the three files.
          for f in "${FILES[@]}"; do
            if jq -e '(.volumes // {}) | has("valkey-cache")' "$tmp/$f.json" >/dev/null; then
              flag "$f declares a top-level valkey-cache volume; the cache must not persist"
            fi
            bad=$(jq -r '((.services//{})["valkey-cache"].volumes // [])[]
                         | if type=="object" then (.source // "") else . end
                         | select(test("^[./$]") | not)' "$tmp/$f.json")
            [ -z "$bad" ] \
              || flag "$f mounts a named volume on valkey-cache: $(printf '%s' "$bad" | paste -sd, -)"
          done

          # (4) ADR-013: the Next.js server talks to Laravel over the public hostname, never over an
          # internal network. One extra network here is a second, unaudited path into the data tier.
          eqset "web networks" "$(netsof web)" "edge"

          # (5) Exactly ONE backing store bridges into `application`, and it is valkey-core (the
          # queue every worker must reach). Postgres, Qdrant, SeaweedFS and valkey-cache stay on
          # `data` only, which is what keeps the crawl worker's neighbours away from them. The
          # application tier itself legitimately spans both networks, so it is excluded by name
          # prefix — and the exclusion is asserted non-empty so it cannot be silently narrowing the
          # set to nothing.
          for store in postgres qdrant seaweedfs valkey-cache; do
            if printf '%s\n' "$(on application)" | grep -qx "$store"; then
              flag "$store is on the application network; only valkey-core may bridge"
            fi
            printf '%s\n' "$(on data)" | grep -qx "$store" || flag "$store is not on the data network"
          done
          eqset "valkey-core networks" "$(netsof valkey-core)" "application data"
          tier=$(comm -12 <(on data) <(on application) | grep -cE '^(ai|laravel)-' || true)
          echo "  application-tier services spanning data+application (excluded): $tier"
          [ "$tier" -ge 1 ] \
            || flag "the ^(ai|laravel)- exclusion matched nothing; check 5 is comparing a set it cannot have narrowed"
          eqset "non-app-tier services on both data and application" \
                "$(comm -12 <(on data) <(on application) | grep -vE '^(ai|laravel)-' || true)" "valkey-core"

          # (5b) EXACT MEMBERSHIP OF THE TWO NETWORKS THAT ARE AUTHORIZATION BOUNDARIES.
          #
          # WHY THIS EXISTS — #109, and it is the one failure mode every other check above shares.
          # Check (5) excludes the application tier by NAME PREFIX (`^(ai|laravel)-`), which is
          # correct for what (5) asks (which BACKING STORE bridges into `application`) and blind to
          # a different question: whether a service that already matches the prefix has been given a
          # network it does not need. Measured 2026-08-11 on `laravel-migrate`, whose correct set is
          # `[data, observability]`:
          #
          #     mutation                                    checks (0)-(8), before (5b)
          #     [application, data, observability]          exit 0  — the OVER-BROAD fix passes
          #     [data]                                      exit 0  — the tidy-back REGRESSION passes
          #
          # So the gate could tell neither direction from the shipped value, and the distinction was
          # carried entirely by a comment in compose.yaml. A comment is not a gate.
          #
          # The remedy is an EXHAUSTIVE membership list for each network whose membership is a
          # security decision, in the same shape as check (1)'s `edge members`. Joining `application`
          # or `data` now costs an explicit edit to this file, which is the review the network
          # boundary is supposed to get. That is deliberately a maintenance cost: the alternative is
          # a rule that admits new members silently, which is what (5)'s prefix exclusion does.
          #
          # `observability` is deliberately NOT listed exhaustively, and the reason is the one
          # compose.yaml states beside laravel-migrate: it is `internal: true`, it grants no egress,
          # and its only listener is the Collector's OTLP receiver, which holds no credential and
          # returns no data. An exhaustive list there would churn on every telemetry change while
          # guarding no boundary. Its membership is asserted per service, below, where it is
          # load-bearing for something else (boot latency).
          eqset "application members" "$(on application)" \
                "ai-api ai-beat ai-worker-crawl ai-worker-embedding ai-worker-evaluation \
                 ai-worker-ingestion corpus-www laravel-api laravel-api-stream laravel-scheduler \
                 laravel-worker laravel-worker-long mailpit valkey-core"
          eqset "data members" "$(on data)" \
                "adminer ai-api ai-worker-embedding ai-worker-evaluation ai-worker-ingestion \
                 laravel-api laravel-api-stream laravel-migrate laravel-scheduler laravel-worker \
                 laravel-worker-long postgres postgres-test qdrant qdrant-test seaweedfs \
                 valkey-cache valkey-core valkey-test"

          # (5c) laravel-migrate's exact set, asserted by name because (5b) cannot catch the
          # NARROWING direction: dropping `observability` removes it from no list above.
          # `observability` on a one-shot migration container looks like a telemetry preference and
          # is a boot-latency control — env/core-api.env points all six core-api containers at
          # http://otel-collector:4318, and without the network this container's shutdown flush
          # resolves that name against a network the Collector is not on, retries, and charges the
          # resolver latency to ~ten services that gate on its
          # `service_completed_successfully`. The full argument, with the eight preserved runs it
          # was measured from, is the comment above `networks:` in compose.yaml.
          eqset "laravel-migrate networks" "$(netsof laravel-migrate)" "data observability"

          # (6) No `ai-*` or `laravel-*` service publishes a host port, in ANY overlay. Non-negotiable
          # 3: clients never reach FastAPI, and Horizon's dashboard is not a public surface. A
          # published port bypasses Traefik entirely, so the routing config is not the control here.
          for f in "${FILES[@]}"; do
            p=$(jq -r '(.services//{})|to_entries[]|select(.value.ports!=null)|select(.key|test("^(ai|laravel)-"))|.key' "$tmp/$f.json")
            [ -z "$p" ] || flag "$f publishes a host port on: $(printf '%s' "$p" | paste -sd, -)"
          done
          # …and in compose.yaml and compose.prod.yaml, traefik is the ONLY service with a `ports:`
          # key at all. NOT asserted over compose.override.yaml: that file deliberately publishes
          # five data services (postgres, qdrant, both valkeys, seaweedfs) for local development,
          # which is why `make deploy` hardcodes the -f pair rather than letting the override load.
          for f in compose.yaml compose.prod.yaml; do
            p=$(jq -r '(.services//{})|to_entries[]|select(.value.ports!=null)|select(.key!="traefik")|.key' "$tmp/$f.json")
            [ -z "$p" ] || flag "$f publishes a host port on a service other than traefik: $(printf '%s' "$p" | paste -sd, -)"
          done
          eqset "compose.yaml ports-bearing services" \
                "$(jq -r '(.services//{})|to_entries[]|select(.value.ports!=null)|.key' "$tmp/compose.yaml.json")" "traefik"

          # (7) A service with no `profiles` key is ALWAYS enabled; tagging a required service with
          # a profile makes `docker compose up` start nothing. And `depends_on` pointing into an
          # inactive profile is a hard error, never an auto-enable.
          eqset "profile names in use" \
                "$(for f in "${FILES[@]}"; do jq -r '(.services//{})|to_entries[]|(.value.profiles//[])[]?' "$tmp/$f.json"; done)" \
                "dev-tools observability test"
          for f in "${FILES[@]}"; do
            d=$(jq -r '(.services//{}) as $svc | $svc | to_entries[]
                       | select(((.value.profiles//[])|length)==0) | .key as $n
                       | ((.value.depends_on // {}) | if type=="object" then keys elif type=="array" then . else [] end)[]?
                       | select((((($svc[.]) // {}).profiles // [])|length) > 0) | "\($n)->\(.)"' "$tmp/$f.json")
            [ -z "$d" ] \
              || flag "$f: an unprofiled service depends_on a profiled one — compose errors, it does not auto-enable: $(printf '%s' "$d" | paste -sd, -)"
          done

          # (8) The `test`-profile data services pin the SAME tags as production. A test Valkey one
          # minor behind has no DELIFEQ and no database-level ACL, so the isolation test passes
          # because there is no mechanism left to fail it.
          for pair in "postgres postgres-test" "qdrant qdrant-test" "valkey-core valkey-test"; do
            prod=${pair%% *}; test=${pair##* }
            a=$(jq -r --arg n "$prod" '(.services[$n].image // "")' "$tmp/compose.yaml.json")
            b=$(jq -r --arg n "$test" '(.services[$n].image // "")' "$tmp/compose.yaml.json")
            echo "  $prod = ${a:-<none>} / $test = ${b:-<none>}"
            if [ -z "$a" ] || [ -z "$b" ]; then
              flag "missing image pin for $prod or $test"
            elif [ "$a" != "$b" ]; then
              flag "test-profile $test pins '$b' but production $prod pins '$a'"
            fi
          done

          exit $fail

      - name: Vacuity ledger
        run: |
          # Nothing here is vacuous: every assertion above compares against a value the three compose
          # files actually carry today, and the three normalisation controls fail if the extraction
          # ever starts returning nothing. Stated explicitly so the absence of a ledger line is a
          # claim someone made, not an omission.
          #
          # ONE THING WAS VACUOUS UNTIL 2026-08-11 AND IS NAMED HERE RATHER THAN QUIETLY FIXED (#109):
          # no assertion distinguished an OVER-BROAD network grant from a narrow one. Both
          # `laravel-migrate: [application, data, observability]` (the lazy fix, copied from
          # laravel-scheduler) and `laravel-migrate: [data]` (the tidy-back regression) passed this
          # job exit 0 — check (5)'s `^(ai|laravel)-` exclusion swallowed the first and nothing at
          # all looked at the second. Checks (5b) and (5c) close both directions; each was proven by
          # mutation against this tree, in both directions, before being written down.
          echo "vacuous-today: none — every compose assertion reads live values from the three compose files."

  # ------------------------------------------------------------------------------------------
  # repo-artifact-consistency — generated files, twinned files, and triples that must agree.
  # ------------------------------------------------------------------------------------------
  # Every check in this job is zero-install: `node` and `python3` are preinstalled on the runner
  # image, and each script this job runs was chosen because it imports only its language's standard
  # library. Nothing here needs a lockfile, which is why it can be a required check today.
  repo-artifact-consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Design tokens are regenerated, not hand-edited
        run: |
          # `packages/design-tokens/generated/` is consumed by web AND widget. A hand-edit there
          # survives every type check and every test, and is silently reverted by the next person
          # who runs the build — taking a deliberate colour change with it. Generate and diff.
          #
          # No `pnpm install`: build.mjs imports only node:fs, node:path and node:url.
          #
          # ACCUMULATE, never `! git diff` — three checks.
          set -u; fail=0
          flag() { echo "::error::$1"; fail=1; }
          node --version

          node packages/design-tokens/scripts/build.mjs

          git diff --exit-code -- packages/design-tokens/generated \
            || flag "packages/design-tokens/generated is out of date; run node packages/design-tokens/scripts/build.mjs and commit the result"

          # `git diff` cannot see a generated file that was never added. An untracked artifact means
          # the build emits something the repo does not carry, so consumers resolve a stale copy.
          untracked=$(git ls-files --others --exclude-standard -- packages/design-tokens/generated)
          [ -z "$untracked" ] \
            || flag "the token build emitted untracked file(s): $(printf '%s' "$untracked" | paste -sd, -)"

          # Non-vacuity: a build that writes nothing diffs clean forever.
          n=$(git ls-files -- packages/design-tokens/generated | grep -c . || true)
          echo "tracked generated token files: $n"
          [ "$n" -ge 3 ] || flag "only $n generated token file(s) tracked; the diff above compares almost nothing"

          exit $fail

      - name: The SSE test server twins stay byte-identical
        run: |
          # apps/web and apps/mobile each carry a copy of the SSE fixture server, because their test
          # runners cannot share a workspace package. Drift between them is the failure that looks
          # like a mobile-only streaming bug: one twin learns about a new frame type, the other
          # keeps asserting the old shape and stays green. This is a full substitute for the
          # cross-runtime Vitest suite, which is blocked on lockfiles.
          #
          # ACCUMULATE, never `! diff` — four checks.
          set -u; fail=0
          flag() { echo "::error::$1"; fail=1; }
          W=apps/web/tests/fixtures/sse-server.ts
          M=apps/mobile/tests/fixtures/sse-server.ts

          for f in "$W" "$M"; do
            [ -f "$f" ] || { flag "$f is missing; the twin comparison has nothing to compare"; continue; }
            grep -q 'TWIN REGION BEGIN' "$f" \
              || flag "$f has no TWIN REGION BEGIN marker; without it the comparison silently covers zero lines"
          done
          [ "$fail" = "0" ] || exit 1

          region() { sed -n '/TWIN REGION BEGIN/,$p' "$1"; }
          lines=$(region "$W" | grep -c . || true)
          echo "twin region: $lines non-blank line(s)"
          [ "$lines" -ge 20 ] || flag "the twin region is only $lines line(s); the marker has probably drifted to the end of the file"

          diff -u <(region "$W") <(region "$M") \
            || flag "the SSE fixture twins have drifted below TWIN REGION BEGIN; they must be byte-identical"

          exit $fail

      - name: Widget build-time constants agree three ways
        run: |
          # Vite's `define` is a TEXT SUBSTITUTION, not a binding. An undeclared `__KB_*` is not a
          # build error: the literal survives into the bundle and the launcher dies with
          # `ReferenceError: __KB_API_ORIGIN__ is not defined` on the customer's page, before it
          # paints. So three sets must be equal — the tokens used under apps/widget/src, the
          # `define` keys in vite.config.ts, and the declarations in src/env.d.ts.
          #
          # SELF-TRIPPING MITIGATION (technique: anchored patterns, not path exclusions). Both
          # config files DOCUMENT the rule and name real tokens in prose — vite.config.ts spells
          # `ReferenceError: __KB_API_ORIGIN__ …` and env.d.ts spells the rg command itself. Path
          # exclusion is wrong here because those files are the two sides being compared, so
          # instead the `define` set is read from `^<indent>__KB_X__:` (a mapping key) and the
          # declaration set from `^declare const __KB_X__` (a declaration). Prose matches neither.
          # The USAGE set is deliberately the whole of src/ including env.d.ts, exactly as
          # env.d.ts's own header specifies — a token named only in a src comment is still a token
          # someone expects to exist.
          #
          # ACCUMULATE, never `! grep` — three checks.
          set -u; fail=0
          flag() { echo "::error::$1"; fail=1; }

          used=$(grep -rhoE '__KB_[A-Z_]+__' apps/widget/src | sort -u)
          defs=$(grep -oE '^[[:space:]]*__KB_[A-Z_]+__:' apps/widget/vite.config.ts | sed -E 's/[[:space:]]+//g; s/:$//' | sort -u)
          decl=$(grep -oE '^declare const __KB_[A-Z_]+__' apps/widget/src/env.d.ts | awk '{ print $3 }' | sort -u)
          printf 'used in src : %s\n' "$(printf '%s' "$used" | paste -sd' ' -)"
          printf 'vite define : %s\n' "$(printf '%s' "$defs" | paste -sd' ' -)"
          printf 'env.d.ts    : %s\n' "$(printf '%s' "$decl" | paste -sd' ' -)"

          # Non-vacuity first: three empty sets are equal, and that is the bug this would hide.
          n=$(printf '%s' "$defs" | grep -c . || true)
          [ "$n" -ge 1 ] || flag "no __KB_ define keys extracted from apps/widget/vite.config.ts; the anchored pattern has stopped matching"

          [ "$used" = "$defs" ] \
            || flag "tokens under apps/widget/src do not equal the vite.config.ts define keys; an unsubstituted token ships as a placeholder"
          [ "$defs" = "$decl" ] \
            || flag "the vite.config.ts define keys do not equal the declarations in apps/widget/src/env.d.ts"

          exit $fail

      - name: The corpus version agrees in all three places
        run: |
          # An eval run against the wrong corpus is REFUSED, not compared — so a version that
          # disagrees across the three files turns every eval into a refusal, or worse, compares a
          # dataset against fixtures whose bytes changed underneath it and reports the drop as a
          # retrieval regression.
          #
          # ACCUMULATE, never a bare `[` — three checks.
          set -u; fail=0
          flag() { echo "::error::$1"; fail=1; }
          tomlv() { grep -oE '^corpus_version[[:space:]]*=[[:space:]]*"[^"]+"' "$1" | sed -E 's/.*"([^"]+)"/\1/'; }

          v=$(tr -d '[:space:]' < samples/VERSION)
          d=$(tomlv samples/golden/dataset.toml)
          m=$(tomlv samples/corpus/manifest.toml)
          echo "samples/VERSION            = ${v:-<empty>}"
          echo "golden/dataset.toml        = ${d:-<empty>}"
          echo "corpus/manifest.toml       = ${m:-<empty>}"

          [ -n "$v" ] && [ -n "$d" ] && [ -n "$m" ] \
            || flag "one of the three corpus versions is empty; three empty strings compare equal"
          [ "$v" = "$d" ] || flag "samples/VERSION ($v) != golden/dataset.toml corpus_version ($d)"
          [ "$v" = "$m" ] || flag "samples/VERSION ($v) != corpus/manifest.toml corpus_version ($m)"

          exit $fail

      - name: "`make deploy` cannot run without preflight"
        run: |
          # `preflight` is a PREREQUISITE of `deploy`, not the first line of its recipe. A line
          # inside the recipe can be reordered, commented out during an incident, or lost to a
          # copy-paste; a prerequisite cannot run second. This one grep is what keeps the
          # refuse-to-deploy check ahead of the deploy.
          #
          # SINGLE check, so `! grep` would be safe — but the assertion is POSITIVE (the line must
          # exist), so it is a plain grep whose own exit status fails the step.
          grep -qE '^deploy:[[:space:]]+preflight$' Makefile \
            || { echo "::error::Makefile has no 'deploy: preflight' prerequisite line"; exit 1; }
          grep -nE '^deploy:' Makefile

      - name: The root manifest declares zero dependencies and the root importer resolves nothing
        run: |
          # `.npmrc` sets shared-workspace-lockfile=false, so ONE root dependency turns the root
          # lockfile from an empty stub into a real, fifth resolution — scanned by no
          # `osv-scanner --lockfile` invocation and keyed by no cache, so the failure is a CVE that
          # no job reports.
          #
          # ------------------------------------------------------------------------------------
          # THIS CHECK USED TO BE `[ ! -e pnpm-lock.yaml ]`, AND THAT WAS WRONG ABOUT pnpm ITSELF.
          # ------------------------------------------------------------------------------------
          # pnpm writes ONE LOCKFILE PER IMPORTER, UNCONDITIONALLY, and with
          # shared-workspace-lockfile=false the ROOT IS AN IMPORTER LIKE ANY OTHER. There is no
          # setting that suppresses it. So a root `pnpm-lock.yaml` is not evidence of a violation,
          # it is what a correct `pnpm install` produces — 169 bytes of it:
          #
          #     lockfileVersion: '9.0'
          #     settings: {autoInstallPeers: false, excludeLinksFromLockfile: false}
          #     overrides: {markdown-it: 15.0.0, dompurify: 3.4.13}
          #     importers:
          #       .: {}
          #
          # The zero-dependency rule keeps that file EMPTY. It does not, and cannot, stop it from
          # existing. Asserting non-existence made this job go red the moment the tree carried a
          # real install, and "fixing" it by deleting the file just makes the next install recreate
          # it — so DO NOT PUT `! -e` BACK. What the contract actually needs is asserted below:
          # the root importer resolves NO packages.
          #
          # (`overrides:` in that stub is expected and must NOT be read as a dependency. It is the
          # root manifest's `pnpm.overrides` block, which is workspace-wide policy — it constrains
          # what the OTHER importers may resolve and installs nothing here.)
          #
          # ACCUMULATE, never a bare `[` — five checks.
          set -u; fail=0
          # This step happens to fail 127 outright when jq is absent (measured), because its first
          # jq is a bare assignment under `bash -e`. That is luck, not design: the non-vacuity
          # check at the bottom (`jq -e 'has("packageManager")'`) sits inside a `||`, which would
          # swallow a 127 the same way `! yq` does one job up. Assert both parsers by name.
          for t in yq jq; do
            command -v "$t" >/dev/null || { echo "::error::$t is not installed"; exit 1; }
          done
          flag() { echo "::error::$1"; fail=1; }

          counts=$(jq -r '[((.dependencies//{})|length),
                           ((.devDependencies//{})|length),
                           ((.optionalDependencies//{})|length),
                           ((.peerDependencies//{})|length)] | @tsv' package.json)
          echo "root package.json dep counts (deps/dev/optional/peer): $counts"
          total=$(printf '%s\n' "$counts" | awk -F'\t' '{ print $1 + $2 + $3 + $4 }')
          [ "$total" = "0" ] || flag "the root package.json declares $total dependency/dependencies; it must declare zero"

          # The lockfile is parsed, not grepped: `importers: {.: {}}` and a `packages:` section
          # eighty lines further down are both just text to a line grep, and the whole point is to
          # tell an EMPTY importer from a populated one.
          tmp=$(mktemp -d)
          if [ -e pnpm-lock.yaml ]; then
            yq -o=json '.' pnpm-lock.yaml > "$tmp/root-lock.json" \
              || { echo "::error::root pnpm-lock.yaml does not parse"; exit 1; }

            # (1) The root importer resolves nothing. Every dependency category pnpm can write for
            # an importer is summed, so a devDependency is as much a violation as a dependency.
            n=$(jq -r '[(.importers["."] // {}) | to_entries[]
                        | select(.key | test("^(dependencies|devDependencies|optionalDependencies)$"))
                        | (.value | length)] | add // 0' "$tmp/root-lock.json")
            echo "root importer resolved package count: $n"
            [ "$n" = "0" ] || flag "the root importer in pnpm-lock.yaml resolves $n package(s); the root must resolve none"

            # (2) No resolution tables at all. `packages:` and `snapshots:` only appear once
            # something was actually resolved, so their presence is the same violation seen from
            # the other side — and it catches the case where a dependency arrives under an importer
            # key this check did not think to sum.
            for key in packages snapshots; do
              if jq -e --arg k "$key" 'has($k) and ((.[$k] | length) > 0)' "$tmp/root-lock.json" >/dev/null; then
                flag "root pnpm-lock.yaml has a non-empty '$key:' section; the root importer resolved something"
              fi
            done

            # (3) Non-vacuity: `.importers` must exist and must contain exactly the root importer.
            # Without this, a lockfile whose shape changed under a future lockfileVersion makes
            # check (1) sum an absent object to 0 and pass while reading nothing.
            imp=$(jq -r '(.importers // {}) | keys | join(",")' "$tmp/root-lock.json")
            echo "root lockfile importers: [$imp]"
            [ "$imp" = "." ] \
              || flag "root pnpm-lock.yaml declares importers [$imp]; with shared-workspace-lockfile=false it must declare exactly '.'"
          else
            # Also a finding, in the other direction: `pnpm install` at the root always writes this
            # file, so its ABSENCE means no install has been run against the committed tree, and
            # every assertion above silently checked nothing.
            flag "no root pnpm-lock.yaml — pnpm writes one per importer unconditionally, so its absence means the root importer was never installed and this check is vacuous"
          fi

          # Non-vacuity: jq must actually have parsed the manifest.
          jq -e 'has("packageManager")' package.json >/dev/null \
            || flag "package.json did not parse as expected; the dependency counts above mean nothing"

          exit $fail

      - name: Exactly one OpenCV distribution reaches the ai-service image
        run: |
          # `opencv-python` and `opencv-python-headless` install THE SAME FILE — both RECORDs claim
          # `cv2/cv2.abi3.so`, and neither declares a conflict with the other. Resolve both and the
          # image's OCR behaviour is decided by UNPACK ORDER, not by its manifest. MEASURED, from
          # the two builds that produced this gate: knowledgebot/ai-service:dev (2026-08-10) landed
          # the headless .so and worked; a cold-cache rebuild of the SAME TREE landed the plain one
          # and died at the model-download step with
          #     ImportError: libxcb.so.1: cannot open shared object file
          # because the plain wheel bundles libQt5XcbQpa/libX11-xcb and the base stage installs no
          # X libraries (correctly — Chromium's are confined to `runtime-crawl`).
          #
          # `rapidocr==3.9.2` declares plain `opencv-python` and we cannot edit rapidocr, so
          # pyproject.toml's `[tool.uv] override-dependencies` drops that edge with a marker that
          # can never be true. WHY THAT NEEDS A GATE: an override naming a package nothing requires
          # is SILENTLY IGNORED by uv — no warning, no error. A rapidocr bump that renames or drops
          # the requirement leaves the line in place, looking correct, doing nothing.
          #
          # Grep the LOCK, not the image: this job installs nothing, and the lock is what the image
          # is built from. requirements.lock is the flat export, one `name==version` per package.
          #
          # ACCUMULATE, never a bare `[` — four checks.
          set -u; fail=0
          flag() { echo "::error::$1"; fail=1; }
          L=services/ai-service/requirements.lock

          [ -f "$L" ] || flag "$L is missing; every assertion below compares nothing"

          # Distribution names only: anchored at column 0, `==`, and NOT a --hash continuation.
          dists=$(grep -oE '^opencv[a-z0-9._-]*==' "$L" | sed 's/==$//' | sort -u)
          echo "opencv distributions in $L: ${dists:-<none>}"

          [ "$dists" = "opencv-python-headless" ] \
            || flag "expected exactly 'opencv-python-headless' in $L, found: ${dists:-<none>}. Two OpenCV distributions install the same cv2.abi3.so and the winner is unpack order; one that is NOT headless needs X11 in a server image."

          grep -qE '^\s*"opencv-python\s*;' services/ai-service/pyproject.toml \
            || flag "pyproject.toml no longer carries the opencv-python override in [tool.uv] override-dependencies; without it rapidocr re-adds the Qt/X11 wheel"

          grep -qE '^overrides = \[\{ name = "opencv-python"' services/ai-service/uv.lock \
            || flag "uv.lock's [manifest] block does not record the opencv-python override; the lock was regenerated by a uv that did not read pyproject.toml's [tool.uv] table, or the override was dropped"

          # Non-vacuity: the grep pattern must be able to see a package line at all.
          n=$(grep -cE '^[a-z0-9][a-z0-9._-]*==' "$L" || true)
          echo "$L declares $n pinned distributions"
          [ "$n" -gt 100 ] \
            || flag "$L parsed as only $n pinned distributions; the pattern above matched almost nothing and the opencv assertion is vacuous"

          exit $fail

      - name: The vendored SAST ruleset resolves to a non-zero number of rules
        run: |
          # A scan whose --config path resolves to an empty directory exits 0. Green job, nothing
          # scanned, indistinguishable in the log from a green job that scanned everything. This
          # script parses the vendored rules and refuses a count below the floor; it uses python3
          # and PyYAML only, with no repo install, and it exits 2 (distinct from 0) when it could
          # not run at all — because a check that could not run must never read as a check that
          # passed. Run it here so the floor is enforced before `ci.yml` ever invokes a scanner.
          bash scripts/security/rule_count_check.sh

      - name: Vacuity ledger
        run: |
          # None of the eight checks in this job is vacuous: each compares real, populated artifacts
          # (19 generated tokens, a twin region of real fixture code, three live __KB_ tokens, a
          # corpus version present in all three files, a real deploy prerequisite, a real manifest,
          # 263 pinned distributions in requirements.lock, and 31 vendored rules across 5 files).
          # Every one of them additionally carries its own
          # non-vacuity assertion, so an artifact that empties out fails rather than passes.
          echo "vacuous-today: none — every artifact this job compares is populated, and each check asserts its own corpus is non-empty."

  # ------------------------------------------------------------------------------------------
  # boundary-greps — three banned constructs, each of which reviews as one ordinary line.
  # ------------------------------------------------------------------------------------------
  # SELF-TRIPPING is the governing hazard for this whole job. Each gate must name the token it
  # bans, and the file that DOCUMENTS the ban therefore contains that token — so a naive repo-wide
  # grep goes red on the explanation, and the next person "fixes" the build by deleting the
  # explanation. Every step below states which mitigation it uses (anchored pattern, path scope, or
  # exempt marker) and why that one. The mitigation ships in the same step as the gate; a gate
  # landed first and mitigated later is a gate that gets deleted in between.
  boundary-greps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: No Server Actions in the admin app
        run: |
          # A Server Action is a POST endpoint with no route, no middleware and no rate limit. Every
          # write in this product goes through Laravel, where the quota accounting, the policy check
          # and the audit row live — kb-architecture-map. A `'use server'` file bypasses all three
          # and reads as an ordinary async function.
          #
          # SELF-TRIPPING MITIGATION (technique: anchored pattern + path scope, both). The ESLint
          # rule that bans this is `eslint.base.mjs`, which necessarily spells
          # `ExpressionStatement[directive='use server']`; the scope is therefore apps/web, which
          # does not contain it. The pattern is additionally anchored to a DIRECTIVE — a quoted
          # string alone on a line — so prose, a selector string, or a doc comment naming the
          # directive does not match even if the scope later widens.
          #
          # SINGLE check, so `! grep` is safe. A second check here must convert this step to the
          # accumulator form used by enforcement-greps.
          #
          # `--exclude-dir=node_modules` IS NOT TIDINESS, IT IS A THIRD MITIGATION, and it was
          # found by running this gate on a tree that had been `pnpm install`ed. Next 16 ships its
          # own documentation and a compiled RSC runtime inside the package:
          #   next/dist/docs/01-app/03-api-reference/01-directives/use-server.md  (7 hits)
          #   next/dist/compiled/react-server-dom-webpack/…-node-register.js      (2 hits)
          # Twelve matches, all in a dependency, none of them ours — the gate fails on a correct
          # tree and the next person deletes the gate. It does NOT fail on GitHub today only
          # because `gates.yml` runs no install, which makes it invisible exactly where it is
          # checked and reproducible everywhere else. Same class of defect as the `vendor/` hit in
          # the ADR-017 step below. `.next` is excluded for the same reason once a build has run.
          ! grep -rnE --exclude-dir=node_modules --exclude-dir=.next \
              "^[[:space:]]*['\"]use server['\"]" apps/web

      - name: The error-rate matcher is never re-derived
        run: |
          # `outcome` has four values and `timeout` is one of them, precisely because
          # kb-error-taxonomy has no timeout class. So `outcome="error"` silently omits every
          # timed-out request: the dashboard reads 0.4% during an outage in which a third of chat
          # requests time out, and is calmest exactly when the provider is slowest. The correct
          # matcher is written ONCE, as a recording rule in kb-recording.yml, and referenced.
          #
          # SELF-TRIPPING MITIGATION (three techniques, because the roots differ in kind):
          #  * PATH SCOPE — kb-recording.yml is the definition, prometheus/tests/** must construct
          #    an outcome="error" input sample to prove the rule counts timeouts, and
          #    infrastructure/observability/README.md is this gate's own specification. All three
          #    are excluded by path. This workflow file is out of scope by construction: no root
          #    below includes .github/.
          #  * ANCHORED PATTERN — over apps/ and services/, the match must also sit on a line
          #    carrying a PromQL aggregation or range call. Source code legitimately DOCUMENTS a
          #    counter's label value in prose (today: services/ai-service/app/crawl/recrawl.py,
          #    which explains the crawl run-level circuit breaker), and deleting that sentence to
          #    green the build would delete the explanation. A re-derived matcher, by contrast, is
          #    always inside rate()/increase()/sum()/histogram_quantile().
          #  * EXEMPT MARKER — `outcome-matcher-exempt: <reason>` on the same line, everywhere.
          #
          # Both spellings are matched: rules and docs carry outcome="error", Grafana dashboard
          # JSON carries the escaped outcome=\"error\". A pattern matching only the first passes
          # over every dashboard in the repo.
          #
          # ACCUMULATE, never `! grep` — two checks.
          set -u; fail=0
          flag() { [ -n "${1//[[:space:]]/}" ] || return 0; printf '%s\n' "$1"; echo "::error::$2"; fail=1; }
          BAD='outcome=\\?"error\\?"'
          PROMQL='(rate|irate|increase|sum|avg|min|max|count|topk|histogram_quantile)\('

          # (a) Rules, dashboards and docs: the literal string has no legitimate home there.
          flag "$( grep -rnE "$BAD" \
                     infrastructure/observability/prometheus/rules \
                     infrastructure/observability/grafana/dashboards \
                     docs \
                   | grep -vF 'kb-recording.yml' \
                   | grep -v 'outcome-matcher-exempt:' || true )" \
               "outcome=\"error\" outside kb-recording.yml — it omits every timeout"

          # (b) Application source: only when the line is also a PromQL expression.
          flag "$( grep -rnE "$BAD" apps services \
                   | grep -E "$PROMQL" \
                   | grep -v 'outcome-matcher-exempt:' || true )" \
               "a PromQL expression in application source re-derives the error matcher"

          exit $fail

      - name: The control plane uses none of Laravel's first-party AI APIs
        run: |
          # ADR-017. `Str::toEmbeddings()` is a provider call wearing a string helper's clothes: it
          # writes no provider_calls row, no usage_events row, and passes no quota check, so the
          # spend is invisible to accounting rather than wrong. `DB::whereVectorSimilarTo()` is the
          # serious one — a second retrieval path carrying none of the four mandatory Qdrant
          # filters, no rerank and no evidence threshold. It returns rows perfectly happily with no
          # organization filter, and it reviews as one line of ORM.
          #
          # SELF-TRIPPING MITIGATION (technique: path scope). CONTRIBUTING.md names both symbols,
          # and so do docs/19, docs/22 and two skill files — deliberately, because a ban nobody can
          # read gets reopened per-feature. The ADR itself specifies the scope as `services/core-api`
          # and that is exactly what is scanned; the documenting files are all outside it. The
          # patterns are `(`-anchored as a second layer, so a future prose mention inside
          # services/core-api/README.md still does not trip unless it is written as a call.
          #
          # SECOND SELF-TRIPPING SOURCE, FOUND BY RUNNING THIS GATE ON A TREE THAT HAD BEEN
          # `composer install`ed: `laravel/framework` ITSELF DEFINES BOTH SYMBOLS.
          # services/core-api/vendor/laravel/framework/.../Query/Builder.php declares
          # `public function whereVectorSimilarTo(...)` and calls `->toEmbeddings(cache: true)` in
          # four places. The gate matched all five and failed on a completely correct tree.
          # It does NOT fail on GitHub, because `actions/checkout` gives this job a clean tree and
          # `vendor/` is gitignored — which is exactly what makes it dangerous: it is invisible in
          # CI and reproducible for every developer and every `make`-style local run, so the first
          # person to hit it "fixes" the gate rather than the code. `vendor/` is excluded by name
          # (not by a `--include=*.php` filter, which would not have helped: the hits ARE .php).
          # ADR-017 governs code we write; a framework's own declaration of an API we decline to
          # call is not a violation of it.
          #
          # ACCUMULATE, never `! grep` — two checks.
          set -u; fail=0
          flag() { [ -n "${1//[[:space:]]/}" ] || return 0; printf '%s\n' "$1"; echo "::error::$2"; fail=1; }

          # (a) The two call shapes.
          flag "$( grep -rnE --exclude-dir=vendor --exclude-dir=node_modules \
                     'toEmbeddings\(|whereVectorSimilarTo\(' services/core-api \
                   | grep -v 'adr017-exempt:' || true )" \
               "Laravel first-party embedding or vector-search call in the control plane (ADR-017)"

          # (b) And the SDK itself, which would put provider credentials and token accounting inside
          # the control plane and outside kb-provider-adapter-contract. A require line is the only
          # place this is visible before the first call site exists.
          flag "$( grep -rnE '"laravel/(ai|mcp)"' services/core-api --include=composer.json \
                   | grep -v 'adr017-exempt:' || true )" \
               "Laravel's AI SDK is required in services/core-api/composer.json (ADR-017)"

          exit $fail

      - name: Vacuity ledger
        run: |
          # Counts of lines the DETECTOR could see, before exemptions. Zero means regression
          # protection only. Never `exit 1` here — this step reports, the gates enforce.
          set -u
          # `--exclude-dir` for the same reason the gate itself carries it: on a tree that has been
          # `pnpm install`ed, Next's own bundled docs and compiled RSC runtime contribute 28 files
          # and the ledger then reports a rich corpus for a gate whose real corpus is zero.
          server=$(grep -rlE --exclude-dir=node_modules --exclude-dir=.next "^[[:space:]]*['\"]use server['\"]" apps/web 2>/dev/null | grep -c . || true)
          rsc=$(find apps/web/src -name '*.tsx' 2>/dev/null | grep -c . || true)
          promql=$(grep -rnE 'outcome=\\?"[a-z]+\\?"' \
                     infrastructure/observability/prometheus/rules \
                     infrastructure/observability/grafana/dashboards 2>/dev/null | grep -c . || true)
          # `--exclude-dir=vendor` for the same reason the gate above carries it: on a tree that has
          # been `composer install`ed this count is ~920 instead of 3, and the ledger then reports
          # a rich corpus for a gate whose real corpus is three lines.
          #
          # `$php` IS A POPULATION, NOT A CORPUS, and conflating the two is what broke the note
          # below. The threshold used to be `[ "$php" -gt 8 ]` — a hand-typed 8 against a count of
          # every `DB::` / `->where(` / `::query(` / `Str::` site in services/core-api, used as a
          # proxy for "is there anywhere the banned symbol could plausibly appear". That proxy has
          # since passed its own threshold (52 sites today) while the ADR-017 detector still
          # matches ZERO lines, so the note stopped printing and the ledger silently began
          # claiming coverage the gate does not have. Exactly the failure mode the `[ "$qdrant"
          # -gt 5 ]` threshold in enforcement-greps' ledger had, in the other direction. The note
          # is now driven by the GATE'S OWN detector — both arms of it, the two call shapes and
          # the composer requirement — and `$php` stays as the population that makes the note
          # meaningful: "plenty of query code, none of it reaching for these two symbols".
          php=$(grep -rnE --exclude-dir=vendor 'DB::|->where\(|::query\(|Str::' services/core-api --include=*.php 2>/dev/null | grep -c . || true)
          adr017=$( { grep -rnE --exclude-dir=vendor --exclude-dir=node_modules \
                        'toEmbeddings\(|whereVectorSimilarTo\(' services/core-api 2>/dev/null || true
                      grep -rnE '"laravel/(ai|mcp)"' services/core-api --include=composer.json 2>/dev/null || true
                    } | grep -c . || true)
          echo "detector corpus:"
          echo "  apps/web React components                 : $rsc  (files declaring 'use server': $server)"
          echo "  outcome= matchers in rules and dashboards : $promql"
          echo "  ADR-017 banned symbols in services/core-api: $adr017  (population: $php query call sites)"
          [ "$server" -gt 0 ] || echo "vacuous-today: 'use server' — apps/web has server components but no Server Action anywhere, so this gate cannot fail yet; it is regression protection for the first write path."
          [ "$adr017" -gt 0 ] || echo "vacuous-today: ADR-017 first-party AI APIs — neither toEmbeddings( nor whereVectorSimilarTo( appears anywhere in services/core-api, and composer.json requires neither laravel/ai nor laravel/mcp, so this gate has nothing to reject. It is NOT for want of a plausible call site: $php query call sites exist in that tree today. This count is the gate's own detector, not a proxy threshold — it stops printing the moment either symbol appears, which for an absence gate is the same moment the gate fails."
          [ "$promql" -gt 0 ] || echo "vacuous-today: error-rate matcher — no outcome= matcher exists in any rule or dashboard, so scope (a) scans nothing."
