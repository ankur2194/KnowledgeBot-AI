# infrastructure/docker/corpus-www/nginx.conf
#
# The crawl fixture origin for the golden evaluation corpus. Compose service `corpus-www`,
# `test` profile only, on the `application` network so ai-worker-crawl can reach it.
#
# Document root is samples/corpus/documents/site/www/, mounted read-only. That directory belongs to
# rag-eval-engineer; this file only serves it.
#
# ================================================================================================
# THE POINT OF THIS FILE IS EVERYTHING IT DOES NOT DO
# ================================================================================================
# The corpus asserts byte-for-byte extraction results and recrawl change detection. Any header this
# server invents, any body it rewrites, and any representation it negotiates makes a golden score a
# function of the nginx version rather than of the crawler. So: no compression, no charset
# rewriting, no injected headers, no directory listing, no error-page substitution for the crawled
# tree, no server-side includes, no sub_filter.

server {
    listen 8080 default_server;
    server_name corpus-www www.kelpwright.example;
    root /usr/share/nginx/html;

    access_log off;

    # ============================================================================================
    # STABLE ETag AND Last-Modified — the requirement recrawl change detection reads
    # ============================================================================================
    # nginx derives Last-Modified from the file's mtime and the ETag from mtime + content length.
    # Both are therefore stable across container restarts *because the bytes live on a bind mount*
    # — the file does not move, so neither value moves. A COPY into an image or a tmpfs root would
    # regenerate mtimes on every build or boot, and every recrawl would report "changed" for every
    # page. That is the exact failure this fixture exists to detect, so the server must not be the
    # thing producing it.
    #
    # Note the one caveat worth writing down: a fresh `git clone` sets mtimes to checkout time, so
    # the ABSOLUTE values differ between machines. Change detection compares a page against its
    # OWN previous crawl, not against a constant, so that is fine — but a test that hard-codes an
    # expected ETag string would be wrong, and would look correct on the machine it was written on.
    etag on;
    if_modified_since exact;

    # No compression, in either direction. `gzip on` would make the ETag weak (nginx prefixes W/)
    # and would introduce Vary: Accept-Encoding, so the stored representation would depend on what
    # the client happened to advertise.
    gzip off;
    gzip_static off;
    # Accept-Encoding must not select between variants either.
    gzip_vary off;

    # Content-Type comes straight from mime.types: .html -> text/html, .xml -> text/xml,
    # .txt -> text/plain. `charset` is left OFF (the nginx default) on purpose: turning it on
    # APPENDS "; charset=utf-8" to Content-Type, which is a header the server invented. The fixture
    # pages carry their own <meta charset>, which is where the encoding declaration belongs.
    default_type application/octet-stream;

    # No directory listing. Required explicitly even though it is the nginx default, because an
    # autoindex page is a crawlable page that exists in no sitemap and in no manifest — it would
    # give the crawler link targets rag-eval-engineer never authored, and the extra "pages" would
    # move every count-based assertion.
    autoindex off;

    # No server version in the Server header. Not a secret, but it is one more way a header can
    # differ between environments.
    server_tokens off;

    # ============================================================================================
    # VERBATIM SERVING
    # ============================================================================================
    location / {
        # `try_files $uri $uri/ =404` and NOT a fallback to /index.html. An SPA-style fallback would
        # serve 200 + the home page for every mistyped URL, so a broken link in the fixture would
        # look like a valid page and `internal/staging.html` being unreachable could never be
        # distinguished from it being served.
        try_files $uri $uri/index.html =404;

        # No add_header of any kind here. Not CSP, not X-Content-Type-Options, not
        # Cache-Control. Those are correct for a real site and wrong for a fixture: the crawler's
        # own handling of caching and content-type headers is under test, and a header this server
        # supplies would be a header the test never wrote.
    }

    # /internal/ is NOT blocked here, deliberately.
    # It is disallowed by the fixture's own robots.txt and linked from no page. The test is whether
    # the CRAWLER enforces scope — a 403 from the origin would make an over-eager crawler pass,
    # which is the single failure this fixture is best at catching: a bot that answers a question
    # correctly, from a document it was told not to read. The page must be fetchable and must go
    # unfetched.

    # A minimal, static 404. The default nginx error page is version-dependent HTML; this keeps the
    # not-found body identical across nginx releases so a test that asserts on it does not drift.
    error_page 404 = @notfound;
    location @notfound {
        internal;
        default_type text/plain;
        return 404 "404\n";
    }
}
