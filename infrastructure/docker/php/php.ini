; infrastructure/docker/php/php.ini
; COPY'd into the core-api image at build time (see services/core-api/Dockerfile).
; It is not bind-mounted: production forbids source bind mounts, and a php.ini that differs
; between dev and prod is how a streaming bug becomes "works on my machine".
;
; WSL2 note: this file must have LF line endings. A CRLF php.ini is parsed with the \r attached to
; every value, so `output_buffering=0\r` becomes a non-numeric string, and PHP falls back to the
; default with no warning. .gitattributes enforces it (`* text=auto eol=lf`).

; ================================================================================================
; STREAMING — the four settings that decide whether SSE works
; ================================================================================================
; php.ini-production ships output_buffering=4096. With it, nothing reaches the client until 4 KB of
; events exist, so a short answer arrives all at once at the end and a long one arrives in jerks.
; The failure is invisible under `curl` on the same host and only shows through the full edge.
output_buffering = 0

; zlib compression buffers the whole body to compress it. Same blob, different mechanism.
zlib.output_compression = Off

; Left at the default (Off) ON PURPOSE. PHP only learns the client is gone the next time it tries
; to WRITE, and the chat relay handles that itself: it calls ignore_user_abort(true) for its own
; request, then polls connection_aborted() after each heartbeat write, and cancels the upstream
; PSR request when it flips. Forcing this On globally would make EVERY aborted request run to
; completion — including the case this is supposed to catch, where a dropped tab otherwise leaves
; the provider generating and billing an answer nobody will receive, with nothing logged.
ignore_user_abort = Off
implicit_flush = Off

; ================================================================================================
; RESOURCE LIMITS
; ================================================================================================
; 512M is generous for a control plane and is deliberate: uploads stream through PHP (there is no
; presigned URL anywhere in this codebase), and so do downloads. Storage::get() on a 400 MB
; original is an OOM, not a slow response — MultipartUploader in, response()->stream() out.
memory_limit = 512M

; max_execution_time does not count time spent streaming output or in most stream_select waits, so
; it is not what bounds a chat. The real ceilings are FPM's request_terminate_timeout (per pool,
; see fpm-*.conf) and Laravel's own relay deadline.
max_execution_time = 60

; Must be >= the Traefik upload-cap middleware (104857600) and >= Laravel's own validated cap.
; The edge, PHP and the application each enforce the same number independently; any one of them
; being lower turns a documented 413 into an opaque failure at a different layer.
upload_max_filesize = 100M
post_max_size = 105M
max_file_uploads = 20

; ================================================================================================
; ERRORS AND DISCLOSURE
; ================================================================================================
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr          ; stdout/stderr JSON, collected by the Collector's file_log receiver
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ================================================================================================
; OPCACHE
; ================================================================================================
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; 0 means "never stat the file". Correct for an immutable image; catastrophic with a dev bind
; mount, where no source edit is ever picked up. compose.override.yaml sets validate_timestamps=1.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1        ; attributes and annotations need them; disabling breaks Laravel

; ================================================================================================
; SESSIONS
; ================================================================================================
; Laravel does not use native PHP sessions, so the famous "one tab blocks the others, fix with
; session_write_close()" advice is cargo on this stack — Laravel's handlers take no request-long
; lock. What does survive is: keep session middleware off the token-authenticated stream routes.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; ================================================================================================
; MISC
; ================================================================================================
date.timezone = UTC
realpath_cache_size = 4096K
realpath_cache_ttl = 600
