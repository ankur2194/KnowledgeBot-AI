# infrastructure/docker/php/nginx-api.conf
# Selected by `command: ["kb-serve", "api"]`.
#
# WHY NGINX IS IN THIS IMAGE AT ALL, rather than being its own Compose service:
# Traefik v3 has no FastCGI provider — it speaks HTTP to a backend and nothing else — so something
# must translate HTTP to FastCGI. A separate `nginx` service would have to sit on both `edge` (to
# receive from Traefik) and `application` (to reach php-fpm), which would make it a THIRD member of
# the edge-intersect-application set that is closed at exactly {laravel-api, laravel-api-stream}.
# Collapsing nginx and php-fpm into one container keeps that set closed. The cost is two processes
# per container, which kb-serve handles with explicit signal forwarding.

worker_processes auto;
error_log /dev/stderr warn;
# ------------------------------------------------------------------------------------------------
# EVERY WRITABLE PATH IS UNDER /tmp, AND THAT IS NOT TIDINESS.
# ------------------------------------------------------------------------------------------------
# nginx needs to write a pid file and a client-body temp directory before it will serve anything,
# and both defaults are unwritable here in BOTH deployment shapes:
#   * PRODUCTION runs `user: "10001:10001"` with `read_only: true`. /var/run is a symlink to /run,
#     root-owned 0755 and NOT chowned by the image (the Dockerfile's `mkdir -p /var/run` is a no-op
#     on a path that already exists), so `pid /var/run/nginx.pid` fails even as the image's own
#     user — verified by running the image directly. And compose.prod.yaml tmpfs-mounts
#     `/var/cache/nginx`, which is the ALPINE nginx path; this is a Debian image, where nginx uses
#     /var/lib/nginx. So the read-only root would have blocked the body temp dir too.
#   * DEVELOPMENT runs as the host uid so it can read the host-owned bind mount and the mode-600
#     secrets, and /var/lib/nginx is chowned to 10001 in the image. MEASURED:
#         [emerg] mkdir() "/var/lib/nginx/body" failed (13: Permission denied)
#     on a loop, with `restart: unless-stopped` retrying forever.
# /tmp is already tmpfs in compose.prod.yaml and is 1777 in the image, so it is writable by any uid
# under any hardening. Pointing every temp path here makes the config independent of which uid runs
# it, which is the property that was missing.
pid /tmp/nginx.pid;
daemon off;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;

    # The five temp paths belong to the `http` context (only `pid` is main-context). Same
    # reason as the comment above main: /tmp is the one directory writable by every uid this
    # image runs as, in dev and under the production read-only root alike.
    client_body_temp_path /tmp/nginx-client-body;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    proxy_temp_path /tmp/nginx-proxy;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    default_type  application/octet-stream;

    # Access logging is OFF here. The edge already logs, with a field ALLOW-LIST (Traefik's
    # accessLog drops RequestPath because url.String() carries the query string, and one
    # GET ?q=<question> would put tenant text into Loki). A second, unfiltered access log in this
    # container would reintroduce exactly what the allow-list removed.
    access_log off;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 75s;

    # Must be >= Traefik's upload-cap (104857600) and >= php.ini post_max_size, or the 413 comes
    # from the wrong layer with no error_class the client can branch on.
    client_max_body_size 105M;
    client_body_buffer_size 256k;
    client_body_timeout 60s;

    # Compression is Traefik's job, with text/event-stream excluded. Doing it here as well would
    # double-compress and, worse, would apply to responses Traefik deliberately exempts.
    gzip off;

    upstream php_api {
        server 127.0.0.1:9000;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /app/public;
        index index.php;

        # Laravel's built-in health route. The container healthcheck hits it via `php -r` rather
        # than through nginx, so this exists for the load balancer, not for the probe.
        location = /up {
            try_files $uri /index.php?$query_string;
        }

        # FPM's status and ping pages must never be reachable from the network. They enumerate
        # request URIs, which on this service carry tenant identifiers.
        location ~ ^/_fpm-(status|ping)$ {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/index\.php(/|$) {
            # ABSOLUTE, like the `include /etc/nginx/mime.types` above — and for a reason that
            # only bites this file. nginx resolves a RELATIVE include against its `conf_prefix`,
            # which is the DIRECTORY OF THE -c FILE, not the compiled-in /etc/nginx prefix. This
            # config is mounted at /etc/nginx-confs/ and started as `nginx -c
            # /etc/nginx-confs/nginx-api.conf`, so a bare `include fastcgi_params;` resolved to
            # /etc/nginx-confs/fastcgi_params and nginx refused to start:
            #     [emerg] open() "/etc/nginx-confs/fastcgi_params" failed (2: No such file ...)
            # It is an [emerg] at startup, so the container exits and `restart: unless-stopped`
            # loops it — MEASURED: laravel-api and laravel-api-stream never came up, which means
            # the entire public edge had never served a request.
            include /etc/nginx/fastcgi_params;
            fastcgi_pass php_api;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $http_x_forwarded_proto;
            fastcgi_hide_header X-Powered-By;

            # 95s: just above the pool's request_terminate_timeout (90s), so a request that FPM
            # kills produces FPM's error rather than nginx's generic 504 with no PHP log line.
            fastcgi_read_timeout 95s;
            fastcgi_send_timeout 95s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;

            internal;
        }

        # A .php file anywhere other than the front controller is either an artifact of a bad
        # deploy or an upload that escaped the storage path. Neither should execute.
        location ~ \.php$ {
            return 404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
