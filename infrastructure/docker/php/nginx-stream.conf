# infrastructure/docker/php/nginx-stream.conf
# Selected by `command: ["kb-serve", "stream"]`. Serves ONE thing: text/event-stream chat.
#
# Everything below that differs from nginx-api.conf exists because nginx buffers by default and a
# buffered SSE stream is indistinguishable from a slow model: the client sees nothing for twenty
# seconds, then the whole answer at once. Nothing errors, nothing is logged, and the bug is
# invisible in the one place people test it (curl against the container).

worker_processes auto;
error_log /dev/stderr warn;
# ------------------------------------------------------------------------------------------------
# EVERY WRITABLE PATH IS UNDER /tmp, AND THAT IS NOT TIDINESS.
# ------------------------------------------------------------------------------------------------
# nginx needs to write a pid file and a client-body temp directory before it will serve anything,
# and both defaults are unwritable here in BOTH deployment shapes:
#   * PRODUCTION runs `user: "10001:10001"` with `read_only: true`. /var/run is a symlink to /run,
#     root-owned 0755 and NOT chowned by the image (the Dockerfile's `mkdir -p /var/run` is a no-op
#     on a path that already exists), so `pid /var/run/nginx.pid` fails even as the image's own
#     user — verified by running the image directly. And compose.prod.yaml tmpfs-mounts
#     `/var/cache/nginx`, which is the ALPINE nginx path; this is a Debian image, where nginx uses
#     /var/lib/nginx. So the read-only root would have blocked the body temp dir too.
#   * DEVELOPMENT runs as the host uid so it can read the host-owned bind mount and the mode-600
#     secrets, and /var/lib/nginx is chowned to 10001 in the image. MEASURED:
#         [emerg] mkdir() "/var/lib/nginx/body" failed (13: Permission denied)
#     on a loop, with `restart: unless-stopped` retrying forever.
# /tmp is already tmpfs in compose.prod.yaml and is 1777 in the image, so it is writable by any uid
# under any hardening. Pointing every temp path here makes the config independent of which uid runs
# it, which is the property that was missing.
pid /tmp/nginx.pid;
daemon off;

events {
    worker_connections 4096;   # connections here are long-lived by definition
}

http {
    include       /etc/nginx/mime.types;

    # The five temp paths belong to the `http` context (only `pid` is main-context). Same
    # reason as the comment above main: /tmp is the one directory writable by every uid this
    # image runs as, in dev and under the production read-only root alike.
    client_body_temp_path /tmp/nginx-client-body;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    proxy_temp_path /tmp/nginx-proxy;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    default_type  application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;

    # Streams are minutes long, so the keep-alive idle timer must not be the thing that decides
    # when a connection dies. Note idle timeouts do NOT cut an in-flight response — an active
    # stream is not idle — but a stingy value here creates churn between requests for no gain.
    keepalive_timeout 120s;

    client_max_body_size 1M;   # a chat message body; this route takes no upload
    client_body_timeout 30s;

    # gzip OFF. Compression buffers to fill a window before emitting, which withholds the head of
    # the stream. Traefik excludes text/event-stream from its own compressor for the same reason;
    # re-adding it here would defeat that exclusion one hop later.
    gzip off;

    upstream php_stream {
        server 127.0.0.1:9001;
        keepalive 32;
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /app/public;
        index index.php;

        location = /up {
            try_files $uri /index.php?$query_string;
        }

        location ~ ^/_fpm-(status|ping)$ {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/index\.php(/|$) {
            # ABSOLUTE, like the `include /etc/nginx/mime.types` above — and for a reason that
            # only bites this file. nginx resolves a RELATIVE include against its `conf_prefix`,
            # which is the DIRECTORY OF THE -c FILE, not the compiled-in /etc/nginx prefix. This
            # config is mounted at /etc/nginx-confs/ and started as `nginx -c
            # /etc/nginx-confs/nginx-stream.conf`, so a bare `include fastcgi_params;` resolved to
            # /etc/nginx-confs/fastcgi_params and nginx refused to start:
            #     [emerg] open() "/etc/nginx-confs/fastcgi_params" failed (2: No such file ...)
            # It is an [emerg] at startup, so the container exits and `restart: unless-stopped`
            # loops it — MEASURED: laravel-api and laravel-api-stream never came up, which means
            # the entire public edge had never served a request.
            include /etc/nginx/fastcgi_params;
            fastcgi_pass php_stream;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $http_x_forwarded_proto;
            fastcgi_hide_header X-Powered-By;

            # ===================================================================================
            # THE FOUR LINES THIS FILE EXISTS FOR
            # ===================================================================================
            # fastcgi_buffering off: forward each FastCGI record to the client as it arrives
            # instead of accumulating into fastcgi_buffers first. Without it, the first ~32 KB of
            # SSE events sit in nginx.
            fastcgi_buffering off;
            # proxy_buffering off: nginx does not proxy here, but the directive is inherited by any
            # proxy_pass a future edit adds, and its default is `on`. Setting it now means the next
            # person who adds a proxy_pass to this file does not silently reintroduce the bug.
            proxy_buffering off;
            # Laravel already emits this header; nginx honours it and strips it before the client.
            # Setting it here too means the stream survives a self-hoster's own nginx in front.
            fastcgi_param HTTP_X_ACCEL_BUFFERING no;
            # A stream is a single chunked response. Turning this off would force
            # Content-Length-or-close semantics and break incremental delivery on HTTP/1.1.
            chunked_transfer_encoding on;
            # ===================================================================================

            # 140s: above the stream pool's request_terminate_timeout (130s), so FPM's own
            # termination is what ends a runaway request and it lands in the PHP log. Below the
            # container's stop_grace_period (150s).
            fastcgi_read_timeout 140s;
            fastcgi_send_timeout 140s;

            internal;
        }

        location ~ \.php$ {
            return 404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
