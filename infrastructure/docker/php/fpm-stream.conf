; infrastructure/docker/php/fpm-stream.conf
; The FPM pool for `laravel-api-stream` — the SSE chat relay, and nothing else.
; Selected at runtime by `command: ["kb-serve", "stream"]`.
;
; ONE STREAMED ANSWER PINS ONE CHILD FOR ITS ENTIRE LIFE. Twenty seconds of retrieval and
; generation is twenty seconds of one slot. So this pool is sized against CONCURRENT STREAMS, not
; against requests per second, and it is a separate pool precisely so that a burst of chats cannot
; starve the admin API.

[global]
error_log = /dev/stderr
daemonize = no
log_limit = 8192

[stream]
user = app
group = app

listen = 127.0.0.1:9001
listen.allowed_clients = 127.0.0.1

; STATIC, not dynamic. Every child is expected to be busy for minutes at a time, so the spare-server
; heuristics have nothing useful to measure and dynamic scaling just adds fork latency to the front
; of a request whose whole SLO is first-token time.
pm = static
pm.max_children = 40

; DO NOT SET pm.max_requests HERE.
; Recycling a child mid-stream terminates a live answer. The child is long-lived by design; bound
; its memory with php.ini's memory_limit and let the container's stop_grace_period (150s) handle
; the rest.

; 130s: the chat deadline is 60s (kb-error-taxonomy) and Laravel's relay hard-codes +55_000 ms, so
; 115s is the longest legitimate request; +15s of margin. The container's stop_grace_period is
; 150s, which must stay ABOVE this or a deploy SIGKILLs a stream FPM would have finished.
; Do NOT set this to 0 ("no limit"): a wedged upstream socket would then pin a child forever.
request_terminate_timeout = 130s
; No slowlog on this pool: every request here is legitimately slow, so a slowlog threshold either
; logs every chat or is useless. Latency lives in kb_chat_first_token_seconds.

pm.status_path = /_fpm-status
ping.path = /_fpm-ping

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
; The three settings that decide whether an answer streams or arrives as one blob. Restated at the
; pool level because this is the one pool where getting them wrong is a product defect rather than
; a performance note.
php_admin_value[output_buffering] = 0
php_admin_flag[zlib.output_compression] = off

; ignore_user_abort is deliberately NOT forced on here. Blanket-on means every aborted request
; runs to completion, including the ones you wanted killed. The relay calls ignore_user_abort(true)
; itself, for its own request only, and then polls connection_aborted() after each heartbeat
; write — the heartbeat IS the disconnect probe, because a loop blocked reading the upstream stream
; never learns anything. Forcing the flag here without the polling half gives you the worst
; combination: the client is gone, the script keeps running, and the provider keeps billing.

