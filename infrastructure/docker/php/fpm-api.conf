; infrastructure/docker/php/fpm-api.conf
; The FPM pool for `laravel-api` — ordinary admin and public API requests.
; Selected at runtime by `command: ["kb-serve", "api"]`; the file is COPY'd into the image, because
; production forbids bind mounts and the pool sizing must ship with the artifact it describes.
;
; The counterpart is fpm-stream.conf. THE TWO POOLS EXIST BECAUSE ONE STREAMED ANSWER PINS ONE FPM
; CHILD FOR ITS ENTIRE LIFE. On a shared pool, a burst of chats exhausts pm.max_children and takes
; the admin dashboard down with it while the app looks completely idle.

[global]
error_log = /dev/stderr
daemonize = no
log_limit = 8192

[api]
user = app
group = app

; TCP on loopback rather than a unix socket: the container is read-only in production and a socket
; needs a writable directory; /var/run is tmpfs, but loopback removes the question entirely.
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

pm = dynamic
; Sized against REQUESTS, which is what this pool serves. Each child is bounded by php.ini's
; memory_limit (512M); 40 x 512M is the theoretical worst case, which is why the container limit
; is 1G and real per-request usage is an order of magnitude below the ceiling.
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
; Recycle children to bound leaked memory in long-lived processes. Not a substitute for fixing a
; leak; it is what stops one from becoming an outage overnight.
pm.max_requests = 500

; The real per-request ceiling. max_execution_time does not count streaming or most stream_select
; waits, so this is the number that actually kills a hung request. 90s > any legitimate admin
; request and < the service's 30s... no: it is deliberately ABOVE the healthcheck interval so a
; slow request never trips the probe, and BELOW anything that would outlive a deploy.
request_terminate_timeout = 90s
request_slowlog_timeout = 10s
slowlog = /dev/stderr

; Status page on loopback only. There is no Traefik router for it and no port published, so it is
; reachable exclusively via `docker compose exec`. It enumerates request URIs, which on this
; service include tenant identifiers.
pm.status_path = /_fpm-status
ping.path = /_fpm-ping

catch_workers_output = yes
decorate_workers_output = no

; Forward the container environment (env_file:) into the pool. FPM clears the environment by
; default, so without these Laravel sees no DB_HOST and fails at boot with a confusing
; "connection refused to 127.0.0.1" — the default host, not the configured one.
clear_env = no

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
; Restated at the pool level so a future php.ini edit cannot silently re-enable buffering here.
php_admin_value[output_buffering] = 0
php_admin_flag[zlib.output_compression] = off
