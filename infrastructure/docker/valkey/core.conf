# infrastructure/docker/valkey/core.conf — the `valkey-core` instance. Valkey 9.1.1.
#
# ================================================================================================
# WHY THERE ARE TWO VALKEY *SERVICES* AND NOT TWO LOGICAL DATABASES
# ================================================================================================
# maxmemory, maxmemory-policy, save and appendonly are all SERVER-level settings. `SELECT 3`
# changes none of them. So one instance cannot simultaneously guarantee "never lose a queued job"
# and "shed cold cache under pressure" — and getting it wrong deletes queued jobs SILENTLY, because
# an eviction is not an error anywhere. Kombu at least raises InconsistencyError when its
# _kombu.binding.* keys are evicted; Laravel's Lua scripts read an evicted queues:* key as an empty
# queue and an evicted lock key as "the lock is free", with no exception in either direction.
#
# This instance holds, in order of how badly each fails when lost:
#   db 0  Laravel queues (queues:{name}, :delayed, :reserved, :notify) AND Laravel's DEFAULT cache
#         store — Cache::lock(), WithoutOverlapping, ShouldBeUnique, RateLimited, the
#         queue:restart/queue:pause signals, and both scheduler mutexes. Every one of those fails
#         OPEN when its key disappears.
#   db 1  Celery broker (ingest/embed/crawl/evaluate/maintenance, unacked, unacked_index,
#         _kombu.binding.*, *.pidbox)
#   db 2  coordination: idem:, nonce:, lock:, fence:, cb:, rl:, ansidx:
#   db 3  Horizon
# Everything here is either absence-sensitive (breakers, limiters, locks, nonces, idempotency all
# fail open when missing) or is a job that would vanish.

################################## NETWORK ##################################
bind 0.0.0.0
port 6379
protected-mode no
# No `requirepass`. Authentication is per-service ACL users (users.acl) — a shared password is one
# credential for four workloads, and Valkey 9.1's database-level ACL is what turns the logical-DB
# split from a naming convention into an enforced boundary.
tcp-keepalive 300
timeout 0

################################## MEMORY ###################################
maxmemory 1gb

# ================================================================================================
# noeviction. NOT a performance knob — the correctness contract.
# ================================================================================================
# At the ceiling, WRITES START FAILING LOUDLY. That is the intended behaviour: a failed enqueue is
# an error someone sees, whereas an eviction is a job that silently ceased to exist.
# Alert on redis_memory_used_bytes / maxmemory WELL before the ceiling, and never "fix" a full core
# instance by switching this to an eviction policy. The one family whose cardinality an attacker
# controls is rl: (distinct rate-limit subjects x 2 windows), so size maxmemory against that —
# and key IPv6 subjects on the /64 prefix, because a single /64 allocation is 2^64 distinct keys.
maxmemory-policy noeviction
maxmemory-samples 5

################################ PERSISTENCE ################################
# AOF everysec, for RESTART durability. This is NOT a backup: restoring valkey-core from a backup
# resurrects stale reservations and spent idempotency records, so the ops/backup.sh scope excludes
# it deliberately and by name.
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# RDB alongside the AOF, for fast restart only. Deliberately sparse: this instance holds no tenant
# text, so a snapshot here is an operational convenience rather than a data-retention question —
# which is exactly the opposite of valkey-cache, where the absence of both is the erasure control.
save 900 1
save 300 10
dir /data
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

################################### ACL #####################################
# users.acl is mounted into BOTH instances. It has NO COMMENT SYNTAX — `#` introduces a password
# hash, so a `#` line aborts startup with "should start with user keyword", and a `\` continuation
# is a syntax error. One `user` line per user, blank lines only. Every word of explanation lives in
# ./README.md instead; read it before editing a rule.
aclfile /etc/valkey/users.acl

################################## LIMITS ###################################
databases 16
# Slow-query log for capacity forensics. Never for invalidation: SCAN only guarantees keys present
# for the whole iteration, so a `SCAN MATCH ans:{org}:*` sweep is full-keyspace work that proves
# nothing about keys written mid-iteration — which is precisely the read-repopulate case.
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

############################### NOTIFICATIONS ###############################
# Keyspace notifications stay OFF. The `expired` event fires when the server DELETES a key —
# lazily, or on the active expiry cycle — not at logical expiry, and pub/sub is fire-and-forget
# with no replay for a disconnected subscriber. Cache invalidation is an explicit call in the
# deletion path (invalidate_source, twice: phase 1 and end of phase 2), never a notification.
notify-keyspace-events ""

################################ APPEND-ONLY ################################
lazyfree-lazy-eviction no
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
