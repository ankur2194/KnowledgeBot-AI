# infrastructure/docker/valkey/cache.conf — the `valkey-cache` instance. Valkey 9.1.1.
#
# ================================================================================================
# THIS INSTANCE IS THE ONLY PLACE TENANT TEXT LIVES IN VALKEY, AND IT NEVER TOUCHES DISK.
# ================================================================================================
# It holds the answer cache (ans:), the retrieval cache (retr:), the resolved-config cache (cfg:)
# and the quota read-through (quota:). Answers are model output over retrieved customer documents —
# the most sensitive object in the product.
#
# The erasure control is composed of three things, and all three are load-bearing:
#   1. save ""        — no RDB, ever
#   2. appendonly no  — no AOF, ever
#   3. NO VOLUME on the Compose service, and `read_only: true` in the production overlay
# A TTL is NOT a deletion guarantee: expired keys stay resident until lazily touched or sampled by
# the active cycle (which tolerates ~10% expired keys at any moment), and an RDB written BEFORE
# expiry stores the value together with its TTL. So "the TTL passed" says nothing about the bytes.
# "Nothing was ever written" is the only provable posture, and it is the reason an erasure request
# can be signed off honestly.
#
# Do not add a volume here to "make restarts faster". Losing this instance costs a latency spike
# and nothing else.

################################## NETWORK ##################################
bind 0.0.0.0
port 6379
protected-mode no
tcp-keepalive 300
timeout 0

################################## MEMORY ###################################
maxmemory 2gb

# allkeys-lru — the opposite policy to valkey-core, which is the entire reason this is a separate
# server process rather than another SELECT on the same one.
#
# WHAT MUST NEVER LAND HERE, because every one of these fails OPEN when evicted:
#   * Laravel's DEFAULT cache store (Cache::lock, WithoutOverlapping, RateLimiter, scheduler
#     mutexes) — an evicted lock key reads as "free", so a nightly sweep runs once per replica and
#     a WithoutOverlapping job double-executes, with every lock call returning "acquired".
#   * circuit-breaker state (cb:) — absent state reads as healthy, so the breaker "closes"
#     mid-outage and every worker stampedes a sick provider.
#   * the ansidx: reclamation index — on an LRU instance the index is evicted before the answers it
#     tracks, and the deletion check then reports "no cache entries for this source" about answers
#     that are still readable.
# From Laravel this instance is reachable ONLY as Cache::store('ephemeral').
maxmemory-policy allkeys-lru
maxmemory-samples 5

################################ PERSISTENCE ################################
# Empty string disables RDB snapshotting entirely. This is not the same as omitting `save` lines —
# omitting them inherits the compiled-in defaults (900/300/60), which would write snapshots.
save ""
appendonly no
# `dir` still has to be somewhere writable for the server to start even with persistence off; in
# production the container is read_only with /data on tmpfs, so this path is RAM.
dir /data
stop-writes-on-bgsave-error no

################################### ACL #####################################
# The SAME file as valkey-core mounts, and the compose service MUST mount it -- but NOT for the
# reason this comment used to give. Valkey does not refuse to start when `aclfile` names a path
# that is not there: measured on valkey:9.1.1, it starts cleanly and enables
# `user default on nopass ~* &* +@all`. The mount is mandatory because its absence is a SILENT
# fail-open, which is worse. An ACL user is a service identity, not a
# per-server credential — kb-core reaches this instance as Cache::store('ephemeral') with the same
# password and a different key grant. No comment syntax in that file; see ./README.md.
aclfile /etc/valkey/users.acl

################################## LIMITS ###################################
# ONE logical database. There is nothing to separate: everything here is evictable cache, and a
# second DB would only invite someone to put a lock in it.
databases 1

slowlog-log-slower-than 10000
slowlog-max-len 128

############################### NOTIFICATIONS ###############################
# Off, same reasoning as core: `expired` fires on server-side deletion, not at logical expiry, and
# has no replay. Invalidation is an explicit call in the deletion path.
notify-keyspace-events ""

############################## MEMORY RECLAIM ###############################
# UNLINK-style off-thread freeing for evictions and expiries. The invalidation path calls UNLINK
# rather than DEL for the same reason: a source with 10 000 tracked answer keys should not block
# the server while they are freed.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
