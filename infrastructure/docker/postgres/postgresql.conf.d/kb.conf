# infrastructure/docker/postgres/postgresql.conf.d/kb.conf — PostgreSQL 18.
# Included via `-c include_dir=/etc/postgresql/conf.d`. Later settings win, so everything here
# overrides the image defaults.
#
# Sized for the compose.yaml container limit of 4G. If you change that limit, change these — a
# shared_buffers above the cgroup limit gets the postmaster OOM-killed under load rather than
# swapping, and the crash looks like a hardware fault.

# ================================================================================================
# MEMORY
# ================================================================================================
shared_buffers = 1GB                # ~25% of the container limit
effective_cache_size = 3GB          # a PLANNER HINT ONLY; it allocates nothing. Setting it too low
                                    # makes the planner assume index pages are not cached and pick
                                    # sequential scans on tenant-scoped queries that have an index.
work_mem = 16MB                     # PER SORT/HASH NODE, per backend — not per query and not per
                                    # connection. One query with six hash joins across forty
                                    # connections is 3.8 GB, which is why this is not larger.
maintenance_work_mem = 256MB        # CREATE INDEX CONCURRENTLY and autovacuum
effective_io_concurrency = 200      # SSD
random_page_cost = 1.1              # SSD. The 4.0 default is spinning-disk arithmetic and is what
                                    # makes the planner refuse a perfectly good index scan.

# ================================================================================================
# CONNECTIONS
# ================================================================================================
# listen_addresses IS NOT REDUNDANT HERE, AND REMOVING IT MAKES THE WHOLE STACK UNREACHABLE.
# The docker-library entrypoint does not pass this as a flag; it SEDs `listen_addresses = '*'` into
# $PGDATA/postgresql.conf. We start with `config_file=/etc/postgresql/postgresql.conf`, which does
# not include that file, so the sed never reaches us and PostgreSQL falls back to its BUILT-IN
# default of `localhost`. Measured on a first boot of this stack: the server logged
#     listening on IPv6 address "::1" ... listening on IPv4 address "127.0.0.1"
# and nothing else. `pg_isready` inside the container connects over the Unix socket, so the
# healthcheck went GREEN — the container reports healthy while no other container on `data` can
# open a connection at all. laravel-migrate would then fail, and every service gated on
# service_completed_successfully would never start, with the only visible symptom being a
# connection refusal that reads like a network problem.
# `*` and not a CIDR: `data` is `internal: true` and postgres publishes no port in production, so
# the reachable set is already the network, and an address list here would just be a second, weaker
# copy of that boundary that drifts when the subnet changes.
listen_addresses = '*'

# Deliberately modest. The connection budget is spent by: laravel-api (40 FPM children),
# laravel-api-stream (40, each pinned for the length of a stream), four Laravel workers, five
# Celery worker containers with prefork children, and the scheduler. PgBouncer in TRANSACTION mode
# sits in front of that in any deployment that outgrows this number.
max_connections = 200
superuser_reserved_connections = 5

# ================================================================================================
# THE TWO TIMEOUTS THAT ARE CORRECTNESS SETTINGS, NOT TUNING
# ================================================================================================
# Never call Qdrant, SeaweedFS, or a provider inside an open transaction. The vector store is not
# transactional (a rollback leaves the points) and — the part that bites the whole database — an
# HTTP round trip inside a transaction pins xmin for its duration, so autovacuum stops reclaiming
# dead tuples DATABASE-WIDE. One slow upsert inside a transaction degrades every table.
idle_in_transaction_session_timeout = 15s
statement_timeout = 60s             # matches the chat deadline; migrations override it per session

# A DDL statement takes ACCESS EXCLUSIVE, which blocks READERS — and PostgreSQL's lock queue is
# ORDERED, so a DDL waiting behind one 30-second analytics query blocks every request that arrives
# after it. A migration that fails fast ten times is a non-event; a migration that waits is an
# outage. Migrations set this themselves too; this is the floor.
lock_timeout = 3s

deadlock_timeout = 1s

# ================================================================================================
# WAL / CHECKPOINTS / PITR
# ================================================================================================
wal_level = replica                 # enough for PITR and streaming replication
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
wal_compression = zstd
# archive_mode/archive_command are intentionally NOT set here. Point-in-time recovery needs a
# destination that outlives this host, so it is a deployment decision, not an image default. A
# committed archive_command pointing at a local path is a backup that dies with the machine.
# archive_mode = on
# archive_command = '...'

# ================================================================================================
# AUTOVACUUM
# ================================================================================================
# `chunks` and `document_elements` reach hundreds of millions of rows and are insert-heavy; the
# default scale factors mean autovacuum waits for 20% of a 300M-row table before it runs.
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 2000

# ================================================================================================
# LOGGING — collected from stdout by the Collector's `file_log` receiver
# ================================================================================================
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 500ms  # slow queries only; logging every statement puts tenant data
                                    # (bind parameters include question text) into a store with no
                                    # per-tenant access control
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_lock_waits = on                 # this is how you find the DDL that queued behind a report
log_temp_files = 16MB               # a temp file means work_mem was exceeded
log_autovacuum_min_duration = 1s
log_statement = 'ddl'               # DDL only. 'all' or 'mod' logs parameter values.
log_error_verbosity = default
log_timezone = 'UTC'
timezone = 'UTC'

# ================================================================================================
# LOCALE / COLLATION
# ================================================================================================
# Ids are char(26) COLLATE "C" at the COLUMN level, which is what makes comparison memcmp and pins
# the ordering to bytes forever. Without it a text index sorts through ICU/glibc, and the ordering
# is a property of the LIBRARY VERSION — a base-image bump can leave a b-tree whose order no longer
# matches its collation, and lookups then miss rows that are present, silently. The column-level
# COLLATE is the enforcement; this is a defensive second layer.
default_text_search_config = 'pg_catalog.english'

# ================================================================================================
# NOT SET, DELIBERATELY
# ================================================================================================
# * No `row_security` / FORCE ROW LEVEL SECURITY. RLS is NOT the isolation mechanism here.
#   With PgBouncer in transaction pooling, `SET SESSION app.org_id` LEAKS THE PREVIOUS TENANT'S
#   VALUE onto the next client of that backend — RLS then authorizes cross-tenant reads with a
#   policy that reviews as correct. `SET LOCAL` is safe but only covers statements inside an
#   explicit transaction, and neither Laravel's default request path nor a Celery task wraps its
#   reads in one. Outside a transaction current_setting('app.org_id', true) is NULL, the policy
#   filters everything, the app breaks loudly, and the fix people reach for is a COALESCE — which
#   fails OPEN. Isolation is enforced in code at seven layers; RLS may be enabled in the CI
#   database against a NON-OWNER role purely as a tripwire, never as authorization.
# * No `shared_preload_libraries`. Adding one is a restart and a new failure mode; pg_stat_statements
#   is worth it and should be added deliberately, with the extension created in initdb.
