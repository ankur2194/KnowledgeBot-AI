# infrastructure/docker/postgres/postgresql.conf
#
# A SHIM, not the configuration. Every real setting is in conf.d/kb.conf.
#
# It exists because `include_dir` is a config-FILE preprocessor directive, not a GUC: it cannot be
# passed as `postgres -c include_dir=...`. So to load conf.d at all, postgres has to be started
# with `config_file=` pointing at a file that includes it — and once config_file lives outside the
# data directory, PostgreSQL stops inferring data_directory, hba_file and ident_file and refuses to
# start with "data directory must be specified". Hence the four lines below.
#
# Do not put settings here. A setting in two files is a setting that drifts, and the one that
# drifts is always the one that ships.

# THERE IS DELIBERATELY NO `data_directory` HERE, AND THAT IS A CORRECTION, NOT AN OMISSION.
#
# This file used to pin data_directory/hba_file/ident_file to '/var/lib/postgresql/data', on the
# stated reasoning that a config_file outside the data directory makes PostgreSQL stop inferring
# them. The reasoning is right for a bare `postgres` invocation and wrong for this image: the
# entrypoint exports PGDATA, postgres reads it, and the data directory is resolved before the
# config file is ever opened. Verified by booting the container with these three lines absent.
#
# The pin was also WRONG for postgres:18, which moved PGDATA to a major-version subdirectory
# (/var/lib/postgresql/18/docker). Replacing one hard-coded path with another just moves the same
# defect to the next major bump — a pinned '/var/lib/postgresql/18/docker' would silently point at
# an empty directory the day the image becomes :19-alpine, and initdb would run against it. PGDATA
# comes FROM the image, so it tracks the image.
#
# hba_file and ident_file are inferred from data_directory, so initdb's own generated files (built
# from POSTGRES_HOST_AUTH_METHOD and friends) stay in use — which was the intent of naming them.

# Loaded LAST, so everything in kb.conf overrides both the image defaults and anything initdb
# wrote into the data directory's own postgresql.conf.
include_dir = '/etc/postgresql/conf.d'
